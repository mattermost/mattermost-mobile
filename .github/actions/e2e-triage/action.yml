# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: E2E triage for one lane
description: >-
  One lane of the e2e-detox-pr.yml tsio-triage job: download the lane's triage
  evidence, restore the answers cache, run the toolkit e2e/triage action, and
  save the answers cache. Every run step here is a pinned action, so the code
  that runs with the API key is the toolkit at its pin. The caller checks this
  action out from the dispatch ref, not the branch under test.

inputs:
  job-key:
    description: Lane key from calculate-tsio-identity (matrix.job-key)
    required: true
  composite-identity:
    description: Lane composite identity as JSON (job-configs[key].composite_identity)
    required: true
  status-context:
    description: Commit status context the lane writes (job-configs[key].status_context)
    required: true
  github-token:
    description: Token with statuses write and pull-requests read (secrets.GITHUB_TOKEN)
    required: true
  anthropic-api-key:
    description: Triage judge key (secrets.ANTHROPIC_API_KEY); without it only the history rules run
    required: true
  mode:
    description: report-only or enforce (vars.E2E_TRIAGE_MODE)
    required: false
    default: report-only
  triage-status-context:
    description: Shared PR-wide triage check context, or "off" for parallel per-lane triage consolidated at the end
    required: false
    default: "off"
  triage-lanes:
    description: Comma-separated commit-status contexts the one PR-wide triage check summarises
    required: false
    default: e2e-test/detox-ios,e2e-test/detox-ipad,e2e-test/detox-android,e2e-test/maestro-ios,e2e-test/maestro-android
  rerun-attempts:
    description: Automatic re-runs a lane red only on infrastructure may get (see e2e-tests-rerun.yml); 0 turns it off. The calling job needs actions read.
    required: false
    default: "0"
  lane-job-filter:
    description: Optional comma-separated substrings scoping lane job reads in flat-job workflows; empty derives from job-key
    required: false
    default: ""
  history-lane:
    description: Optional TSIO lane name whose history is queried when the tested branch has too few runs
    required: false
    default: ""
  history-report:
    description: Optional TSIO report_name prefix whose history is queried (defaults to report_name)
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Each lane uploads what it saw at every failed test: Detox the screenshot and the
    # app's busy report, Maestro the failure screenshot, the step it stopped at and the
    # app's own errors. The judge reads them as producer evidence.
    - name: Download triage evidence
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: triage-evidence-${{ inputs.job-key }}-*
        path: triage-evidence
    # Answers from earlier runs on the same PR (the same commit on master), so a re-run
    # does not pay for the same question twice. The file also keeps this lane's AI spend
    # on the PR, for the per-PR budget (pr-budget-usd, $2 by default, split between the
    # lanes). Restore and save are separate steps: the cache action saves only when the
    # job succeeds, and a red run is the one most likely to be re-run.
    - name: Restore triage answers
      if: always()
      continue-on-error: true
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: e2e-triage-answers.json
        key: e2e-triage-answers-${{ inputs.job-key }}-${{ fromJSON(inputs.composite-identity).gh_pr_number && format('pr{0}', fromJSON(inputs.composite-identity).gh_pr_number) || fromJSON(inputs.composite-identity).commit_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: e2e-triage-answers-${{ inputs.job-key }}-${{ fromJSON(inputs.composite-identity).gh_pr_number && format('pr{0}', fromJSON(inputs.composite-identity).gh_pr_number) || fromJSON(inputs.composite-identity).commit_sha }}-
    # A triage failure must never change the outcome of the E2E run itself.
    - name: e2e/triage
      continue-on-error: true
      uses: mattermost/mattermost-test-automation-toolkit/actions/e2e-test-triage@main # actions/e2e-test-triage
      with:
        composite-identity: ${{ inputs.composite-identity }}
        status-context: ${{ inputs.status-context }}
        triage-status-context: ${{ inputs.triage-status-context }}
        triage-lanes: ${{ inputs.triage-lanes }}
        lane: ${{ inputs.job-key }}
        lane-job-filter: ${{ inputs.lane-job-filter || (contains(inputs.job-key, 'maestro-ios') && 'maestro-ios,Maestro iOS,build-ios-simulator,provision,Validate Maestro' || (contains(inputs.job-key, 'maestro-android') && 'maestro-android,Maestro Android,build-android-apk-maestro,provision,Validate Maestro' || (contains(inputs.job-key, 'detox-ios') && 'detox-ios,Detox iOS,build-ios-simulator,provision' || (contains(inputs.job-key, 'detox-ipad') && 'detox-ipad,build-ios-simulator,provision' || (contains(inputs.job-key, 'detox-android') && 'detox-android,Detox Android,build-android-apk,provision,!maestro' || inputs.job-key))))) }}
        history-lane: ${{ inputs.history-lane }}
        history-report: ${{ inputs.history-report }}
        evidence-dir: triage-evidence
        test-root: .
        # A failure in an unchanged spec is "merge main" when main changed the code it runs through.
        support-paths: detox/e2e/support,detox/maestro/lib,detox/maestro/subflows,detox/maestro/fixtures
        github-token: ${{ inputs.github-token }}
        # The PR changes the app, which can't take the separate test server down or put a
        # proxy page in front of it: a test that failed on that environment is not the PR's.
        infra-clears: "true"
        anthropic-api-key: ${{ inputs.anthropic-api-key }}
        mode: ${{ inputs.mode }}
        answers-cache: e2e-triage-answers.json
        rerun-attempts: ${{ inputs.rerun-attempts }}
        findings-file: e2e-triage-findings.json
    # The verdict on each failed test, which the channel message reads (tsio-channel-notify).
    - name: Upload triage findings
      if: always() && hashFiles('e2e-triage-findings.json') != ''
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        # One artifact per attempt: the channel message of a re-run reads only that attempt's verdicts.
        name: e2e-triage-findings-${{ inputs.job-key }}-a${{ github.run_attempt }}
        path: e2e-triage-findings.json
        retention-days: 1
    - name: Save triage answers
      if: always() && hashFiles('e2e-triage-answers.json') != ''
      continue-on-error: true
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: e2e-triage-answers.json
        key: e2e-triage-answers-${{ inputs.job-key }}-${{ fromJSON(inputs.composite-identity).gh_pr_number && format('pr{0}', fromJSON(inputs.composite-identity).gh_pr_number) || fromJSON(inputs.composite-identity).commit_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
