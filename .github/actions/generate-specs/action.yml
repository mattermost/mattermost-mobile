name: "generate-specs"
description: This action used to split Detox integration tests based on the parallelism provided

inputs:
  search_path:
    description: The path to look for from within the directory
    required: true
  parallelism:
    description: The parallelism for the tests
    required: true
  device_name:
    description: The name of Device used for the tests
    required: false
    default: "iPhone 15"
  device_os_version:
    description: The os of the device used for the tests
    required: false
    default: "iOS 17.1"
  durations_file:
    description: >-
      Optional spec-duration manifest (from .github/actions/s3-spec-durations).
      When present, specs are bin-packed by recorded duration instead of split
      into equal counts. Absent/unreadable falls back to the even split.
    required: false
    default: ""
  spec_list:
    description: >-
      Explicit whitespace/newline-separated spec files. When set, only these
      files are scheduled instead of discovering the full suite. Missing files
      are an error.
    required: false
    default: ""

outputs:
  specs:
    description: The specs generated for the strategy
    value: ${{ steps.generate-specs.outputs.specs }}
  report_count:
    description: Number of matrix shards expected to upload a report
    value: ${{ steps.generate-specs.outputs.report_count }}
runs:
  using: "composite"
  steps:
    - name: ci/generate-specs
      id: generate-specs
      env:
        PARALLELISM: ${{ inputs.parallelism }}
        SEARCH_PATH: ${{ inputs.search_path }}
        DEVICE_NAME: ${{ inputs.device_name }}
        DEVICE_OS_VERSION: ${{ inputs.device_os_version }}
        DURATIONS_FILE: ${{ inputs.durations_file }}
        SPEC_LIST: ${{ inputs.spec_list }}
      run: |
        # pipefail: without it, `node ... | tee` reports tee's exit status, so a
        # crash in split-tests.js would leave output.json empty and be treated as
        # a successful split.
        set -eo pipefail
        node "${{ github.action_path }}/split-tests.js" | tee output.json
        if [ ! -s output.json ]; then
          echo "::error::split-tests.js produced no matrix output."
          exit 1
        fi
        echo "specs=$(cat output.json)" >> "$GITHUB_OUTPUT"
        REPORT_COUNT=$(node -e 'const fs=require("fs"); const matrix=JSON.parse(fs.readFileSync("output.json", "utf8")); process.stdout.write(String((matrix.include || []).length));')
        echo "report_count=$REPORT_COUNT" >> "$GITHUB_OUTPUT"
      shell: bash
