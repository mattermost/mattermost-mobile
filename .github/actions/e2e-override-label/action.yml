# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Resolve E2E/Override label
description: >-
  Report whether E2E/Override is currently set on a PR, so a TSIO result landing
  after the label was applied does not re-red a check the maintainer bypassed.

  The lookup lives here rather than in detox/utils/tsio-report-status.js: talking
  to GitHub belongs in the Actions layer, and the reporter stays a utility that
  acts on its inputs.

inputs:
  pr_number:
    description: Pull request number. Empty for main / CMT runs, where no label can apply.
    required: false
    default: ''
  commit_sha:
    description: Commit SHA whose AI triage status must authorize E2E/AI-Waived
    required: false
    default: ''

outputs:
  override:
    description: '"true" when E2E/Override is set on the PR, "false" otherwise'
    value: ${{ steps.check.outputs.override }}
  ai_waived:
    description: >-
      '"true" when E2E/AI-Waived is set on the PR, "false" otherwise. Kept
      separate from `override` on purpose: a human deciding to merge anyway and
      automated triage classifying a failure as not-your-fault are different
      claims, and conflating them makes the triage false-green metric
      uncomputable.'
    value: ${{ steps.check.outputs.ai_waived }}

runs:
  using: composite
  steps:
    - id: check
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        PR_NUMBER: ${{ inputs.pr_number }}
        COMMIT_SHA: ${{ inputs.commit_sha }}
      with:
        script: |
          const prNumber = parseInt(process.env.PR_NUMBER, 10);
          if (!Number.isFinite(prNumber)) {
            core.info('No PR number for this run — no waiver label can apply.');
            core.setOutput('override', 'false');
            core.setOutput('ai_waived', 'false');
            return;
          }

          try {
            const labels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const names = new Set(labels.map((label) => label.name));
            const override = names.has('E2E/Override');
            let aiWaived = false;
            if (names.has('E2E/AI-Waived') && process.env.COMMIT_SHA) {
              const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: process.env.COMMIT_SHA,
                per_page: 100,
              });
              const triageStatus = statuses.find((status) => status.context === 'e2e-test/ai-triage');
              aiWaived = triageStatus?.state === 'success';
            }
            core.info(`PR #${prNumber} E2E/Override=${override} E2E/AI-Waived=${aiWaived}`);
            core.setOutput('override', override ? 'true' : 'false');
            core.setOutput('ai_waived', aiWaived ? 'true' : 'false');
          } catch (err) {
            // Fail closed: an unreadable label list must not turn a real failure
            // green. This matters more for the AI waiver than for the human one —
            // a maintainer who applied E2E/Override will notice a still-red check,
            // whereas nobody is watching on triage's behalf.
            core.warning(`Could not read labels for PR #${prNumber}: ${err.message}`);
            core.setOutput('override', 'false');
            core.setOutput('ai_waived', 'false');
          }
