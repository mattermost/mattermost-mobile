name: Compute E2E build fingerprint
description: Compute a content-based fingerprint for E2E builds to enable caching

inputs:
  platform:
    description: 'Platform to compute fingerprint for (ios, android-detox, android-maestro)'
    required: true

outputs:
  fingerprint:
    description: 'Computed fingerprint'
    value: ${{ steps.compute.outputs.fingerprint }}

runs:
  using: composite
  steps:
    - name: Compute fingerprint
      id: compute
      shell: bash
      run: |
        # Fingerprint = sha256 of git blob hashes for all binary-impacting paths.
        # Missing a path causes false cache HITs (wrong binary tested).
        # Test files (detox/e2e/**, detox/maestro/**) are excluded so test-only
        # PRs still hit cache. Keep app-source subset in sync with label-manager filter.
        #
        # The build *recipe* is fingerprinted too (composite actions + toolchain
        # pins), otherwise a change to how the app is compiled would be served a
        # binary built by the previous recipe.
        # Deliberately NOT fingerprinted: e2e-detox-pr.yml itself. It mixes the
        # build steps with unrelated orchestration (TSIO, statuses, provisioning),
        # so including it would invalidate every cache entry on unrelated edits.
        # Changes to what the build actually does land in the actions/fastlane
        # paths below.
        # assets/base/ and assets/override/ are taken wholesale, not per-subdirectory:
        # generate-assets.js merges both into dist/assets/, which the `@assets` alias
        # bundles into the JS bundle. Listing only images/release/config.json missed
        # assets/base/i18n/ (64 translation files that are require()d by app/i18n),
        # so a translations change did not move the fingerprint and the cache served a
        # binary with the old strings.
        shared=(app/ libraries/ share_extension/ patches/ \
                types/ assets/fonts/ assets/sounds/ \
                assets/base/ assets/override/ \
                scripts/generate-assets.js \
                package.json package-lock.json \
                tsconfig.json babel.config.js metro.config.js \
                index.tsx app.json react-native.config.js \
                .nvmrc .ruby-version \
                .github/actions/prepare-mobile-build/ \
                .github/actions/prepare-node-deps/)
        case "${{ inputs.platform }}" in
          ios)
            paths=("${shared[@]}" ios/ fastlane/ Gemfile Gemfile.lock \
                    .github/actions/prepare-ios-build/)
            ;;
          android-detox)
            paths=("${shared[@]}" android/ \
                    detox/.detoxrc.json detox/package.json \
                    detox/package-lock.json detox/scripts/ \
                    .github/actions/prepare-android-build/)
            ;;
          android-maestro)
            paths=("${shared[@]}" android/ \
                    .github/actions/prepare-android-build/ \
                    .github/actions/build-android-maestro-apk/)
            ;;
          *)
            echo "::error::Invalid platform: ${{ inputs.platform }}"
            exit 1
            ;;
        esac

        # Fall back to commit SHA if ls-tree fails (e.g., shallow clone) so the build still runs.
        fingerprint=$(git ls-tree -r HEAD -- "${paths[@]}" 2>/dev/null | sha256sum | cut -d' ' -f1)
        if [ -z "$fingerprint" ] || [ "$fingerprint" = "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855" ]; then
          fingerprint="nocache-$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
          echo "::warning::git ls-tree produced no output — using fallback fingerprint. S3 cache will miss."
        fi
        echo "fingerprint=${fingerprint}" >> "$GITHUB_OUTPUT"
        echo "Computed fingerprint for ${{ inputs.platform }}: ${fingerprint}"
