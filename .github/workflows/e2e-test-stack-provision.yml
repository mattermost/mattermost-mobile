---
name: E2E Test Stack - Provision

# Provisions every server of a batch this run created (license and plugins, as provision-e2e-servers does), one
# job per slice of the servers, which a Detox template's generate-specs deals into at most 8. Every server but the
# last gets the demo plugin: the last is a Detox batch's shared SITE_3, or a Maestro batch's one server. It opens the
# batch with the toolkit's open action, which reads this run's create response with no AWS role and accepts only this
# run's batch.

on:
  workflow_call:
    inputs:
      batch:
        description: "The batch within the run, as create was given it, e.g. dt-ios-pr"
        type: string
        required: true
      slices:
        description: "JSON array of comma-separated server indexes, one string per provisioning job"
        type: string
        required: true
      commit_sha:
        description: "The commit whose provisioning code runs, as a full SHA"
        type: string
        required: true
    secrets:
      E2E_TEST_STACK_CREDENTIALS_KEY:
        description: "The repository's credentials key, which opens the batch's sealed server credentials"
        required: true

# actions: read for the open action, which reads this run's artifacts.
permissions:
  actions: read
  contents: read

jobs:
  provision:
    name: provision (servers ${{ matrix.slice }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        slice: ${{ fromJSON(inputs.slices) }}
    steps:
      # A branch or short SHA would let checkout take a moving ref; an empty one, the default branch.
      - name: ci/check-commit
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          if ! [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit_sha must be a full 40-character SHA, got '${COMMIT_SHA}'"
            exit 1
          fi

      # Only what provisioning reads: .nvmrc (a root file, always included), detox and the provisioning action.
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.commit_sha }}
          sparse-checkout: |
            detox
            .github/actions/provision-e2e-servers
          persist-credentials: false

      # The open action runs on Node 26.
      - name: ci/setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false

      - name: ci/first-index
        id: first
        env:
          SLICE: ${{ matrix.slice }}
        run: |
          set -euo pipefail
          if ! [[ "$SLICE" =~ ^[0-9]+(,[0-9]+)*$ ]]; then
            echo "::error::a slice must be comma-separated server indexes"
            exit 1
          fi
          echo "index=${SLICE%%,*}" >> "$GITHUB_OUTPUT"

      # The batch shares one admin, so opening any server gives the credentials for the slice.
      - name: ci/open
        id: open
        uses: mattermost/mattermost-test-automation-toolkit/actions/e2e-test-stack/open@d6488ead2b451fe6f6ecf687c4d46467b896b514 # main
        with:
          caller-key: mobile
          batch: ${{ inputs.batch }}
          index: ${{ steps.first.outputs.index }}
          credentials-key: ${{ secrets.E2E_TEST_STACK_CREDENTIALS_KEY }}

      - name: ci/sites
        id: sites
        env:
          SLICE: ${{ matrix.slice }}
          INSTANCES: ${{ steps.open.outputs.instances }}
        run: |
          set -euo pipefail
          count=$(jq 'length' <<< "$INSTANCES")
          urls="" demo=""
          IFS=, read -ra indexes <<< "$SLICE"
          for index in "${indexes[@]}"; do
            url=$(jq -r --argjson i "$index" '.[$i].site_url // ""' <<< "$INSTANCES")
            state=$(jq -r --argjson i "$index" '.[$i].state // ""' <<< "$INSTANCES")
            if [ -z "$url" ] || [ "$state" != ready ]; then
              echo "::error::server ${index} of the batch of ${count} is not ready (state '${state}')"
              exit 1
            fi
            urls+="${url}"$'\n'
            # The last server is the shared SITE_3, which keeps no demo plugin.
            if [ "$index" -ne $((count - 1)) ]; then
              demo+="${url}"$'\n'
            fi
          done
          delimiter="EOF_$(openssl rand -hex 16)"
          {
            echo "urls<<${delimiter}"
            printf '%s' "$urls"
            echo "${delimiter}"
            echo "demo<<${delimiter}"
            printf '%s' "$demo"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      # Provisioning runs on the Node version the specs use.
      - name: ci/setup-node-specs
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: detox/package-lock.json

      - name: ci/provision
        uses: ./.github/actions/provision-e2e-servers
        env:
          ADMIN_USERNAME: ${{ steps.open.outputs.admin-username }}
          ADMIN_PASSWORD: ${{ steps.open.outputs.admin-password }}
          # The servers carry the prepackaged plugins; provisioning enables them rather than download them.
          E2E_SERVER_SOURCE: e2e-test-stack
        with:
          server-urls: ${{ steps.sites.outputs.urls }}
          demo-plugin-server-urls: ${{ steps.sites.outputs.demo }}
