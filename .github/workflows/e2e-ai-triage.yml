---
# E2E failure triage — deterministic pass, then adjudication.
#
# Runs after the Detox and Maestro jobs finish. Two stages:
#
#   plan       collects every shard's artifacts, normalizes them, clusters by
#              failure signature, applies the signature catalogue, enriches with
#              TSIO history, and emits one evidence.json. Entirely deterministic
#              — no model is called.
#   adjudicate hands that bundle to the shared toolkit workflow, which decides
#              only what the rules could not, runs everything through the policy
#              engine, and posts `e2e-test/ai-triage`.
#
# The split exists because the two halves belong in different places: clustering
# needs this repo's spec layout and its failure-signature catalogue, while
# adjudication and policy are repo-agnostic and are shared with the other
# Mattermost repos.
#
# Per-platform `e2e-test/*` contexts first report objective test results, then
# receive a verified flaky/test-bug/product-bug suffix from adjudication while
# retaining their original counts and report links.
name: E2E AI Triage

on:
  workflow_call:
    inputs:
      MOBILE_VERSION:
        description: "Commit SHA under test"
        required: true
        type: string
      artifact_run_id:
        description: "Run that uploaded the per-shard result artifacts"
        required: true
        type: string
      artifact_pattern:
        description: "Artifact glob to collect; CMT uses a server-version suffix"
        required: false
        type: string
        default: "*-results-*"
      artifact_namespace:
        description: "Suffix namespace preventing CMT rerun artifact collisions"
        required: false
        type: string
        default: ""
      pr_number:
        required: false
        type: string
        default: ""
      run_type:
        description: "PR | MAIN | MASTER | RELEASE"
        required: false
        type: string
        default: "PR"
      mode:
        description: "Triage authority mode"
        required: false
        type: string
        default: "gate"
      status_context:
        description: "Commit-status context owned by this triage invocation"
        required: false
        type: string
        default: "e2e-test/ai-triage"
      version_name:
        description: "Branch under test"
        required: false
        type: string
        default: ""
      platform:
        description: "Original E2E platform selection: ios, android, or both"
        required: false
        type: string
        default: "both"
      expected_detox_ios_reports:
        description: "Expected original Detox iOS phone shard reports"
        required: false
        type: string
        default: "0"
      expected_detox_ipad_reports:
        description: "Expected original Detox iPad shard reports"
        required: false
        type: string
        default: "0"
      expected_detox_android_reports:
        description: "Expected original Detox Android shard reports"
        required: false
        type: string
        default: "0"
      expected_maestro_ios_reports:
        description: "Expected original Maestro iOS reports"
        required: false
        type: string
        default: "0"
      expected_maestro_android_reports:
        description: "Expected original Maestro Android reports"
        required: false
        type: string
        default: "0"
      # The rerun re-executes failed specs on the same build against the same
      # provisioned servers, so it needs everything the original test jobs got.
      # Absent means the rerun stage is skipped and triage runs on first-run
      # evidence alone.
      IOS_SITE_1_URL:
        required: false
        type: string
        default: ""
      IOS_SITE_2_URL:
        required: false
        type: string
        default: ""
      ANDROID_SITE_1_URL:
        required: false
        type: string
        default: ""
      ANDROID_SITE_2_URL:
        required: false
        type: string
        default: ""
      SITE_3_URL:
        required: false
        type: string
        default: ""
      use_staging:
        description: >-
          Target the TSIO staging deployment instead of production. Mirrors the
          `use-staging` input on mattermost-test-system-io's
          test-system-io-report-upload action, which is how every other TSIO call
          in this repo selects its environment — one mechanism, not two.
          Production by default, matching the rest of the E2E pipeline.
        required: false
        type: boolean
        default: false
    secrets:
      GH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      TSIO_API_KEY:
        required: false
      WEBHOOK_URL:
        required: false

# Ceiling for the nested toolkit workflow, which posts the status, applies the
# waiver label, comments, and authenticates the model call via OIDC. A reusable
# workflow cannot escalate past its caller, so anything missing here silently
# no-ops downstream rather than erroring.
permissions:
  contents: read
  actions: read
  statuses: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  plan:
    name: Collect and classify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tooling_present: ${{ steps.tooling.outputs.present }}
      rerun_enabled: ${{ steps.specs.outputs.rerun_enabled }}
      rerun_ios_specs: ${{ steps.specs.outputs.ios }}
      rerun_android_specs: ${{ steps.specs.outputs.android }}
      evidence_artifact: e2e-triage-evidence-${{ inputs.artifact_run_id }}
      diff_overlap_state: ${{ steps.overlap.outputs.state || 'unknown' }}
      triage_mode: ${{ steps.mode.outputs.mode || 'shadow' }}
      # Resolved once here and consumed by both this job's triage step and the
      # adjudicate job below, so the two halves of the pipeline can never end up
      # pointed at different TSIO environments.
      tsio_url: ${{ steps.tsio-env.outputs.url }}
    steps:
      - name: ci/checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.MOBILE_VERSION }}
          # Deep enough for the merge-base the overlap check needs.
          fetch-depth: 50
          persist-credentials: false

      # The checkout is at MOBILE_VERSION, so a PR branched before triage landed
      # has no detox/triage/. That commit predates the feature and triage has
      # nothing to say about it — so skip the whole thing rather than posting a
      # red check on every un-rebased PR, which would be pure noise.
      #
      # Resolved here, immediately after the checkout, rather than further down:
      # `adjudicate` is gated on this output, so any step that failed ahead of it
      # left the output empty and skipped adjudication — and a check that is
      # absent is not a check that failed closed, it is silence. Keeping the
      # window down to the checkout itself means a Node or network failure still
      # gets the full red that adjudicate posts, and `no-verdict` below only has
      # to cover the one case left.
      - name: ci/check-tooling
        id: tooling
        run: |
          set -euo pipefail
          if [ -f detox/triage/triage.js ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::detox/triage is not present at this commit — skipping E2E failure triage."
          fi

      # Never pass an unrecognised repository variable to the policy engine.
      # Emit shadow before failing so adjudication still has a non-authoritative
      # value if this job stops here; the failed plan also keeps the workflow red.
      - name: ci/validate-triage-mode
        id: mode
        if: steps.tooling.outputs.present == 'true'
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          case "${REQUESTED_MODE}" in
            shadow|assist|gate)
              echo "mode=${REQUESTED_MODE}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "mode=shadow" >> "$GITHUB_OUTPUT"
              echo "::error::E2E_AI_TRIAGE_MODE must be shadow, assist, or gate; got '${REQUESTED_MODE}'"
              exit 1
              ;;
          esac

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: '.nvmrc'

      - name: ci/download-result-artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          path: triage-artifacts
          pattern: ${{ inputs.artifact_pattern }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ secrets.GH_TOKEN || github.token }}

      # Whether the PR touches the failing area is a fact about the diff, not
      # something the model should assert about its own verdict. Resolved here and
      # passed down: it is what stops a MAIN_REGRESSION from excusing a PR that is
      # editing the very thing that broke.
      - name: ci/detect-diff-overlap
        id: overlap
        if: inputs.pr_number != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -uo pipefail
          # Write the conservative result first. If gh, jq, pagination, or any
          # later command fails, this remains the step output.
          echo "state=unknown" >> "$GITHUB_OUTPUT"
          if ! gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '.changed_files' > changed-file-count.txt; then
            echo "::warning::could not establish the PR changed-file count; diff overlap is unknown"
            exit 0
          fi
          if ! gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[].filename' > changed-files.txt; then
            echo "::warning::could not establish the PR file list; diff overlap is unknown"
            exit 0
          fi

          EXPECTED_COUNT=$(tr -d '[:space:]' < changed-file-count.txt)
          ACTUAL_COUNT=$(wc -l < changed-files.txt | tr -d '[:space:]')
          if ! [[ "${EXPECTED_COUNT}" =~ ^[0-9]+$ ]] || [ "${ACTUAL_COUNT}" != "${EXPECTED_COUNT}" ]; then
            echo "::warning::PR files API returned ${ACTUAL_COUNT}/${EXPECTED_COUNT:-unknown} files; diff overlap is unknown"
            exit 0
          fi

          # Successful, complete API responses with zero rows establish a
          # genuinely empty diff. Empty output from `gh pr diff` cannot make that
          # distinction because API and diff-generation failures also produce no
          # stdout. Comparing counts also catches GitHub's 3,000-file API cap.
          # A change under app/ or libraries/ can plausibly break a test; a change
          # confined to CI config, docs, or the test tree itself cannot be blamed
          # for a pre-existing main regression.
          if grep -qE '^(app|libraries|share_extension)/' changed-files.txt; then
            echo "state=true" >> "$GITHUB_OUTPUT"
          else
            echo "state=false" >> "$GITHUB_OUTPUT"
          fi

      # The two TSIO hostnames, in one place. These are the same constants
      # detox/utils/tsio-report-status.js carries (PRODUCTION_URL / STAGING_URL)
      # and the same pair the test-system-io-report-upload action switches
      # between — this keeps triage on that one convention rather than inventing
      # a separate repo-variable override for the same choice.
      - name: ci/resolve-tsio-url
        id: tsio-env
        env:
          USE_STAGING: ${{ inputs.use_staging }}
        run: |
          set -euo pipefail
          if [ "$USE_STAGING" = "true" ]; then
            URL="https://staging-test-io.test.mattermost.com"
          else
            URL="https://test-io.test.mattermost.com"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "TSIO environment: $URL"

      - name: ci/triage
        if: steps.tooling.outputs.present == 'true'
        # Every caller-supplied value arrives as an environment variable.
        # `version_name` is the one that makes this mandatory rather than tidy: it
        # is the branch name, which on a fork PR is chosen by the contributor, and
        # a single quote in it ended the quoting and started a command on a runner
        # holding OIDC and write permissions. `git check-ref-format` accepts
        # names containing quotes and $(...), so this was reachable.
        env:
          TRIAGE_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ inputs.MOBILE_VERSION }}
          BRANCH_NAME: ${{ inputs.version_name }}
          PR_NUMBER: ${{ inputs.pr_number }}
          TSIO_URL: ${{ steps.tsio-env.outputs.url }}
          EXPECTED_DETOX_IOS: ${{ inputs.expected_detox_ios_reports }}
          EXPECTED_DETOX_IPAD: ${{ inputs.expected_detox_ipad_reports }}
          EXPECTED_DETOX_ANDROID: ${{ inputs.expected_detox_android_reports }}
          EXPECTED_MAESTRO_IOS: ${{ inputs.expected_maestro_ios_reports }}
          EXPECTED_MAESTRO_ANDROID: ${{ inputs.expected_maestro_android_reports }}
          SELECTED_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          mkdir -p triage-out
          jq -n \
            --argjson detox_ios "$EXPECTED_DETOX_IOS" \
            --argjson detox_ipad "$EXPECTED_DETOX_IPAD" \
            --argjson detox_android "$EXPECTED_DETOX_ANDROID" \
            --argjson maestro_ios "$EXPECTED_MAESTRO_IOS" \
            --argjson maestro_android "$EXPECTED_MAESTRO_ANDROID" \
            --arg selected_platform "$SELECTED_PLATFORM" \
            '[
              {framework: "detox", platform: "ios", count: $detox_ios, selected: ($selected_platform == "ios" or $selected_platform == "both")},
              {framework: "detox", platform: "ipad", count: $detox_ipad, selected: ($selected_platform == "ios" or $selected_platform == "both")},
              {framework: "detox", platform: "android", count: $detox_android, selected: ($selected_platform == "android" or $selected_platform == "both")},
              {framework: "maestro", platform: "ios", count: $maestro_ios, selected: ($selected_platform == "ios" or $selected_platform == "both")},
              {framework: "maestro", platform: "android", count: $maestro_android, selected: ($selected_platform == "android" or $selected_platform == "both")}
            ] | map(select(.selected) | del(.selected))' > triage-out/expected-reports.json
          ARGS=(
            --artifacts=triage-artifacts
            --output=triage-out
            --expected-reports=triage-out/expected-reports.json
            "--repo=${TRIAGE_REPO}"
            "--commit=${COMMIT_SHA}"
            "--branch=${BRANCH_NAME:-main}"
            "--tsio-url=${TSIO_URL}"
          )
          if [ -n "${PR_NUMBER}" ]; then
            ARGS+=("--pr=${PR_NUMBER}")
          fi
          node detox/triage/triage.js "${ARGS[@]}"

      # Emitted as job outputs rather than read from the artifact by the rerun
      # jobs: a reusable-workflow `uses:` resolves its `with:` before any step of
      # that job runs, so the value must already exist as an output.
      - name: ci/expose-rerun-plan
        id: specs
        if: always() && steps.tooling.outputs.present == 'true'
        run: |
          set -euo pipefail
          if [ ! -f triage-out/rerun-plan.json ]; then
            echo "rerun_enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "rerun_enabled=$(jq -r '.enabled // false' triage-out/rerun-plan.json)" >> "$GITHUB_OUTPUT"
          for PLATFORM in ios android; do
            FILE="triage-out/spec-list-${PLATFORM}.txt"
            if [ -f "$FILE" ]; then
              # Space-separated on one line: generate-specs splits on whitespace,
              # and a job output cannot carry raw newlines.
              echo "${PLATFORM}=$(tr '\n' ' ' < "$FILE" | sed 's/ *$//')" >> "$GITHUB_OUTPUT"
            else
              echo "${PLATFORM}=" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: ci/upload-evidence
        if: always() && hashFiles('triage-out/evidence.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-triage-evidence-${{ inputs.artifact_run_id }}
          path: triage-out/
          retention-days: 14

  # Targeted rerun: only the specs the deterministic pass could not resolve, at
  # most two per cluster and eight overall. Two repetitions on a freshly booted
  # device turn "flaky" from an inference into a measurement — a failure that
  # reproduces both times is deterministic whatever its error text says, and the
  # policy engine refuses to waive it.
  #
  # tsio-config is deliberately left unset: the templates gate every TSIO upload
  # and commit-status step on it, so a rerun cannot pollute the original report
  # group or re-post a platform status.
  #
  # A rerun job going red is the expected outcome — it re-runs specs that already
  # failed. GitHub forbids continue-on-error on a reusable-workflow job, so that
  # red is visible in the Actions UI. It gates nothing: finalize and adjudicate
  # both run under always(), and the verdict reaches the PR as a commit status
  # posted by the toolkit, not as this workflow's conclusion.
  rerun-ios:
    name: Rerun iOS specs
    needs: plan
    if: >-
      always() &&
      needs.plan.outputs.tooling_present == 'true' &&
      needs.plan.outputs.rerun_enabled == 'true' &&
      needs.plan.outputs.rerun_ios_specs != '' &&
      inputs.IOS_SITE_1_URL != ''
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2]
    uses: ./.github/workflows/e2e-ios-template.yml
    with:
      run-type: ${{ inputs.run_type }}
      MOBILE_VERSION: ${{ inputs.MOBILE_VERSION }}
      MM_TEST_SERVER_URL: ${{ inputs.IOS_SITE_1_URL }}
      MM_TEST_SERVER_URL_2: ${{ inputs.IOS_SITE_2_URL }}
      MM_TEST_SERVER_URL_3: ${{ inputs.SITE_3_URL }}
      artifact_run_id: ${{ inputs.artifact_run_id }}
      spec_list: ${{ needs.plan.outputs.rerun_ios_specs }}
      artifact_suffix: ${{ inputs.artifact_namespace }}-rr${{ matrix.rep }}
      parallelism: 1
      # Video is off for normal runs because recording the full suite is
      # expensive. A rerun is a handful of specs, and a recording of the moment a
      # failure reproduced is the most useful artifact there is for diagnosing it.
      extra_detox_args: "--record-videos failing"
    secrets: inherit

  rerun-android:
    name: Rerun Android specs
    needs: plan
    if: >-
      always() &&
      needs.plan.outputs.tooling_present == 'true' &&
      needs.plan.outputs.rerun_enabled == 'true' &&
      needs.plan.outputs.rerun_android_specs != '' &&
      inputs.ANDROID_SITE_1_URL != ''
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2]
    uses: ./.github/workflows/e2e-android-template.yml
    with:
      run-android-tests: true
      run-type: ${{ inputs.run_type }}
      MOBILE_VERSION: ${{ inputs.MOBILE_VERSION }}
      MM_TEST_SERVER_URL: ${{ inputs.ANDROID_SITE_1_URL }}
      MM_TEST_SERVER_URL_2: ${{ inputs.ANDROID_SITE_2_URL }}
      MM_TEST_SERVER_URL_3: ${{ inputs.SITE_3_URL }}
      artifact_run_id: ${{ inputs.artifact_run_id }}
      spec_list: ${{ needs.plan.outputs.rerun_android_specs }}
      artifact_suffix: ${{ inputs.artifact_namespace }}-rr${{ matrix.rep }}
      parallelism: 1
      extra_detox_args: "--record-videos failing"
    secrets: inherit

  # Fold rerun outcomes into the evidence bundle. Merge-only: the plan job already
  # collected, classified, and enriched, so re-collecting would mean re-downloading
  # the whole artifact tree to rebuild what is already known.
  finalize:
    name: Merge rerun evidence
    needs: [plan, rerun-ios, rerun-android]
    if: always() && needs.plan.outputs.tooling_present == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      evidence_artifact: ${{ steps.merge.outputs.artifact }}
    steps:
      - name: ci/checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.MOBILE_VERSION }}
          persist-credentials: false

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: '.nvmrc'

      - name: ci/download-plan-evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-triage-evidence-${{ inputs.artifact_run_id }}
          path: prior
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ secrets.GH_TOKEN || github.token }}

      - name: ci/download-rerun-artifacts
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: rerun
          pattern: "*${{ inputs.artifact_namespace }}-rr*"
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ secrets.GH_TOKEN || github.token }}

      - name: ci/merge
        id: merge
        env:
          COMMIT_SHA: ${{ inputs.MOBILE_VERSION }}
        run: |
          set -euo pipefail
          PLAN_ARTIFACT="e2e-triage-evidence-${{ inputs.artifact_run_id }}"
          if [ ! -f prior/evidence.json ]; then
            echo "no prior evidence — adjudication falls back to the plan artifact"
            echo "artifact=${PLAN_ARTIFACT}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Each repetition gets its own root: comparing repetition against
          # repetition is the entire point, so they must not be merged on disk.
          ROOTS=""
          for REP in 1 2; do
            DEST="rerun-rep${REP}"
            mkdir -p "$DEST"
            for DIR in rerun/*${{ inputs.artifact_namespace }}-rr${REP}; do
              [ -d "$DIR" ] || continue
              mv "$DIR" "$DEST/"
            done
            # Keep the empty repetition root. Its absence is evidence that the
            # planned repetition did not report, not permission to shorten the plan.
            ROOTS="${ROOTS:+$ROOTS,}$DEST"
          done

          # --commit is what makes the bundle's meta.commit check live: without it
          # the guard has nothing to compare against and a stale artifact merges
          # silently.
          node detox/triage/triage.js \
            --evidence-in=prior/evidence.json \
            --output=triage-final \
            --commit="${COMMIT_SHA}" \
            ${ROOTS:+--rerun-artifacts="$ROOTS"}

          echo "artifact=e2e-triage-evidence-final-${{ inputs.artifact_run_id }}" >> "$GITHUB_OUTPUT"

      - name: ci/upload-final-evidence
        if: always() && hashFiles('triage-final/evidence.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-triage-evidence-final-${{ inputs.artifact_run_id }}
          path: triage-final/
          retention-days: 14

  adjudicate:
    name: Adjudicate and post status
    needs: [plan, finalize]
    # `always()` so a failed plan still reaches the toolkit, which posts red when
    # there is no evidence bundle. Skipping here would leave a required check
    # pending forever, which is worse than a red.
    #
    # The tooling guard is the one exception: a commit that predates triage gets
    # no status at all, because there is nothing to report rather than something
    # bad to report.
    if: always() && needs.plan.outputs.tooling_present == 'true'
    permissions:
      contents: read
      actions: read
      statuses: write
      pull-requests: write
      issues: write
      id-token: write
    uses: mattermost/mattermost-test-automation-toolkit/.github/workflows/e2e-ai-triage.yml@a0d93b896bf68567149de15e76290d3c95d18007
    with:
      # Keep this aligned with the immutable `uses:` SHA above. A called workflow
      # sees the caller's ref, so it cannot derive its own checkout ref.
      toolkit_ref: a0d93b896bf68567149de15e76290d3c95d18007
      target_repo: ${{ github.repository }}
      commit_sha: ${{ inputs.MOBILE_VERSION }}
      pr_number: ${{ inputs.pr_number }}
      # Matterwick does not send version_name on either path, so fall back to
      # main for baseline runs — the ledger row's branch is what later
      # accuracy and amnesty queries filter on.
      branch: ${{ inputs.version_name || (inputs.run_type == 'PR' && '' || 'main') }}
      run_type: ${{ inputs.run_type }}
      status_context: ${{ inputs.status_context }}
      # finalize falls back to the plan artifact when no rerun ran, so this is
      # always the freshest evidence available.
      evidence_artifact: ${{ needs.finalize.outputs.evidence_artifact || needs.plan.outputs.evidence_artifact }}
      evidence_run_id: ${{ github.run_id }}
      # Shadow until the false-green count has been zero over a real sample.
      # Promotion is a deliberate repo-variable change, not a code change.
      mode: ${{ needs.plan.outputs.triage_mode }}
      # Map unknown to true so an unavailable or skipped diff vetoes a
      # MAIN_REGRESSION waiver.
      diff_overlaps_failure: ${{ needs.plan.outputs.diff_overlap_state != 'false' }}
      claude_model: ${{ vars.CLAUDE_MODEL || '' }}
      # Same environment the plan job read history from. Resolved there so both
      # halves cannot disagree; the literal fallback only matters if plan somehow
      # produced no output, and it points at production because that is where
      # every other TSIO call in this repo already goes.
      tsio_url: ${{ needs.plan.outputs.tsio_url || 'https://test-io.test.mattermost.com' }}
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TSIO_API_KEY: ${{ secrets.TSIO_API_KEY }}
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}

  # Re-publish every platform with its independently aggregated diagnosis while
  # preserving the test counts and report URL from the raw status.
  repost-platform-contexts:
    name: Publish classified platform contexts
    needs: adjudicate
    if: >-
      always() &&
      needs.adjudicate.result == 'success' &&
      inputs.run_type != 'RELEASE' &&
      inputs.run_type != 'CMT' &&
      (
        (
          needs.adjudicate.outputs.platform_outcomes != '' &&
          needs.adjudicate.outputs.platform_outcomes != '{}'
        ) ||
        needs.adjudicate.outputs.operational_outcome == 'FLAKY_CONFIRMED'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
      pull-requests: read
      issues: read
    steps:
      - name: ci/verify-outcome-still-targets-pr-head
        if: inputs.run_type == 'PR'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          COMMIT_SHA: ${{ inputs.MOBILE_VERSION }}
        with:
          script: |
            const prNumber = Number.parseInt(process.env.PR_NUMBER, 10);
            if (!Number.isFinite(prNumber)) {
              throw new Error('AI waiver repost requires a PR number');
            }
            const {data: pr} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            if (pr.head.sha !== process.env.COMMIT_SHA) {
              throw new Error(`PR head changed from ${process.env.COMMIT_SHA} to ${pr.head.sha}`);
            }
      - name: ci/prepare-platform-outcomes
        id: platforms
        env:
          PLATFORM_OUTCOMES: ${{ needs.adjudicate.outputs.platform_outcomes }}
          OPERATIONAL_OUTCOME: ${{ needs.adjudicate.outputs.operational_outcome }}
          SELECTED_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          if [ -z "$PLATFORM_OUTCOMES" ] || [ "$PLATFORM_OUTCOMES" = "{}" ]; then
            if [ "$OPERATIONAL_OUTCOME" != "FLAKY_CONFIRMED" ]; then
              echo "::error::Missing platform outcomes for ${OPERATIONAL_OUTCOME:-unknown}."
              exit 1
            fi
            PLATFORM_OUTCOMES=$(jq -nc --arg selected "$SELECTED_PLATFORM" '
              ({classification: "FLAKY", state: "success", suffix: "verified to be flaky"}) as $flaky
              | if $selected == "ios" then {ios: $flaky}
                elif $selected == "android" then {android: $flaky}
                else {ios: $flaky, android: $flaky}
                end
            ')
            echo "Toolkit platform outcomes unavailable; using global FLAKY_CONFIRMED fallback."
          fi
          echo "$PLATFORM_OUTCOMES" | jq -e 'type == "object"' >/dev/null
          for PLATFORM in ios android; do
            STATE=$(echo "$PLATFORM_OUTCOMES" | jq -r --arg p "$PLATFORM" '.[$p].state // ""')
            SUFFIX=$(echo "$PLATFORM_OUTCOMES" | jq -r --arg p "$PLATFORM" '.[$p].suffix // ""')
            {
              echo "${PLATFORM}_state=$STATE"
              echo "${PLATFORM}_suffix=$SUFFIX"
            } >> "$GITHUB_OUTPUT"
          done

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The status action is trusted workflow code; do not execute the PR's
          # copy with a token that can write commit statuses.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: ci/publish-ios-outcome
        if: steps.platforms.outputs.ios_state != ''
        uses: ./.github/actions/e2e-override-status
        with:
          commit_sha: ${{ inputs.MOBILE_VERSION }}
          state: ${{ steps.platforms.outputs.ios_state }}
          description: ${{ steps.platforms.outputs.ios_suffix }}
          status_suffix: ${{ steps.platforms.outputs.ios_suffix }}
          target_url: ${{ needs.adjudicate.outputs.triage_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          platform: ios

      - name: ci/publish-android-outcome
        if: steps.platforms.outputs.android_state != ''
        uses: ./.github/actions/e2e-override-status
        with:
          commit_sha: ${{ inputs.MOBILE_VERSION }}
          state: ${{ steps.platforms.outputs.android_state }}
          description: ${{ steps.platforms.outputs.android_suffix }}
          status_suffix: ${{ steps.platforms.outputs.android_suffix }}
          target_url: ${{ needs.adjudicate.outputs.triage_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          platform: android

  enforce-outcome:
    name: Enforce triage outcome
    needs:
      - adjudicate
      - repost-platform-contexts
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: ci/enforce-triage-outcome
        env:
          STATE: ${{ needs.adjudicate.outputs.state }}
          OUTCOME: ${{ needs.adjudicate.outputs.operational_outcome }}
        run: |
          if [ "$STATE" != "success" ]; then
            echo "::error::E2E triage blocked this run (${OUTCOME:-TRIAGE_FAILED})."
            exit 1
          fi
          echo "E2E triage passed: ${OUTCOME}"

  # The one path where nothing above can speak.
  #
  # `adjudicate` needs plan's `tooling_present`, and plan cannot report it if it
  # died before ci/check-tooling ran — so `adjudicate` was skipped and no
  # `e2e-test/ai-triage` status existed at all. Every other failure mode in this
  # pipeline resolves to red; this one resolved to nothing, and nothing is not
  # fail-closed. It reads as "triage had no opinion" when the truth is "triage
  # never got to look".
  #
  # Deliberately checks out nothing and installs nothing: a failing checkout is
  # the main thing this covers, so it must not depend on one. `gh` is preinstalled
  # on the runner.
  no-verdict:
    name: Report that triage could not run
    needs: plan
    # '' means ci/check-tooling never executed, which is the gap. 'false' is the
    # deliberate silence for a commit predating triage, and 'true' means
    # adjudicate owns the status — posting here in either case would either
    # re-red un-rebased PRs or race adjudicate for the same context.
    if: always() && !cancelled() && needs.plan.outputs.tooling_present == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: ci/post-red
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ inputs.MOBILE_VERSION }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PLAN_RESULT: ${{ needs.plan.result }}
        run: |
          set -euo pipefail
          # Duplicated from the toolkit's STATUS_CONTEXT rather than shared: a
          # workflow cannot import a constant from the repo it calls into, and
          # posting on a different context would leave the real one absent, which
          # is the bug this job exists to fix.
          gh api --method POST "repos/${REPO}/statuses/${COMMIT_SHA}" \
            -f state=failure \
            -f context=e2e-test/ai-triage \
            -f description="triage did not run (plan ${PLAN_RESULT}) — manual triage required" \
            -f target_url="${RUN_URL}"
          echo "posted red on e2e-test/ai-triage: plan finished ${PLAN_RESULT} before reaching ci/check-tooling"
