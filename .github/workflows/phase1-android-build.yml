---
name: phase1-android-build

on:
  push:
    branches:
      - arena/1485ca55-mattermost-mobile
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-existing-android-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Prepare Node dependencies
        uses: ./.github/actions/prepare-node-deps

      - name: Set up JDK 17
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Jetify Android libraries
        run: ./node_modules/.bin/jetify

      - name: Build existing Android application
        working-directory: android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --stacktrace

      - name: Verify APK output
        run: |
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          ls -lh "$apk"
          sha256sum "$apk"

      - name: Upload installable arm64 APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase1-mattermost-arm64-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
