# Detox E2E test runs — reusable workflow only.
# Called from e2e-detox-pr.yml after shared builds and server provisioning complete.
# App artifacts (ios-build-simulator-*, android-build-files-*) are uploaded by
# the parent workflow; templates download them via artifact_run_id.
name: Detox E2E

on:
  workflow_call:
    inputs:
      MOBILE_VERSION:
        required: true
        type: string
      PLATFORM:
        required: false
        type: string
        default: "both"
      ANDROID_SITE_1_URL:
        required: true
        type: string
      ANDROID_SITE_2_URL:
        required: true
        type: string
      IOS_SITE_1_URL:
        required: true
        type: string
      IOS_SITE_2_URL:
        required: true
        type: string
      SITE_3_URL:
        required: true
        type: string
      run_type:
        required: false
        type: string
        default: "PR"
      artifact_run_id:
        description: "Run ID of the parent workflow that uploaded build artifacts"
        required: true
        type: string
      tsio-job-configs:
        description: "JSON map of per-platform TSIO configs from parent calculate-tsio-identity"
        required: true
        type: string
      rerun-specs:
        description: >
          Re-run of failed specs: JSON map of lane (detox-ios, detox-android, detox-ipad) to
          space-separated spec files. Only those lanes run, on fresh devices, and report only
          to the channel message (no TSIO, Zephyr, durations, commit status or webhook).
          "{}" is the normal run.
        required: false
        type: string
        default: "{}"

permissions:
  contents: read
  id-token: write
  actions: read
  statuses: write
  # Nested template finalize reads PR labels to honour E2E/Override.
  issues: read

env:
  ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}

jobs:
  run-ios-tests:
    if: (inputs.PLATFORM == 'ios' || inputs.PLATFORM == 'both') && (inputs.rerun-specs == '{}' || fromJSON(inputs.rerun-specs)['detox-ios'] != null)
    name: iOS
    uses: ./.github/workflows/e2e-ios-template.yml
    with:
      run-type: ${{ inputs.rerun-specs != '{}' && 'NONE' || inputs.run_type || 'PR' }}
      tsio-config: ${{ inputs.rerun-specs == '{}' && toJSON(fromJSON(inputs.tsio-job-configs)['detox-ios']) || '' }}
      tsio-shard-name: ${{ inputs.rerun-specs == '{}' && 'detox-ios' || '' }}
      durations_key: ${{ inputs.rerun-specs == '{}' && 'detox-ios' || '' }}
      record_tests_in_zephyr: ${{ inputs.rerun-specs == '{}' && (inputs.run_type == 'RELEASE' || inputs.run_type == 'MAIN' || inputs.run_type == 'MASTER') }}
      MOBILE_VERSION: ${{ inputs.MOBILE_VERSION }}
      MM_OTHER_PLATFORM_POOL_URL: ${{ inputs.ANDROID_SITE_1_URL }}
      MM_TEST_SERVER_URL: ${{ inputs.IOS_SITE_1_URL }}
      MM_TEST_SERVER_URL_2: ${{ inputs.IOS_SITE_2_URL }}
      MM_TEST_SERVER_URL_3: ${{ inputs.SITE_3_URL }}
      artifact_run_id: ${{ inputs.artifact_run_id }}
      spec_files: ${{ inputs.rerun-specs != '{}' && fromJSON(inputs.rerun-specs)['detox-ios'] || '' }}
      results-artifact: ${{ inputs.rerun-specs != '{}' && format('e2e-rerun-results-detox-ios-a{0}', github.run_attempt) || '' }}
      # The failed specs of a re-run run one after another on one fresh device (mutation specs on their own).
      parallelism: ${{ inputs.rerun-specs != '{}' && '1' || '32' }}
    secrets:
      MM_MOBILE_E2E_ADMIN_EMAIL: ${{ secrets.MM_MOBILE_E2E_ADMIN_EMAIL }}
      MM_MOBILE_E2E_ADMIN_USERNAME: ${{ secrets.MM_MOBILE_E2E_ADMIN_USERNAME }}
      MM_MOBILE_E2E_ADMIN_PASSWORD: ${{ secrets.MM_MOBILE_E2E_ADMIN_PASSWORD }}
      MM_MOBILE_E2E_ZEPHYR_API_KEY: ${{ secrets.MM_MOBILE_E2E_ZEPHYR_API_KEY }}
      MM_MOBILE_E2E_TEST_CYCLE_LINK_PREFIX: ${{ secrets.MM_MOBILE_E2E_TEST_CYCLE_LINK_PREFIX }}
      MM_MOBILE_E2E_WEBHOOK_URL: ${{ secrets.MM_MOBILE_E2E_WEBHOOK_URL }}
      MM_E2E_MASTER_HEALTH_WEBHOOK_URL: ${{ secrets.MM_E2E_MASTER_HEALTH_WEBHOOK_URL }}
      MM_E2E_RELEASE_WEBHOOK_URL: ${{ secrets.MM_E2E_RELEASE_WEBHOOK_URL }}
      MM_MOBILE_DETOX_AWS_ACCESS_KEY_ID: ${{ secrets.MM_MOBILE_DETOX_AWS_ACCESS_KEY_ID }}
      MM_MOBILE_DETOX_AWS_SECRET_ACCESS_KEY: ${{ secrets.MM_MOBILE_DETOX_AWS_SECRET_ACCESS_KEY }}
      MM_MOBILE_E2E_WEBHOOK_PUBLIC_BASE_URL: ${{ secrets.MM_MOBILE_E2E_WEBHOOK_PUBLIC_BASE_URL }}
      MM_MOBILE_E2E_CLOUDFLARED_TUNNEL_TOKEN: ${{ secrets.MM_MOBILE_E2E_CLOUDFLARED_TUNNEL_TOKEN }}

  run-android-tests:
    if: (inputs.PLATFORM == 'android' || inputs.PLATFORM == 'both') && (inputs.rerun-specs == '{}' || fromJSON(inputs.rerun-specs)['detox-android'] != null)
    name: Android
    uses: ./.github/workflows/e2e-android-template.yml
    with:
      run-android-tests: true
      run-type: ${{ inputs.rerun-specs != '{}' && 'NONE' || inputs.run_type || 'PR' }}
      tsio-config: ${{ inputs.rerun-specs == '{}' && toJSON(fromJSON(inputs.tsio-job-configs)['detox-android']) || '' }}
      tsio-shard-name: ${{ inputs.rerun-specs == '{}' && 'detox-android' || '' }}
      durations_key: ${{ inputs.rerun-specs == '{}' && 'detox-android' || '' }}
      record_tests_in_zephyr: ${{ inputs.rerun-specs == '{}' && (inputs.run_type == 'RELEASE' || inputs.run_type == 'MAIN' || inputs.run_type == 'MASTER') }}
      MOBILE_VERSION: ${{ inputs.MOBILE_VERSION }}
      MM_OTHER_PLATFORM_POOL_URL: ${{ inputs.IOS_SITE_1_URL }}
      MM_TEST_SERVER_URL: ${{ inputs.ANDROID_SITE_1_URL }}
      MM_TEST_SERVER_URL_2: ${{ inputs.ANDROID_SITE_2_URL }}
      MM_TEST_SERVER_URL_3: ${{ inputs.SITE_3_URL }}
      artifact_run_id: ${{ inputs.artifact_run_id }}
      spec_files: ${{ inputs.rerun-specs != '{}' && fromJSON(inputs.rerun-specs)['detox-android'] || '' }}
      results-artifact: ${{ inputs.rerun-specs != '{}' && format('e2e-rerun-results-detox-android-a{0}', github.run_attempt) || '' }}
      # The failed specs of a re-run run one after another on one fresh device (mutation specs on their own).
      parallelism: ${{ inputs.rerun-specs != '{}' && '1' || '32' }}
    secrets:
      MM_MOBILE_E2E_ADMIN_EMAIL: ${{ secrets.MM_MOBILE_E2E_ADMIN_EMAIL }}
      MM_MOBILE_E2E_ADMIN_USERNAME: ${{ secrets.MM_MOBILE_E2E_ADMIN_USERNAME }}
      MM_MOBILE_E2E_ADMIN_PASSWORD: ${{ secrets.MM_MOBILE_E2E_ADMIN_PASSWORD }}
      MM_MOBILE_E2E_ZEPHYR_API_KEY: ${{ secrets.MM_MOBILE_E2E_ZEPHYR_API_KEY }}
      MM_MOBILE_E2E_TEST_CYCLE_LINK_PREFIX: ${{ secrets.MM_MOBILE_E2E_TEST_CYCLE_LINK_PREFIX }}
      MM_MOBILE_E2E_WEBHOOK_URL: ${{ secrets.MM_MOBILE_E2E_WEBHOOK_URL }}
      MM_E2E_MASTER_HEALTH_WEBHOOK_URL: ${{ secrets.MM_E2E_MASTER_HEALTH_WEBHOOK_URL }}
      MM_E2E_RELEASE_WEBHOOK_URL: ${{ secrets.MM_E2E_RELEASE_WEBHOOK_URL }}
      MM_MOBILE_DETOX_AWS_ACCESS_KEY_ID: ${{ secrets.MM_MOBILE_DETOX_AWS_ACCESS_KEY_ID }}
      MM_MOBILE_DETOX_AWS_SECRET_ACCESS_KEY: ${{ secrets.MM_MOBILE_DETOX_AWS_SECRET_ACCESS_KEY }}
      MM_MOBILE_E2E_WEBHOOK_PUBLIC_BASE_URL: ${{ secrets.MM_MOBILE_E2E_WEBHOOK_PUBLIC_BASE_URL }}
      MM_MOBILE_E2E_CLOUDFLARED_TUNNEL_TOKEN: ${{ secrets.MM_MOBILE_E2E_CLOUDFLARED_TUNNEL_TOKEN }}

  run-ios-ipad-tests:
    if: (inputs.PLATFORM == 'ios' || inputs.PLATFORM == 'both') && (inputs.rerun-specs == '{}' || fromJSON(inputs.rerun-specs)['detox-ipad'] != null)
    name: iOS iPad
    uses: ./.github/workflows/e2e-ios-template.yml
    with:
      run-type: ${{ inputs.rerun-specs != '{}' && 'NONE' || inputs.run_type || 'PR' }}
      tsio-config: ${{ inputs.rerun-specs == '{}' && toJSON(fromJSON(inputs.tsio-job-configs)['detox-ipad']) || '' }}
      tsio-shard-name: ${{ inputs.rerun-specs == '{}' && 'detox-ipad' || '' }}
      durations_key: ${{ inputs.rerun-specs == '{}' && 'detox-ipad' || '' }}
      MOBILE_VERSION: ${{ inputs.MOBILE_VERSION }}
      MM_TEST_SERVER_URL: ${{ inputs.IOS_SITE_1_URL }}
      MM_OTHER_PLATFORM_POOL_URL: ${{ inputs.ANDROID_SITE_1_URL }}
      MM_TEST_SERVER_URL_2: ${{ inputs.IOS_SITE_2_URL }}
      MM_TEST_SERVER_URL_3: ${{ inputs.SITE_3_URL }}
      ios_device_name: "iPad Pro 13-inch (M5)"
      ios_device_os_name: "iOS 26.2"
      search_path: "detox/e2e/test/products/channels/ipad"
      parallelism: "1"
      detox_config: "ios.ipad.debug"
      artifact_run_id: ${{ inputs.artifact_run_id }}
      spec_files: ${{ inputs.rerun-specs != '{}' && fromJSON(inputs.rerun-specs)['detox-ipad'] || '' }}
      results-artifact: ${{ inputs.rerun-specs != '{}' && format('e2e-rerun-results-detox-ipad-a{0}', github.run_attempt) || '' }}
    secrets:
      MM_MOBILE_E2E_ADMIN_EMAIL: ${{ secrets.MM_MOBILE_E2E_ADMIN_EMAIL }}
      MM_MOBILE_E2E_ADMIN_USERNAME: ${{ secrets.MM_MOBILE_E2E_ADMIN_USERNAME }}
      MM_MOBILE_E2E_ADMIN_PASSWORD: ${{ secrets.MM_MOBILE_E2E_ADMIN_PASSWORD }}
      MM_MOBILE_E2E_ZEPHYR_API_KEY: ${{ secrets.MM_MOBILE_E2E_ZEPHYR_API_KEY }}
      MM_MOBILE_E2E_TEST_CYCLE_LINK_PREFIX: ${{ secrets.MM_MOBILE_E2E_TEST_CYCLE_LINK_PREFIX }}
      MM_MOBILE_E2E_WEBHOOK_URL: ${{ secrets.MM_MOBILE_E2E_WEBHOOK_URL }}
      MM_E2E_MASTER_HEALTH_WEBHOOK_URL: ${{ secrets.MM_E2E_MASTER_HEALTH_WEBHOOK_URL }}
      MM_E2E_RELEASE_WEBHOOK_URL: ${{ secrets.MM_E2E_RELEASE_WEBHOOK_URL }}
      MM_MOBILE_DETOX_AWS_ACCESS_KEY_ID: ${{ secrets.MM_MOBILE_DETOX_AWS_ACCESS_KEY_ID }}
      MM_MOBILE_DETOX_AWS_SECRET_ACCESS_KEY: ${{ secrets.MM_MOBILE_DETOX_AWS_SECRET_ACCESS_KEY }}
      MM_MOBILE_E2E_WEBHOOK_PUBLIC_BASE_URL: ${{ secrets.MM_MOBILE_E2E_WEBHOOK_PUBLIC_BASE_URL }}
      MM_MOBILE_E2E_CLOUDFLARED_TUNNEL_TOKEN: ${{ secrets.MM_MOBILE_E2E_CLOUDFLARED_TUNNEL_TOKEN }}
