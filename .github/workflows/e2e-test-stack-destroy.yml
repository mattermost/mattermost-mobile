---
name: E2E Test Stack - Destroy

# Releases a batch from its create response, e2e-test-stack-create-<batch>. A
# Detox platform run calls it after its shards (lifecycle: true): it collects each
# server's logs, destroys the batch, checks every site and mail host gets the
# router's 404 for a server that no longer exists, and destroys again expecting
# "not found". Run by hand with the run id and batch of a run that kept its
# batch, it collects the logs of the servers still up, destroys and checks; a
# batch already gone (reaped at its TTL, or destroyed before) has no logs, is
# "not found", and passes. It destroys the batch of every attempt that left a
# create response; a create that left none is beyond it, and goes at its TTL.
#
# It runs in the account the batch was created in, which create records beside
# the create response; a caller's account input must match it. It refuses a
# create response whose batch is not this run's (mobile-<run id>-<batch>-), as
# one copied in from another run. The account's CI role trusts only jobs in this
# file and e2e-test-stack-create.yml, on main and release-*.*.

on:
  workflow_call:
    inputs:
      batch:
        description: "The batch create named: e2e-test-stack-create-<batch> is its create response"
        type: string
        required: true
      account:
        description: "The AWS account the caller created the batch in, prod or dev; it must match the one create recorded"
        type: string
        required: true
      channel:
        description: "Control plane channel the batch was created on: v1 or edge"
        type: string
        default: "v1"
      toolkit_ref:
        description: "The mattermost-test-automation-toolkit ref whose e2e-test-stack action runs: main or a full commit on its main; empty is the pinned commit"
        type: string
        default: ""
      lifecycle:
        description: "Called after a run's tests: collect the servers' logs, and require the batch to be destroyed"
        type: boolean
        default: false
      logs_only:
        description: "Collect the logs and leave the batch up, for a re-run of failed tests"
        type: boolean
        default: false
    secrets:
      E2E_STACK_PRIVATE_KEY:
        description: "The repository's X25519 private key, which opens the secrets sealed to it"
        required: true
  workflow_dispatch:
    inputs:
      run_id:
        description: "The E2E workflow run that created the batch (the number in its URL)"
        required: true
        type: string
      batch:
        description: "The batch in that run: ios or android (e2e-test-stack-create-<batch> is its artifact)"
        required: true
        type: string
      channel:
        description: "Control plane channel the batch was created on"
        required: false
        type: choice
        options: ["v1", "edge"]
        default: "v1"
      toolkit_ref:
        description: "The mattermost-test-automation-toolkit ref whose e2e-test-stack action runs: main or a full commit on its main; empty is the pinned commit"
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read
  id-token: write

env:
  BATCH: ${{ inputs.batch }}
  CALLER_KEY: mobile
  # By hand: the run whose create response to read. Empty when called.
  RUN_ID: ${{ inputs.run_id }}
  TOOLKIT_REF: ${{ inputs.toolkit_ref }}

jobs:
  # Finds which of the batch's servers are still up, for logs; by hand, first checks the run named.
  run:
    if: inputs.run_id != '' || inputs.lifecycle || inputs.logs_only
    runs-on: ubuntu-24.04
    outputs:
      indexes: ${{ steps.indexes.outputs.indexes }}
    steps:
      # The batch names the create response artifact; it must be one create could have named.
      - name: ci/check-batch
        run: |
          if ! [[ "$BATCH" =~ ^[a-z0-9]([a-z0-9-]{0,18}[a-z0-9])?$ ]]; then
            echo "::error::batch must be 1 to 20 lowercase letters, digits and hyphens"
            exit 1
          fi

      - name: ci/setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false

      # This repository's toolkit action, at this workflow's own commit (never the code under test).
      - name: ci/checkout-toolkit-action
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          sparse-checkout: .github/actions/e2e-test-stack-toolkit
          persist-credentials: false

      # The e2e-test-stack action at TOOLKIT_REF: main, a commit on the toolkit's main, or the pinned commit.
      - name: ci/toolkit
        uses: ./.github/actions/e2e-test-stack-toolkit
        with:
          ref: ${{ env.TOOLKIT_REF }}

      # By hand, the run named must be a run of the E2E workflow on main or a release branch in this repository,
      # started by dispatch: a fork's run or another workflow's is refused. A PR's E2E run is dispatched on main too,
      # so every create-response reader below also accepts only that run's own batch (expect-batch-prefix).
      - name: ci/check-run
        if: inputs.run_id != ''
        uses: ./.e2e-test-stack-toolkit/actions/e2e-test-stack
        with:
          operation: check-run
          run-id: ${{ inputs.run_id }}
          allowed-workflows: .github/workflows/e2e-detox-pr.yml
          allowed-branches: main|release-[0-9]+\.[0-9]+
          allowed-events: workflow_dispatch

      # This run's create response for the batch (or, by hand, the named run's), from whichever attempt created it.
      # A batch that was never created has none: the job then has nothing to do.
      - name: ci/find-create-response
        id: response
        uses: ./.e2e-test-stack-toolkit/actions/e2e-test-stack
        with:
          operation: earlier-response
          run-id: ${{ inputs.run_id }}
          artifact-name: e2e-test-stack-create-${{ inputs.batch }}
          response-path: ${{ runner.temp }}/create/e2e-test-stack-create.json
          account-path: ${{ runner.temp }}/create/e2e-test-stack-account

      # The CI role of the account the batch's create recorded beside its response.
      - name: ci/role
        id: role
        if: steps.response.outputs.found == 'true'
        uses: ./.e2e-test-stack-toolkit/actions/e2e-test-stack
        with:
          operation: role
          # Called: the caller's account, which must match the recorded one. By hand: the recorded one.
          account: ${{ inputs.account }}
          account-file: ${{ runner.temp }}/create/e2e-test-stack-account
          role-arn-prod: ${{ vars.MM_E2E_TEST_STACK_AWS_ROLE_ARN_PROD }}
          role-arn-dev: ${{ vars.MM_E2E_TEST_STACK_AWS_ROLE_ARN_DEV }}

      - name: ci/configure-aws-credentials
        if: steps.response.outputs.found == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.role.outputs.role-arn }}
          aws-region: us-east-1

      # A batch reaped at its TTL, or destroyed before, has no servers to read logs from.
      - name: ci/fetch
        id: fetch
        if: steps.response.outputs.found == 'true'
        continue-on-error: true
        uses: ./.e2e-test-stack-toolkit/actions/e2e-test-stack
        with:
          operation: fetch
          caller-key: ${{ env.CALLER_KEY }}
          channel: ${{ inputs.channel }}
          private-key: ${{ secrets.E2E_STACK_PRIVATE_KEY }}
          create-response: ${{ runner.temp }}/create/e2e-test-stack-create.json
          expect-batch-prefix: mobile-${{ inputs.run_id || github.run_id }}-${{ inputs.batch }}-

      - name: ci/indexes
        id: indexes
        env:
          OUTCOME: ${{ steps.fetch.outcome }}
          INSTANCES: ${{ steps.fetch.outputs.instances }}
        run: |
          set -euo pipefail
          indexes='[]'
          if [ "$OUTCOME" = success ] && [ -n "$INSTANCES" ]; then
            indexes=$(jq -c '[to_entries[] | select(.value != null and .value.state == "ready") | .key]' <<< "$INSTANCES")
          fi
          if [ "$indexes" = '[]' ]; then
            echo "::notice::no server of the batch is up, so no logs are collected"
          fi
          echo "indexes=${indexes}" >> "$GITHUB_OUTPUT"

  # Uploads each server's full log.
  logs:
    needs: run
    # For the servers still up: called after a run's tests, or by hand.
    if: >-
      always() && needs.run.result == 'success' && needs.run.outputs.indexes != '' && needs.run.outputs.indexes != '[]'

    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # Each job calls the control plane, whose channel serves a limited number of calls at once across callers.
      max-parallel: 4
      matrix:
        index: ${{ fromJSON(needs.run.outputs.indexes) }}
    name: logs (server ${{ matrix.index }})
    steps:
      # The batch names the create response artifact; it must be one create could have named.
      - name: ci/check-batch
        run: |
          if ! [[ "$BATCH" =~ ^[a-z0-9]([a-z0-9-]{0,18}[a-z0-9])?$ ]]; then
            echo "::error::batch must be 1 to 20 lowercase letters, digits and hyphens"
            exit 1
          fi

      - name: ci/setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false

      # This repository's toolkit action, at this workflow's own commit (never the code under test).
      - name: ci/checkout-toolkit-action
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          sparse-checkout: .github/actions/e2e-test-stack-toolkit
          persist-credentials: false

      # The e2e-test-stack action at TOOLKIT_REF: main, a commit on the toolkit's main, or the pinned commit.
      - name: ci/toolkit
        uses: ./.github/actions/e2e-test-stack-toolkit
        with:
          ref: ${{ env.TOOLKIT_REF }}

      # This run's create response for the batch (or, by hand, the named run's), from whichever attempt created it.
      # A batch that was never created has none: the job then has nothing to do.
      - name: ci/find-create-response
        id: response
        uses: ./.e2e-test-stack-toolkit/actions/e2e-test-stack
        with:
          operation: earlier-response
          run-id: ${{ inputs.run_id }}
          artifact-name: e2e-test-stack-create-${{ inputs.batch }}
          response-path: ${{ runner.temp }}/create/e2e-test-stack-create.json
          account-path: ${{ runner.temp }}/create/e2e-test-stack-account

      # The CI role of the account the batch's create recorded beside its response.
      - name: ci/role
        id: role
        if: steps.response.outputs.found == 'true'
        uses: ./.e2e-test-stack-toolkit/actions/e2e-test-stack
        with:
          operation: role
          # Called: the caller's account, which must match the recorded one. By hand: the recorded one.
          account: ${{ inputs.account }}
          account-file: ${{ runner.temp }}/create/e2e-test-stack-account
          role-arn-prod: ${{ vars.MM_E2E_TEST_STACK_AWS_ROLE_ARN_PROD }}
          role-arn-dev: ${{ vars.MM_E2E_TEST_STACK_AWS_ROLE_ARN_DEV }}

      - name: ci/configure-aws-credentials
        if: steps.response.outputs.found == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.role.outputs.role-arn }}
          aws-region: us-east-1

      - name: ci/logs
        id: logs
        if: steps.response.outputs.found == 'true'
        uses: ./.e2e-test-stack-toolkit/actions/e2e-test-stack
        with:
          operation: logs
          caller-key: ${{ env.CALLER_KEY }}
          channel: ${{ inputs.channel }}
          private-key: ${{ secrets.E2E_STACK_PRIVATE_KEY }}
          create-response: ${{ runner.temp }}/create/e2e-test-stack-create.json
          expect-batch-prefix: mobile-${{ inputs.run_id || github.run_id }}-${{ inputs.batch }}-
          index: ${{ matrix.index }}
          logs-path: ${{ runner.temp }}/e2e-test-stack-server-${{ matrix.index }}.log

      # The full log, or the tail when the download failed (the logs step then fails too).
      - name: ci/upload-logs
        if: always() && steps.logs.outputs.logs-path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-stack-logs-${{ inputs.batch }}-${{ matrix.index }}
          path: ${{ steps.logs.outputs.logs-path }}
          if-no-files-found: error
          retention-days: 14
          # A re-run of failed tests uploads its logs again.
          overwrite: true

      - name: ci/assert-logs
        if: steps.response.outputs.found == 'true'
        env:
          LOGS_PATH: ${{ steps.logs.outputs.logs-path }}
          LOGS_FULL: ${{ steps.logs.outputs.logs-full }}
        run: |
          set -euo pipefail
          if [ -z "$LOGS_PATH" ] || [ ! -s "$LOGS_PATH" ]; then
            echo "::error::logs wrote no log"
            exit 1
          fi
          if [ "$LOGS_FULL" != "true" ]; then
            echo "::error::logs wrote only a truncated tail, not the full log"
            exit 1
          fi
          # The agent heads each container's output with "===== <container> =====".
          if ! grep -q '^===== .* =====$' "$LOGS_PATH"; then
            echo "::error::the log names no container"
            exit 1
          fi
          echo "  $(wc -l < "$LOGS_PATH") line(s): $(grep '^===== .* =====$' "$LOGS_PATH" | tr -d '=' | xargs)"

  # Each attempt that created a batch uploaded its own response, e2e-test-stack-create-response-<batch>-<attempt>:
  # destroy takes every one, so no attempt's batch depends on which response is the newest. A create that left no
  # response at all cannot be destroyed from here; its servers go at their TTL.
  responses:
    needs: run
    if: always() && !inputs.logs_only && (inputs.run_id == '' || needs.run.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      attempts: ${{ steps.attempts.outputs.attempts }}
    steps:
      - name: ci/attempts
        id: attempts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.run_id || github.run_id }}
        run: |
          set -euo pipefail
          if ! [[ "$BATCH" =~ ^[a-z0-9]([a-z0-9-]{0,18}[a-z0-9])?$ ]]; then
            echo "::error::batch must be 1 to 20 lowercase letters, digits and hyphens"
            exit 1
          fi
          err=$(mktemp)
          for attempt in 1 2 3; do
            if names=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN}/artifacts?per_page=100" \
              --jq '.artifacts[].name' 2> "$err"); then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::the run's artifacts could not be listed: $(tr '\n' ' ' < "$err")"
              exit 1
            fi
            sleep $((attempt * 10))
          done
          attempts=$(grep -E "^e2e-test-stack-create-response-${BATCH}-[0-9]{1,4}\$" <<< "$names" | sed 's/.*-//' |
            jq -Rsc 'split("\n") | map(select(. != "") | tonumber) | unique')
          echo "attempts=${attempts}" >> "$GITHUB_OUTPUT"
          if [ "$attempts" = '[]' ]; then
            echo "::notice::the ${BATCH} batch has no create response in run ${RUN}: none was created, or its create left none and its servers go at their TTL"
          else
            echo "create responses of the ${BATCH} batch, by attempt: ${attempts}"
          fi

  # Depends on nothing but the create responses, so a failed logs job never keeps a batch alive. By hand, only
  # after the run named passed its check.
  destroy:
    needs: [run, logs, responses]
    if: >-
      always() && !inputs.logs_only && needs.responses.result == 'success' && needs.responses.outputs.attempts != '[]'
    runs-on: ubuntu-24.04
    name: destroy (attempt ${{ matrix.attempt }})
    strategy:
      fail-fast: false
      # Each job calls the control plane, whose channel serves a limited number of calls at once across callers.
      max-parallel: 2
      matrix:
        attempt: ${{ fromJSON(needs.responses.outputs.attempts) }}
    steps:
      # The batch names the create response artifact; it must be one create could have named.
      - name: ci/check-batch
        run: |
          if ! [[ "$BATCH" =~ ^[a-z0-9]([a-z0-9-]{0,18}[a-z0-9])?$ ]]; then
            echo "::error::batch must be 1 to 20 lowercase letters, digits and hyphens"
            exit 1
          fi

      - name: ci/setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false

      # This repository's toolkit action, at this workflow's own commit (never the code under test).
      - name: ci/checkout-toolkit-action
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          sparse-checkout: .github/actions/e2e-test-stack-toolkit
          persist-credentials: false

      # The e2e-test-stack action at TOOLKIT_REF: main, a commit on the toolkit's main, or the pinned commit.
      - name: ci/toolkit
        uses: ./.github/actions/e2e-test-stack-toolkit
        with:
          ref: ${{ env.TOOLKIT_REF }}

      # This attempt's create response for the batch, in this run (or, by hand, the named run).
      - name: ci/find-create-response
        id: response
        uses: ./.e2e-test-stack-toolkit/actions/e2e-test-stack
        with:
          operation: earlier-response
          run-id: ${{ inputs.run_id }}
          artifact-name: e2e-test-stack-create-response-${{ inputs.batch }}-${{ matrix.attempt }}
          response-path: ${{ runner.temp }}/create/e2e-test-stack-create.json
          account-path: ${{ runner.temp }}/create/e2e-test-stack-account

      # The CI role of the account the batch's create recorded beside its response.
      - name: ci/role
        id: role
        if: steps.response.outputs.found == 'true'
        uses: ./.e2e-test-stack-toolkit/actions/e2e-test-stack
        with:
          operation: role
          # Called: the caller's account, which must match the recorded one. By hand: the recorded one.
          account: ${{ inputs.account }}
          account-file: ${{ runner.temp }}/create/e2e-test-stack-account
          role-arn-prod: ${{ vars.MM_E2E_TEST_STACK_AWS_ROLE_ARN_PROD }}
          role-arn-dev: ${{ vars.MM_E2E_TEST_STACK_AWS_ROLE_ARN_DEV }}

      - name: ci/configure-aws-credentials
        if: steps.response.outputs.found == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.role.outputs.role-arn }}
          aws-region: us-east-1

      - name: ci/destroy
        id: destroy
        if: steps.response.outputs.found == 'true'
        uses: ./.e2e-test-stack-toolkit/actions/e2e-test-stack
        with:
          operation: destroy
          caller-key: ${{ env.CALLER_KEY }}
          channel: ${{ inputs.channel }}
          private-key: ${{ secrets.E2E_STACK_PRIVATE_KEY }}
          create-response: ${{ runner.temp }}/create/e2e-test-stack-create.json
          expect-batch-prefix: mobile-${{ inputs.run_id || github.run_id }}-${{ inputs.batch }}-
          # Each site, mail and SSO host must then get the router's 404 for a server that no longer exists.
          verify-gone: true

      - name: ci/assert-destroyed
        if: steps.response.outputs.found == 'true'
        env:
          STATE: ${{ steps.destroy.outputs.state }}
          LIFECYCLE: ${{ inputs.lifecycle }}
          ATTEMPT: ${{ github.run_attempt }}
          RUN: ${{ inputs.run_id || github.run_id }}
        run: |
          set -euo pipefail
          case "$STATE" in
            destroyed) ;;
            "not found")
              # The batch id is mobile-<run id>-<batch>-<attempt>-<suffix>: one an earlier attempt created was destroyed
              # by that attempt's destroy or a later create; one this attempt created must still have existed.
              batch_id=$(jq -r '.batch_id // ""' "${RUNNER_TEMP}/create/e2e-test-stack-create.json")
              if [[ "$batch_id" != "mobile-${RUN}-${BATCH}-"* ]]; then
                echo "::error::the create response's batch is not this run's ${BATCH} batch"
                exit 1
              fi
              created=${batch_id#"mobile-${RUN}-${BATCH}-"}
              created=${created%%-*}
              if [ "$LIFECYCLE" = true ] && ! { [[ "$created" =~ ^[1-9][0-9]*$ ]] && [ "$created" -lt "$ATTEMPT" ]; }; then
                echo "::error::destroy says 'not found' for the batch this attempt created"
                exit 1
              fi
              echo "already gone"
              ;;
            *)
              echo "::error::destroy says state '${STATE}', want destroyed"
              exit 1
              ;;
          esac

      - name: ci/destroy-again
        id: again
        if: inputs.lifecycle && steps.response.outputs.found == 'true'
        uses: ./.e2e-test-stack-toolkit/actions/e2e-test-stack
        with:
          operation: destroy
          caller-key: ${{ env.CALLER_KEY }}
          channel: ${{ inputs.channel }}
          private-key: ${{ secrets.E2E_STACK_PRIVATE_KEY }}
          create-response: ${{ runner.temp }}/create/e2e-test-stack-create.json
          expect-batch-prefix: mobile-${{ inputs.run_id || github.run_id }}-${{ inputs.batch }}-

      - name: ci/assert-not-found
        if: inputs.lifecycle && steps.response.outputs.found == 'true'
        env:
          STATE: ${{ steps.again.outputs.state }}
        run: |
          if [ "$STATE" != "not found" ]; then
            echo "::error::a second destroy says state '${STATE}', want 'not found'"
            exit 1
          fi

      - name: ci/summary
        if: always()
        env:
          STATE: ${{ steps.destroy.outputs.state }}
          OUTCOME: ${{ steps.destroy.outcome }}
          ERROR: ${{ steps.destroy.outputs.error }}
          JOB_STATUS: ${{ job.status }}
          FOUND: ${{ steps.response.outputs.found }}
          AGAIN: ${{ steps.again.outputs.state }}
          ATTEMPT_CREATED: ${{ matrix.attempt }}
        run: |
          # The destroy step checks the hosts only once the batch is destroyed or not found, with no error.
          if [ "$FOUND" = false ]; then
            STATE="no create response (expired?)"
            GONE="not checked"
          elif [ -z "$STATE" ] && [ "$OUTCOME" = failure ]; then
            STATE="failed (see the destroy step)"
            GONE="not checked"
          elif [ -z "$STATE" ] && [ "$JOB_STATUS" = failure ]; then
            STATE="failed before destroy (see the job's steps)"
            GONE="not checked"
          elif [ -z "$STATE" ]; then
            GONE="not run"
          elif [ -n "$ERROR" ]; then
            # One table cell: no line breaks or pipes.
            GONE="not checked: $(tr '\n|' '  ' <<< "$ERROR")"
          else
            case "${STATE}:${OUTCOME}" in
              destroyed:success | "not found:success") GONE=yes ;;
              destroyed:failure | "not found:failure") GONE="no: a host is still served (see the destroy step)" ;;
              *) GONE="not checked" ;;
            esac
          fi
          {
            echo "### Destroy, attempt ${ATTEMPT_CREATED}"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Destroy | ${STATE:-not run} |"
            echo "| Sites, mail and SSO hosts gone | ${GONE:-not run} |"
            echo "| Destroy again | ${AGAIN:-not run} |"
          } >> "$GITHUB_STEP_SUMMARY"
