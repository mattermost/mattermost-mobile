---
name: E2E Test Stack - Destroy

# Releases a batch from its create responses: each attempt's own,
# e2e-test-stack-create-response-<batch>-<attempt>, and the newest,
# e2e-test-stack-create-<batch>, which also gives the logs. A Detox platform run
# calls it after its shards (lifecycle: true): it collects each server's logs,
# destroys the batch of every attempt that has one, checks every site and mail
# host gets the router's 404 for a server that no longer exists, and destroys
# again expecting "not found". Run by hand with the run id and batch of a run that
# kept its batch, it collects the logs of the servers still up, destroys and
# checks; a batch already gone (reaped at its TTL, or destroyed before) has no
# logs, is "not found", and passes. A create that left no response at all is
# beyond it: its servers go at their TTL.
#
# It runs in the account the batch was created in, which create records beside
# the create response; a caller's account input must match it. It destroys only a
# batch named exactly for this run, batch and attempt
# (mobile-<run id>-<batch>-<attempt>-<suffix>). The account's CI role trusts only
# jobs in this file and e2e-test-stack-create.yml, on main and release-*.*.

on:
  workflow_call:
    inputs:
      batch:
        description: "The batch create named; its create responses are e2e-test-stack-create-response-<batch>-<attempt> and the newest, e2e-test-stack-create-<batch>"
        type: string
        required: true
      account:
        description: "The AWS account the caller created the batch in, prod or dev; it must match the one create recorded"
        type: string
        required: true
      channel:
        description: "Control plane channel the batch was created on: v1 or edge"
        type: string
        default: "v1"
      toolkit_ref:
        description: "The mattermost-test-automation-toolkit ref whose e2e-test-stack action runs: main or a full commit on its main; empty is the pinned commit"
        type: string
        default: ""
      lifecycle:
        description: "Called after a run's tests: collect the servers' logs, and require the batch to be destroyed"
        type: boolean
        default: false
      logs_only:
        description: "Collect the logs and leave the batch up, for a re-run of failed tests"
        type: boolean
        default: false
    secrets:
      E2E_TEST_STACK_CREDENTIALS_KEY:
        description: "The repository's credentials key, which opens the batch's sealed server credentials"
        required: true
  workflow_dispatch:
    inputs:
      run_id:
        description: "The E2E workflow run that created the batch (the number in its URL)"
        required: true
        type: string
      batch:
        description: "The batch in that run: ios or android (e2e-test-stack-create-response-<batch>-<attempt> are its artifacts)"
        required: true
        type: string
      channel:
        description: "Control plane channel the batch was created on"
        required: false
        type: choice
        options: ["v1", "edge"]
        default: "v1"
      toolkit_ref:
        description: "The mattermost-test-automation-toolkit ref whose e2e-test-stack action runs: main or a full commit on its main; empty is the pinned commit"
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read
  id-token: write

env:
  BATCH: ${{ inputs.batch }}
  CALLER_KEY: mobile
  # By hand: the run whose create response to read. Empty when called.
  RUN_ID: ${{ inputs.run_id }}
  TOOLKIT_REF: ${{ inputs.toolkit_ref }}

jobs:
  # By hand only: the run named must be a run of the E2E workflow on main or a release branch in this repository,
  # started by dispatch: a fork's run or another workflow's is refused. A PR's E2E run is dispatched on main too, so
  # every create-response reader below also accepts only that run's own batch. Destroy depends on this check alone,
  # never on finding the servers for logs.
  check:
    if: inputs.run_id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The batch names the create response artifact; it must be one create could have named.
      - name: ci/check-batch
        run: |
          if ! [[ "$BATCH" =~ ^[a-z0-9]([a-z0-9-]{0,18}[a-z0-9])?$ ]]; then
            echo "::error::batch must be 1 to 20 lowercase letters, digits and hyphens"
            exit 1
          fi

      - name: ci/setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false

      # This repository's toolkit action, at this workflow's own commit (never the code under test).
      - name: ci/checkout-toolkit-action
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          sparse-checkout: .github/actions/e2e-test-stack-toolkit
          persist-credentials: false

      # The e2e-test-stack action at TOOLKIT_REF: main, a commit on the toolkit's main, or the pinned commit.
      - name: ci/toolkit
        uses: ./.github/actions/e2e-test-stack-toolkit
        with:
          ref: ${{ env.TOOLKIT_REF }}

      - name: ci/check-run
        uses: ./.e2e-test-stack-toolkit/actions/e2e-test-stack
        with:
          operation: check-run
          run-id: ${{ inputs.run_id }}
          allowed-workflows: .github/workflows/e2e-detox-pr.yml
          allowed-branches: main|release-[0-9]+\.[0-9]+
          allowed-events: workflow_dispatch

  # Finds which of the batch's servers are still up, for logs, from the newest create response, or the latest
  # attempt's own when the newest is missing or older. A batch that is gone has none. A response that cannot be read
  # and has no stand-in, or a fetch that fails, fails this job after a run's tests, so missing logs are seen.
  run:
    needs: check
    if: >-
      always() &&
      ((inputs.run_id == '' && (inputs.lifecycle || inputs.logs_only)) || (inputs.run_id != '' && needs.check.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      indexes: ${{ steps.indexes.outputs.indexes }}
      artifact: ${{ steps.source.outputs.artifact }}
    steps:
      # The batch names the create response artifact; it must be one create could have named.
      - name: ci/check-batch
        run: |
          if ! [[ "$BATCH" =~ ^[a-z0-9]([a-z0-9-]{0,18}[a-z0-9])?$ ]]; then
            echo "::error::batch must be 1 to 20 lowercase letters, digits and hyphens"
            exit 1
          fi

      - name: ci/setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false

      # This repository's toolkit action, at this workflow's own commit (never the code under test).
      - name: ci/checkout-toolkit-action
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          sparse-checkout: .github/actions/e2e-test-stack-toolkit
          persist-credentials: false

      # The e2e-test-stack action at TOOLKIT_REF: main, a commit on the toolkit's main, or the pinned commit.
      - name: ci/toolkit
        uses: ./.github/actions/e2e-test-stack-toolkit
        with:
          ref: ${{ env.TOOLKIT_REF }}

      # An expired or unreadable newest is no newest: the latest attempt's own is used instead.
      - name: ci/find-newest-response
        id: response
        continue-on-error: true
        uses: ./.e2e-test-stack-toolkit/actions/e2e-test-stack
        with:
          operation: earlier-response
          run-id: ${{ inputs.run_id }}
          artifact-name: e2e-test-stack-create-${{ inputs.batch }}
          response-path: ${{ runner.temp }}/newest/e2e-test-stack-create.json
          account-path: ${{ runner.temp }}/newest/e2e-test-stack-account

      # The response naming the latest attempt with a batch, no later than the run's own: the newest, or the latest
      # attempt's own, e2e-test-stack-create-response-<batch>-<attempt>, when the newest is missing or older.
      - name: ci/latest-response
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN: ${{ inputs.run_id }}
          RUN: ${{ inputs.run_id || github.run_id }}
          NEWEST_FOUND: ${{ steps.response.outputs.found }}
        run: |
          set -euo pipefail
          err=$(mktemp)
          api() {
            local out attempt
            for attempt in 1 2 3; do
              if out=$(gh api "$@" 2> "$err"); then
                printf '%s' "$out"
                return 0
              fi
              [ "$attempt" -eq 3 ] || sleep $((attempt * 10))
            done
            echo "::error::GitHub API call failed: $(tr '\n' ' ' < "$err")" >&2
            return 1
          }
          if [ -z "$INPUT_RUN" ]; then
            latest=$GITHUB_RUN_ATTEMPT
          else
            latest=$(api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN}" --jq .run_attempt)
          fi
          if ! [[ "$latest" =~ ^[1-9][0-9]{0,3}$ ]]; then
            echo "::error::the run's latest attempt is not a number"
            exit 1
          fi
          names=$(api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired | not) | .name')
          own=$({ grep -E "^e2e-test-stack-create-response-${BATCH}-[1-9][0-9]{0,3}\$" <<< "$names" || true; } |
            sed 's/.*-//' | awk -v latest="$latest" '$1 <= latest' | sort -n | tail -1)
          newest=""
          if [ "$NEWEST_FOUND" = true ]; then
            batch_id=$(jq -r '.batch_id // ""' "${RUNNER_TEMP}/newest/e2e-test-stack-create.json")
            if [[ "$batch_id" =~ ^mobile-${RUN}-${BATCH}-([1-9][0-9]{0,3})-[a-z0-9]+$ ]] && [ "${BASH_REMATCH[1]}" -le "$latest" ]; then
              newest=${BASH_REMATCH[1]}
            fi
          fi
          if [ -n "$newest" ] && { [ -z "$own" ] || [ "$newest" -ge "$own" ]; }; then
            echo "use=newest" >> "$GITHUB_OUTPUT"
          elif [ -n "$own" ]; then
            {
              echo "use=own"
              echo "attempt=${own}"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: ci/find-own-response
        id: own
        if: steps.latest.outputs.use == 'own'
        continue-on-error: true
        uses: ./.e2e-test-stack-toolkit/actions/e2e-test-stack
        with:
          operation: earlier-response
          run-id: ${{ inputs.run_id }}
          artifact-name: e2e-test-stack-create-response-${{ inputs.batch }}-${{ steps.latest.outputs.attempt }}
          response-path: ${{ runner.temp }}/create/e2e-test-stack-create.json
          account-path: ${{ runner.temp }}/create/e2e-test-stack-account

      - name: ci/source
        id: source
        env:
          USE: ${{ steps.latest.outputs.use }}
          OWN: ${{ steps.own.outputs.found }}
          ATTEMPT: ${{ steps.latest.outputs.attempt }}
          NEWEST_OUTCOME: ${{ steps.response.outcome }}
          OWN_OUTCOME: ${{ steps.own.outcome }}
          LIFECYCLE: ${{ inputs.lifecycle }}
        run: |
          set -euo pipefail
          if [ "$USE" = newest ]; then
            mkdir -p "${RUNNER_TEMP}/create"
            cp "${RUNNER_TEMP}/newest/e2e-test-stack-create.json" "${RUNNER_TEMP}/create/e2e-test-stack-create.json"
            if [ -f "${RUNNER_TEMP}/newest/e2e-test-stack-account" ]; then
              cp "${RUNNER_TEMP}/newest/e2e-test-stack-account" "${RUNNER_TEMP}/create/e2e-test-stack-account"
            fi
            echo "artifact=e2e-test-stack-create-${BATCH}" >> "$GITHUB_OUTPUT"
          elif [ "$USE" = own ] && [ "$OWN" = true ]; then
            echo "::warning::the newest create response is missing or older; the logs come from attempt ${ATTEMPT}'s own"
            echo "artifact=e2e-test-stack-create-response-${BATCH}-${ATTEMPT}" >> "$GITHUB_OUTPUT"
          elif [ "$NEWEST_OUTCOME" = failure ] || [ "$OWN_OUTCOME" = failure ]; then
            if [ "$LIFECYCLE" = true ]; then
              echo "::error::the ${BATCH} batch's create response could not be read, so no logs are collected"
              exit 1
            fi
            echo "::warning::the ${BATCH} batch's create response could not be read, so no logs are collected"
          else
            echo "the ${BATCH} batch has no create response, so there are no servers to read logs from"
          fi

      - name: ci/role
        id: role
        if: steps.source.outputs.artifact != ''
        uses: ./.e2e-test-stack-toolkit/actions/e2e-test-stack
        with:
          operation: role
          # Called: the caller's account, which must match the recorded one. By hand: the recorded one.
          account: ${{ inputs.account }}
          account-file: ${{ runner.temp }}/create/e2e-test-stack-account
          role-arn-prod: ${{ vars.E2E_TEST_STACK_ROLE_ARN_PROD }}
          role-arn-dev: ${{ vars.E2E_TEST_STACK_ROLE_ARN_DEV }}

      - name: ci/configure-aws-credentials
        if: steps.source.outputs.artifact != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.role.outputs.role-arn }}
          aws-region: us-east-1

      # A batch reaped at its TTL, or destroyed before, has no servers to read logs from.
      - name: ci/fetch
        id: fetch
        if: steps.source.outputs.artifact != ''
        continue-on-error: true
        uses: ./.e2e-test-stack-toolkit/actions/e2e-test-stack
        with:
          operation: fetch
          caller-key: ${{ env.CALLER_KEY }}
          channel: ${{ inputs.channel }}
          credentials-key: ${{ secrets.E2E_TEST_STACK_CREDENTIALS_KEY }}
          create-response: ${{ runner.temp }}/create/e2e-test-stack-create.json
          expect-batch-prefix: mobile-${{ inputs.run_id || github.run_id }}-${{ inputs.batch }}-

      # A batch that is gone has no servers; a fetch that failed otherwise fails the job, so missing logs are seen.
      - name: ci/indexes
        id: indexes
        env:
          OUTCOME: ${{ steps.fetch.outcome }}
          STATE: ${{ steps.fetch.outputs.state }}
          INSTANCES: ${{ steps.fetch.outputs.instances }}
        run: |
          set -euo pipefail
          indexes='[]'
          if [ "$OUTCOME" = failure ] && [ "$STATE" != "not found" ]; then
            echo "::error::the batch's servers could not be looked up, so no logs are collected (see the fetch step)"
            echo "indexes=[]" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$OUTCOME" = success ] && [ -n "$INSTANCES" ]; then
            indexes=$(jq -c '[to_entries[] | select(.value != null and .value.state == "ready") | .key]' <<< "$INSTANCES")
          fi
          if [ "$indexes" = '[]' ]; then
            echo "::notice::no server of the batch is up, so no logs are collected"
          fi
          echo "indexes=${indexes}" >> "$GITHUB_OUTPUT"

  # Uploads each server's full log.
  logs:
    needs: run
    # For the servers still up: called after a run's tests, or by hand.
    if: >-
      always() && needs.run.result == 'success' && needs.run.outputs.indexes != '' && needs.run.outputs.indexes != '[]'

    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # Each job calls the control plane, whose channel serves a limited number of calls at once across callers.
      max-parallel: 4
      matrix:
        index: ${{ fromJSON(needs.run.outputs.indexes) }}
    name: logs (server ${{ matrix.index }})
    steps:
      # The batch names the create response artifact; it must be one create could have named.
      - name: ci/check-batch
        run: |
          if ! [[ "$BATCH" =~ ^[a-z0-9]([a-z0-9-]{0,18}[a-z0-9])?$ ]]; then
            echo "::error::batch must be 1 to 20 lowercase letters, digits and hyphens"
            exit 1
          fi

      - name: ci/setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false

      # This repository's toolkit action, at this workflow's own commit (never the code under test).
      - name: ci/checkout-toolkit-action
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          sparse-checkout: .github/actions/e2e-test-stack-toolkit
          persist-credentials: false

      # The e2e-test-stack action at TOOLKIT_REF: main, a commit on the toolkit's main, or the pinned commit.
      - name: ci/toolkit
        uses: ./.github/actions/e2e-test-stack-toolkit
        with:
          ref: ${{ env.TOOLKIT_REF }}

      # This run's create response for the batch (or, by hand, the named run's), from whichever attempt created it.
      # A batch that was never created has none: the job then has nothing to do.
      - name: ci/find-create-response
        id: response
        uses: ./.e2e-test-stack-toolkit/actions/e2e-test-stack
        with:
          operation: earlier-response
          run-id: ${{ inputs.run_id }}
          artifact-name: ${{ needs.run.outputs.artifact }}
          response-path: ${{ runner.temp }}/create/e2e-test-stack-create.json
          account-path: ${{ runner.temp }}/create/e2e-test-stack-account

      # The CI role of the account the batch's create recorded beside its response.
      - name: ci/role
        id: role
        if: steps.response.outputs.found == 'true'
        uses: ./.e2e-test-stack-toolkit/actions/e2e-test-stack
        with:
          operation: role
          # Called: the caller's account, which must match the recorded one. By hand: the recorded one.
          account: ${{ inputs.account }}
          account-file: ${{ runner.temp }}/create/e2e-test-stack-account
          role-arn-prod: ${{ vars.E2E_TEST_STACK_ROLE_ARN_PROD }}
          role-arn-dev: ${{ vars.E2E_TEST_STACK_ROLE_ARN_DEV }}

      - name: ci/configure-aws-credentials
        if: steps.response.outputs.found == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.role.outputs.role-arn }}
          aws-region: us-east-1

      - name: ci/logs
        id: logs
        if: steps.response.outputs.found == 'true'
        uses: ./.e2e-test-stack-toolkit/actions/e2e-test-stack
        with:
          operation: logs
          caller-key: ${{ env.CALLER_KEY }}
          channel: ${{ inputs.channel }}
          credentials-key: ${{ secrets.E2E_TEST_STACK_CREDENTIALS_KEY }}
          create-response: ${{ runner.temp }}/create/e2e-test-stack-create.json
          expect-batch-prefix: mobile-${{ inputs.run_id || github.run_id }}-${{ inputs.batch }}-
          index: ${{ matrix.index }}
          logs-path: ${{ runner.temp }}/e2e-test-stack-server-${{ matrix.index }}.log

      # The full log, or the tail when the download failed (the logs step then fails too).
      - name: ci/upload-logs
        if: always() && steps.logs.outputs.logs-path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-stack-logs-${{ inputs.batch }}-${{ matrix.index }}
          path: ${{ steps.logs.outputs.logs-path }}
          if-no-files-found: error
          retention-days: 14
          # A re-run of failed tests uploads its logs again.
          overwrite: true

      - name: ci/assert-logs
        if: steps.response.outputs.found == 'true'
        env:
          LOGS_PATH: ${{ steps.logs.outputs.logs-path }}
          LOGS_FULL: ${{ steps.logs.outputs.logs-full }}
        run: |
          set -euo pipefail
          if [ -z "$LOGS_PATH" ] || [ ! -s "$LOGS_PATH" ]; then
            echo "::error::logs wrote no log"
            exit 1
          fi
          if [ "$LOGS_FULL" != "true" ]; then
            echo "::error::logs wrote only a truncated tail, not the full log"
            exit 1
          fi
          # The agent heads each container's output with "===== <container> =====".
          if ! grep -q '^===== .* =====$' "$LOGS_PATH"; then
            echo "::error::the log names no container"
            exit 1
          fi
          echo "  $(wc -l < "$LOGS_PATH") line(s): $(grep '^===== .* =====$' "$LOGS_PATH" | tr -d '=' | xargs)"

  # The attempts with a batch to destroy: those with a create response of their own,
  # e2e-test-stack-create-response-<batch>-<attempt>, and the attempt the newest response,
  # e2e-test-stack-create-<batch>, names.
  attempts:
    needs: check
    if: always() && !inputs.logs_only && (inputs.run_id == '' || needs.check.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      attempts: ${{ steps.attempts.outputs.attempts }}
    steps:
      # The batch names the create response artifact; it must be one create could have named.
      - name: ci/check-batch
        run: |
          if ! [[ "$BATCH" =~ ^[a-z0-9]([a-z0-9-]{0,18}[a-z0-9])?$ ]]; then
            echo "::error::batch must be 1 to 20 lowercase letters, digits and hyphens"
            exit 1
          fi

      - name: ci/setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false

      # This repository's toolkit action, at this workflow's own commit (never the code under test).
      - name: ci/checkout-toolkit-action
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          sparse-checkout: .github/actions/e2e-test-stack-toolkit
          persist-credentials: false

      # The e2e-test-stack action at TOOLKIT_REF: main, a commit on the toolkit's main, or the pinned commit.
      - name: ci/toolkit
        uses: ./.github/actions/e2e-test-stack-toolkit
        with:
          ref: ${{ env.TOOLKIT_REF }}

      # A newest response that cannot be read adds no attempt; the attempts with their own are still destroyed.
      - name: ci/find-newest-response
        id: newest
        continue-on-error: true
        uses: ./.e2e-test-stack-toolkit/actions/e2e-test-stack
        with:
          operation: earlier-response
          run-id: ${{ inputs.run_id }}
          artifact-name: e2e-test-stack-create-${{ inputs.batch }}
          response-path: ${{ runner.temp }}/newest/e2e-test-stack-create.json

      - name: ci/attempts
        id: attempts
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN: ${{ inputs.run_id }}
          RUN: ${{ inputs.run_id || github.run_id }}
          NEWEST: ${{ steps.newest.outputs.found }}
          NEWEST_OUTCOME: ${{ steps.newest.outcome }}
          LIFECYCLE: ${{ inputs.lifecycle }}
        run: |
          set -euo pipefail
          err=$(mktemp)
          api() {
            local out attempt
            for attempt in 1 2 3; do
              if out=$(gh api "$@" 2> "$err"); then
                printf '%s' "$out"
                return 0
              fi
              [ "$attempt" -eq 3 ] || sleep $((attempt * 10))
            done
            echo "::error::GitHub API call failed: $(tr '\n' ' ' < "$err")" >&2
            return 1
          }
          if [ -z "$INPUT_RUN" ]; then
            latest=$GITHUB_RUN_ATTEMPT
          else
            latest=$(api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN}" --jq .run_attempt)
          fi
          if ! [[ "$latest" =~ ^[1-9][0-9]{0,3}$ ]]; then
            echo "::error::the run's latest attempt is not a number"
            exit 1
          fi
          names=$(api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired | not) | .name')
          numbers() {
            { grep -E "^${1}-${BATCH}-[1-9][0-9]{0,3}\$" <<< "$names" || true; } | sed 's/.*-//' |
              jq -Rsc --argjson latest "$latest" 'split("\n") | map(select(. != "") | tonumber | select(. <= $latest)) | unique'
          }
          own=$(numbers e2e-test-stack-create-response)
          newest='[]'
          if [ "$NEWEST" = true ]; then
            batch_id=$(jq -r '.batch_id // ""' "${RUNNER_TEMP}/newest/e2e-test-stack-create.json")
            if [[ "$batch_id" =~ ^mobile-${RUN}-${BATCH}-([1-9][0-9]{0,3})-[a-z0-9]+$ ]] && [ "${BASH_REMATCH[1]}" -le "$latest" ]; then
              newest="[${BASH_REMATCH[1]}]"
            fi
          fi
          attempts=$(jq -nc --argjson a "$own" --argjson b "$newest" '$a + $b | unique')
          echo "attempts=${attempts}" >> "$GITHUB_OUTPUT"
          # An unreadable newest may name a batch no own response does: the attempts listed are still destroyed, and
          # after a run's tests the job then fails, so a batch that may be up is not passed over in silence.
          if [ "$NEWEST_OUTCOME" = failure ]; then
            if [ "$LIFECYCLE" = true ]; then
              echo "::error::the newest create response could not be read; a batch only it names is not destroyed and goes at its TTL"
              newest_failed=true
            else
              echo "::warning::the newest create response could not be read; a batch only it names is not destroyed"
            fi
          fi
          if [ "$attempts" = '[]' ]; then
            echo "::notice::the ${BATCH} batch has no create response in run ${RUN}: none was created, or its create left none and its servers go at their TTL"
          else
            echo "attempts with a batch: ${attempts}"
          fi
          if [ "${newest_failed:-false}" = true ]; then
            exit 1
          fi

  # One job per attempt with a batch, destroying it from that attempt's own create response, or from the newest when
  # that is this attempt's. Depends on nothing but the responses, so a failed logs job never keeps a batch alive. By hand,
  # only after the run named passed its check. A create that left no response at all goes at its TTL.
  destroy:
    needs: [check, run, logs, attempts]
    if: >-
      always() && !inputs.logs_only && needs.attempts.outputs.attempts != '' && needs.attempts.outputs.attempts != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: destroy (attempt ${{ matrix.attempt }})
    strategy:
      fail-fast: false
      # Each job calls the control plane, whose channel serves a limited number of calls at once across callers.
      max-parallel: 2
      matrix:
        attempt: ${{ fromJSON(needs.attempts.outputs.attempts) }}
    steps:
      # The batch names the create response artifact; it must be one create could have named.
      - name: ci/check-batch
        run: |
          if ! [[ "$BATCH" =~ ^[a-z0-9]([a-z0-9-]{0,18}[a-z0-9])?$ ]]; then
            echo "::error::batch must be 1 to 20 lowercase letters, digits and hyphens"
            exit 1
          fi

      - name: ci/setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false

      # This repository's toolkit action, at this workflow's own commit (never the code under test).
      - name: ci/checkout-toolkit-action
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          sparse-checkout: .github/actions/e2e-test-stack-toolkit
          persist-credentials: false

      # The e2e-test-stack action at TOOLKIT_REF: main, a commit on the toolkit's main, or the pinned commit.
      - name: ci/toolkit
        uses: ./.github/actions/e2e-test-stack-toolkit
        with:
          ref: ${{ env.TOOLKIT_REF }}

      # This attempt's create response for the batch, in this run (or, by hand, the named run). An expired or
      # unreadable one is none: the newest is tried instead.
      - name: ci/find-create-response
        id: response
        continue-on-error: true
        uses: ./.e2e-test-stack-toolkit/actions/e2e-test-stack
        with:
          operation: earlier-response
          run-id: ${{ inputs.run_id }}
          artifact-name: e2e-test-stack-create-response-${{ inputs.batch }}-${{ matrix.attempt }}
          response-path: ${{ runner.temp }}/create/e2e-test-stack-create.json
          account-path: ${{ runner.temp }}/create/e2e-test-stack-account

      # Without its own, the newest response, which names this attempt's batch when only its own upload failed.
      - name: ci/find-newest-response
        id: newest
        if: steps.response.outputs.found != 'true'
        continue-on-error: true
        uses: ./.e2e-test-stack-toolkit/actions/e2e-test-stack
        with:
          operation: earlier-response
          run-id: ${{ inputs.run_id }}
          artifact-name: e2e-test-stack-create-${{ inputs.batch }}
          response-path: ${{ runner.temp }}/newest/e2e-test-stack-create.json
          account-path: ${{ runner.temp }}/newest/e2e-test-stack-account

      # The batch to destroy is exactly this attempt's, mobile-<run id>-<batch>-<attempt>-<suffix>.
      - name: ci/pick
        id: pick
        env:
          RUN: ${{ inputs.run_id || github.run_id }}
          ATTEMPT_CREATED: ${{ matrix.attempt }}
          OWN: ${{ steps.response.outputs.found }}
          NEWEST: ${{ steps.newest.outputs.found }}
          OWN_OUTCOME: ${{ steps.response.outcome }}
          LIFECYCLE: ${{ inputs.lifecycle }}
        run: |
          set -euo pipefail
          mine() {
            local batch_id
            batch_id=$(jq -r '.batch_id // ""' "$1")
            [[ "$batch_id" =~ ^mobile-${RUN}-${BATCH}-${ATTEMPT_CREATED}-[a-z0-9]+$ ]]
          }
          if [ "$OWN" = true ]; then
            if ! mine "${RUNNER_TEMP}/create/e2e-test-stack-create.json"; then
              echo "::error::the response for attempt ${ATTEMPT_CREATED} holds a batch that attempt of this run did not create"
              exit 1
            fi
            echo "use=true" >> "$GITHUB_OUTPUT"
          elif [ "$NEWEST" = true ] && mine "${RUNNER_TEMP}/newest/e2e-test-stack-create.json"; then
            mkdir -p "${RUNNER_TEMP}/create"
            rm -f "${RUNNER_TEMP}/create/e2e-test-stack-create.json" "${RUNNER_TEMP}/create/e2e-test-stack-account"
            cp "${RUNNER_TEMP}/newest/e2e-test-stack-create.json" "${RUNNER_TEMP}/create/e2e-test-stack-create.json"
            if [ -f "${RUNNER_TEMP}/newest/e2e-test-stack-account" ]; then
              cp "${RUNNER_TEMP}/newest/e2e-test-stack-account" "${RUNNER_TEMP}/create/e2e-test-stack-account"
            fi
            echo "::warning::attempt ${ATTEMPT_CREATED}'s own response is missing; destroying its batch from the newest response"
            echo "use=true" >> "$GITHUB_OUTPUT"
          elif [ "$OWN_OUTCOME" = failure ]; then
            # Listed with a response of its own that could not be read: its batch may be up.
            echo "use=false" >> "$GITHUB_OUTPUT"
            if [ "$LIFECYCLE" = true ]; then
              echo "::error::attempt ${ATTEMPT_CREATED}'s create response could not be read, so its batch is not destroyed and goes at its TTL"
              exit 1
            fi
            echo "::warning::attempt ${ATTEMPT_CREATED}'s create response could not be read, so its batch is not destroyed"
          else
            echo "attempt ${ATTEMPT_CREATED} has no batch: it called no create, its create made none, or (with no response at all) its servers go at their TTL"
            echo "use=false" >> "$GITHUB_OUTPUT"
          fi

      # The CI role of the account the batch's create recorded beside its response.
      - name: ci/role
        id: role
        if: steps.pick.outputs.use == 'true'
        uses: ./.e2e-test-stack-toolkit/actions/e2e-test-stack
        with:
          operation: role
          # Called: the caller's account, which must match the recorded one. By hand: the recorded one.
          account: ${{ inputs.account }}
          account-file: ${{ runner.temp }}/create/e2e-test-stack-account
          role-arn-prod: ${{ vars.E2E_TEST_STACK_ROLE_ARN_PROD }}
          role-arn-dev: ${{ vars.E2E_TEST_STACK_ROLE_ARN_DEV }}

      - name: ci/configure-aws-credentials
        if: steps.pick.outputs.use == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.role.outputs.role-arn }}
          aws-region: us-east-1

      - name: ci/destroy
        id: destroy
        if: steps.pick.outputs.use == 'true'
        uses: ./.e2e-test-stack-toolkit/actions/e2e-test-stack
        with:
          operation: destroy
          caller-key: ${{ env.CALLER_KEY }}
          channel: ${{ inputs.channel }}
          credentials-key: ${{ secrets.E2E_TEST_STACK_CREDENTIALS_KEY }}
          create-response: ${{ runner.temp }}/create/e2e-test-stack-create.json
          expect-batch-prefix: mobile-${{ inputs.run_id || github.run_id }}-${{ inputs.batch }}-
          # Each site, mail and SSO host must then get the router's 404 for a server that no longer exists.
          verify-gone: true

      - name: ci/assert-destroyed
        if: steps.pick.outputs.use == 'true'
        env:
          STATE: ${{ steps.destroy.outputs.state }}
          LIFECYCLE: ${{ inputs.lifecycle }}
          ATTEMPT: ${{ github.run_attempt }}
          ATTEMPT_CREATED: ${{ matrix.attempt }}
        run: |
          set -euo pipefail
          case "$STATE" in
            destroyed) ;;
            "not found")
              # An earlier attempt's batch may be gone already: destroyed by an earlier destroy or a later create, or
              # reaped at its TTL. One this attempt created must still have existed.
              if [ "$LIFECYCLE" = true ] && [ "$ATTEMPT_CREATED" -ge "$ATTEMPT" ]; then
                echo "::error::destroy says 'not found' for the batch this attempt created"
                exit 1
              fi
              echo "already gone"
              ;;
            *)
              echo "::error::destroy says state '${STATE}', want destroyed"
              exit 1
              ;;
          esac

      - name: ci/destroy-again
        id: again
        if: inputs.lifecycle && steps.pick.outputs.use == 'true'
        uses: ./.e2e-test-stack-toolkit/actions/e2e-test-stack
        with:
          operation: destroy
          caller-key: ${{ env.CALLER_KEY }}
          channel: ${{ inputs.channel }}
          credentials-key: ${{ secrets.E2E_TEST_STACK_CREDENTIALS_KEY }}
          create-response: ${{ runner.temp }}/create/e2e-test-stack-create.json
          expect-batch-prefix: mobile-${{ inputs.run_id || github.run_id }}-${{ inputs.batch }}-

      - name: ci/assert-not-found
        if: inputs.lifecycle && steps.pick.outputs.use == 'true'
        env:
          STATE: ${{ steps.again.outputs.state }}
        run: |
          if [ "$STATE" != "not found" ]; then
            echo "::error::a second destroy says state '${STATE}', want 'not found'"
            exit 1
          fi

      - name: ci/summary
        if: always()
        env:
          STATE: ${{ steps.destroy.outputs.state }}
          OUTCOME: ${{ steps.destroy.outcome }}
          ERROR: ${{ steps.destroy.outputs.error }}
          JOB_STATUS: ${{ job.status }}
          USE: ${{ steps.pick.outputs.use }}
          AGAIN: ${{ steps.again.outputs.state }}
          ATTEMPT_CREATED: ${{ matrix.attempt }}
        run: |
          # The destroy step checks the hosts only once the batch is destroyed or not found, with no error.
          if [ "$USE" = false ]; then
            STATE="no batch for this attempt"
            GONE="not checked"
          elif [ -z "$STATE" ] && [ "$OUTCOME" = failure ]; then
            STATE="failed (see the destroy step)"
            GONE="not checked"
          elif [ -z "$STATE" ] && [ "$JOB_STATUS" = failure ]; then
            STATE="failed before destroy (see the job's steps)"
            GONE="not checked"
          elif [ -z "$STATE" ]; then
            GONE="not run"
          elif [ -n "$ERROR" ]; then
            # One table cell: no line breaks or pipes.
            GONE="not checked: $(tr '\n|' '  ' <<< "$ERROR")"
          else
            case "${STATE}:${OUTCOME}" in
              destroyed:success | "not found:success") GONE=yes ;;
              destroyed:failure | "not found:failure") GONE="no: a host is still served (see the destroy step)" ;;
              *) GONE="not checked" ;;
            esac
          fi
          {
            echo "### Destroy, attempt ${ATTEMPT_CREATED}"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Destroy | ${STATE:-not run} |"
            echo "| Sites, mail and SSO hosts gone | ${GONE:-not run} |"
            echo "| Destroy again | ${AGAIN:-not run} |"
          } >> "$GITHUB_STEP_SUMMARY"
