name: Compatibility Matrix Testing

on:
  workflow_dispatch:
    inputs:
      CMT_MATRIX:
        description: "A JSON object representing the testing matrix"
        required: true
        type: string
      MOBILE_VERSION:
        description: "The mattermost mobile version to test"
        required: true

# Cancel overlapping CMT runs for the same ref; matterwick cleans up cancelled servers via workflow_run completed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CMT runs against a freshly-cut build-release-NNN branch, so the app content
# never matches main's fingerprint — the S3 build cache would always miss.
# CMT's optimization is structural instead: each app (iOS, Android Detox,
# Android Maestro) is built ONCE below and reused across every server-version
# leg of the matrix via github.run_id artifacts.
jobs:
  calculate-commit-hash:
    runs-on: ubuntu-24.04
    outputs:
      MOBILE_SHA: ${{ steps.repo.outputs.MOBILE_SHA }}
    steps:
      - name: cmt/checkout-mobile
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ inputs.MOBILE_VERSION }}

      - name: cmt/calculate-mattermost-sha
        id: repo
        run: echo "MOBILE_SHA=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  # Phase 5 — base TSIO identity for this CMT run. Each matrix leg builds its
  # own per-job report group (total_reports_expected=1) from this base + tsio-shard-name.
  cmt-identity:
    name: Calculate CMT TSIO base identity
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs:
      - calculate-commit-hash
      - prepare-maestro-matrix
    outputs:
      tsio-base-config: ${{ steps.id.outputs.tsio-base-config }}
      tsio-job-configs: ${{ steps.id.outputs.tsio-job-configs }}
      tsio-job-keys: ${{ steps.id.outputs.tsio-job-keys }}
    steps:
      - name: Sparse checkout TSIO job-config helper
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.MOBILE_VERSION }}
          persist-credentials: false
          sparse-checkout: |
            detox/utils/build-tsio-job-config.js

      - id: id
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          MM_SHA: ${{ needs.calculate-commit-hash.outputs.MOBILE_SHA }}
          MOBILE_VERSION: ${{ inputs.MOBILE_VERSION }}
          CMT_MATRIX: ${{ inputs.CMT_MATRIX }}
          MAESTRO_MATRIX: ${{ needs.prepare-maestro-matrix.outputs.matrix }}
        run: |
          BRANCH=$(echo "$MOBILE_VERSION" | sed 's#^refs/heads/##; s#^refs/tags/##')
          BASE=$(jq -nc \
            --arg repo "$GITHUB_REPOSITORY" --arg sha "$MM_SHA" --arg run_id "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" --arg branch "$BRANCH" \
            '{repository:$repo, commit_sha:$sha, gh_run_id:$run_id, gh_run_attempt:$attempt, branch:$branch, name:"mobile-release", run_group:"mobile-release", framework:"detox"}')
          # No status_context — templates expand per tsio-shard-name via buildTsioJobConfig.
          TSIO_BASE=$(jq -nc --argjson identity "$BASE" \
            '{composite_identity: $identity, total_reports_expected: 1}')
          echo "tsio-base-config=$TSIO_BASE" >> "$GITHUB_OUTPUT"

          # Per-shard configs so the final rollup can poll every leg's TSIO group.
          export BASE CMT_MATRIX MAESTRO_MATRIX
          JOB_CONFIGS=$(node -e '
            const {buildTsioJobConfigMap, cmtJobKeys} = require("./detox/utils/build-tsio-job-config.js");
            const base = JSON.parse(process.env.BASE);
            const keys = cmtJobKeys(JSON.parse(process.env.CMT_MATRIX), JSON.parse(process.env.MAESTRO_MATRIX));
            process.stdout.write(JSON.stringify(buildTsioJobConfigMap(base, keys)));
          ')
          echo "tsio-job-configs=$JOB_CONFIGS" >> "$GITHUB_OUTPUT"
          JOB_KEYS=$(node -e '
            const {cmtJobKeys} = require("./detox/utils/build-tsio-job-config.js");
            process.stdout.write(JSON.stringify(cmtJobKeys(JSON.parse(process.env.CMT_MATRIX), JSON.parse(process.env.MAESTRO_MATRIX))));
          ')
          echo "tsio-job-keys=$JOB_KEYS" >> "$GITHUB_OUTPUT"

  update-initial-status:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
    needs:
      - calculate-commit-hash
      - cmt-identity
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.MOBILE_VERSION }}
          persist-credentials: false

      # Pending statuses are posted per matrix leg when each job starts; keep a
      # single umbrella pending only when MOBILE_SHA is known so the PR/commit
      # UI shows CMT is running before the first shard uploads.
      - name: Build TSIO report URL (release group prefix)
        id: tsio-url
        env:
          TSIO_BASE: ${{ needs.cmt-identity.outputs.tsio-base-config }}
        run: |
          URL=$(jq -nr --argjson cfg "$TSIO_BASE" --arg base "https://test-io.test.mattermost.com" '
            ($cfg.composite_identity) as $id
            | ($id.repository | split("/") | .[-1]) as $repo
            | ($id.branch // "main"
                | sub("^refs/heads/"; "")
                | sub("^refs/tags/"; "")
                | gsub("/"; "~")) as $branch
            | ($id.commit_sha[0:7]) as $sha
            | "\($base)/reports/\($repo|@uri)/\($branch|@uri)/\($sha)/mobile-release?gh_run_id=\($id.gh_run_id)"
          ')
          echo "target_url=$URL" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/update-commit-status
        if: ${{ needs.calculate-commit-hash.outputs.MOBILE_SHA != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          repository_full_name: ${{ github.repository }}
          commit_sha: ${{ needs.calculate-commit-hash.outputs.MOBILE_SHA }}
          context: e2e-test/compatibility-matrix-testing
          description: "Compatibility Matrix Testing for ${{ inputs.MOBILE_VERSION }} version — per-job checks also posted"
          status: pending
          target_url: ${{ steps.tsio-url.outputs.target_url }}

  # Maestro only runs against the latest server version; matrix filtering happens here since job-level if: can't access matrix.
  prepare-maestro-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - name: Filter CMT matrix to latest server only
        id: filter
        env:
          CMT_MATRIX: ${{ inputs.CMT_MATRIX }}
        run: |
          matrix=$(echo "$CMT_MATRIX" | jq -c '{server: [.server[] | select(.latest == true)]}')
          if [ "$(echo "$matrix" | jq '.server | length')" -eq 0 ]; then
            matrix=$(echo "$CMT_MATRIX" | jq -c '{server: [.server[-1]]}')
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # Provisions license, config and plugins (demo plugin on full-suite site 1 and site 2) before tests.
  # CMT previously skipped that and only used Matterwick-booted servers, so
  # interactive_dialog_plugin failed 24× with "Demo plugin is not active".
  provision-cmt-servers:
    name: Provision CMT test servers
    runs-on: ubuntu-24.04
    needs:
      - calculate-commit-hash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.MOBILE_VERSION }}
          persist-credentials: false

      - name: Collect unique matrix server URLs
        id: urls
        env:
          CMT_MATRIX: ${{ inputs.CMT_MATRIX }}
        run: |
          # Full-suite rows run the server-mutation specs, which need their own site 2; fail here, not after the builds.
          BAD_ROWS=$(echo "$CMT_MATRIX" | jq -r '
            .server[]
            | select(.latest == true)
            | . as $row
            | ["android", "ios"][]
            | select(($row[. + "_site_2_url"] // "") == "" or $row[. + "_site_2_url"] == $row[. + "_site_1_url"])
            | "\($row.version // "unknown"): \(.)_site_2_url is missing or equals \(.)_site_1_url"
          ')
          if [ -n "$BAD_ROWS" ]; then
            echo "::error::Full-suite CMT rows need a distinct site 2 URL per platform:"
            printf '%s\n' "$BAD_ROWS"
            exit 1
          fi

          # The demo plugin goes only to full-suite site 1 and site 2 URLs; a shared SITE_3 or a smoke server must not be one of them.
          DEMO_CONFLICTS=$(echo "$CMT_MATRIX" | jq -r '
            . as $m
            | ([ $m.server[] | select(.latest != true) | .android_site_1_url, .android_site_2_url, .ios_site_1_url, .ios_site_2_url, .site_3_url ]
              + [ $m.server[] | select(.latest == true) | .site_3_url ]
              | map(select(. != null and . != ""))) as $other
            | ([ $m.server[] | select(.latest == true) | .android_site_1_url, .ios_site_1_url ] | map(select(. != null and . != ""))) as $pool
            | $m.server[] | select(.latest == true) | . as $row
            | ["android", "ios"][] as $p
            | ["_site_1_url", "_site_2_url"][] as $k
            | $row[$p + $k] as $url
            | select($url != null and $url != "" and (($other | any(. == $url)) or ($k == "_site_2_url" and ($pool | any(. == $url)))))
            | "\($row.version // "unknown"): \($p)\($k) \($url) is also a pool, shared or smoke server"
          ')
          if [ -n "$DEMO_CONFLICTS" ]; then
            echo "::error::These full-suite URLs are also pool, shared or smoke servers (a site 2 must not be any pool site 1, and the demo plugin must not land on a shared or smoke server):"
            printf '%s\n' "$DEMO_CONFLICTS"
            exit 1
          fi

          URLS=$(echo "$CMT_MATRIX" | jq -r '
            .server[]
            | .android_site_1_url, .android_site_2_url, .ios_site_1_url, .ios_site_2_url, .site_3_url
            | select(. != null and . != "")
          ' | awk 'NF && !seen[$0]++')
          if [ -z "$URLS" ]; then
            echo "::error::CMT_MATRIX contained no server URLs to provision"
            exit 1
          fi
          # Only full-suite rows run the dialog specs, on pool site 1 and mutation site 2 (smoke rows use smoke_test, which has none).
          DEMO_URLS=$(echo "$CMT_MATRIX" | jq -r '
            .server[]
            | select(.latest == true)
            | .android_site_1_url, .android_site_2_url, .ios_site_1_url, .ios_site_2_url
            | select(. != null and . != "")
          ' | awk 'NF && !seen[$0]++')
          echo "Provisioning $(echo "$URLS" | wc -l | tr -d ' ') unique server(s)"
          {
            echo "list<<EOF"
            printf '%s\n' "$URLS"
            echo "EOF"
            echo "demo<<EOF"
            if [ -n "$DEMO_URLS" ]; then printf '%s\n' "$DEMO_URLS"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Provision test servers
        uses: ./.github/actions/provision-e2e-servers
        env:
          ADMIN_USERNAME: ${{ secrets.MM_MOBILE_E2E_ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.MM_MOBILE_E2E_ADMIN_PASSWORD }}
        with:
          server-urls: ${{ steps.urls.outputs.list }}
          demo-plugin-server-urls: ${{ steps.urls.outputs.demo }}

  # Input follows the below schema
  # {
  #   "server": [
  #     {
  #       "version": "9.6.1",
  #       "android_site_1_url": "https://android-1.example.test",
  #       "android_site_2_url": "https://android-2.example.test",
  #       "ios_site_1_url": "https://ios-1.example.test",
  #       "ios_site_2_url": "https://ios-2.example.test",
  #       "site_3_url": "https://shared-3.example.test"
  #     },
  #     {
  #       "version": "9.5.2",
  #       "android_site_1_url": "https://android-1-older.example.test",
  #       "android_site_2_url": "https://android-2-older.example.test",
  #       "ios_site_1_url": "https://ios-1-older.example.test",
  #       "ios_site_2_url": "https://ios-2-older.example.test",
  #       "site_3_url": "https://shared-3-older.example.test"
  #     }
  #   ]
  # }
  build-ios-simulator:
    # macos-14 predates Xcode 26 and has none pre-installed, so prepare-ios-build's
    # Xcode 26 requirement always fails here. e2e-detox-pr.yml and
    # e2e-maestro-template.yml already build on macos-26 successfully — match that.
    runs-on: macos-26
    needs:
      - update-initial-status
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ inputs.MOBILE_VERSION }}

      - name: Prepare iOS Build
        uses: ./.github/actions/prepare-ios-build

      - name: Build iOS Simulator
        env:
          TAG: "${{ inputs.MOBILE_VERSION }}"
          GITHUB_TOKEN: "${{ secrets.MM_MOBILE_GITHUB_TOKEN }}"
        run: bundle exec fastlane ios simulator --env ios.simulator
        working-directory: ./fastlane

      - name: Upload iOS Simulator Build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-build-simulator-${{ github.run_id }}
          path: Mattermost-simulator-*.app.zip

  build-android-apk:
    runs-on: ubuntu-latest-8-cores
    needs:
      - update-initial-status
    permissions:
      contents: read
      actions: write
    env:
      ORG_GRADLE_PROJECT_jvmargs: -Xmx8g
    steps:
      - name: Prune Docker to free up space
        run: docker system prune -af

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ inputs.MOBILE_VERSION }}

      - name: Prepare Android Build
        uses: ./.github/actions/prepare-android-build
        env:
          STORE_FILE: ${{ secrets.MM_MOBILE_STORE_FILE }}
          STORE_ALIAS: ${{ secrets.MM_MOBILE_STORE_ALIAS }}
          STORE_PASSWORD: ${{ secrets.MM_MOBILE_STORE_PASSWORD }}
          MATTERMOST_BUILD_GH_TOKEN: ${{ secrets.MATTERMOST_BUILD_GH_TOKEN }}

      - name: Detox build
        run: |
          cd detox
          npm ci --prefer-offline --no-audit --no-fund
          npm run e2e:android-build

      - name: Upload Android Build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-build-files-${{ github.run_id }}
          # Match e2e-detox-pr.yml's glob shape exactly: the wildcard must start
          # right after "build/" so upload-artifact only strips "android/app/build/"
          # and preserves the outputs/apk/... subtree. e2e-android-template.yml's
          # Download APK artifact step (shared by PR + CMT) expects that shape.
          path: "android/app/build/**/*"

  build-android-apk-maestro:
    runs-on: ubuntu-latest-8-cores
    needs:
      - update-initial-status
    permissions:
      contents: read
      actions: write
    env:
      ORG_GRADLE_PROJECT_jvmargs: -Xmx8g
    steps:
      - name: Prune Docker to free up space
        run: docker system prune -af

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ inputs.MOBILE_VERSION }}

      - name: Prepare Android Build
        uses: ./.github/actions/prepare-android-build
        env:
          STORE_FILE: ${{ secrets.MM_MOBILE_STORE_FILE }}
          STORE_ALIAS: ${{ secrets.MM_MOBILE_STORE_ALIAS }}
          STORE_PASSWORD: ${{ secrets.MM_MOBILE_STORE_PASSWORD }}
          MATTERMOST_BUILD_GH_TOKEN: ${{ secrets.MATTERMOST_BUILD_GH_TOKEN }}

      - name: Build Maestro Android APK
        uses: ./.github/actions/build-android-maestro-apk

      - name: Upload Maestro Android Build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-maestro-build-files-${{ github.run_id }}
          path: android/app/build/outputs/apk/release/

  # latest entry runs full suite, older entries run smoke only. Job-level if: can't conditionally skip matrix legs, so inputs vary instead.
  detox-e2e:
    name: mobile-cmt-ios${{ matrix.server.latest && '-full' || '-smoke' }}-${{ matrix.server.version }}
    permissions:
      contents: read
      # nested template mints an OIDC token for the TSIO upload.
      id-token: write
      actions: read
      statuses: write
      # Nested template finalize reads PR labels to honour E2E/Override; a
      # reusable workflow cannot escalate past the caller, so grant it here too.
      issues: read
    uses: ./.github/workflows/e2e-ios-template.yml
    needs:
      - build-ios-simulator
      - cmt-identity
      - provision-cmt-servers
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.CMT_MATRIX) }}
    secrets:
      MM_MOBILE_E2E_ADMIN_EMAIL: ${{ secrets.MM_MOBILE_E2E_ADMIN_EMAIL }}
      MM_MOBILE_E2E_ADMIN_USERNAME: ${{ secrets.MM_MOBILE_E2E_ADMIN_USERNAME }}
      MM_MOBILE_E2E_ADMIN_PASSWORD: ${{ secrets.MM_MOBILE_E2E_ADMIN_PASSWORD }}
      MM_MOBILE_E2E_ZEPHYR_API_KEY: ${{ secrets.MM_MOBILE_E2E_ZEPHYR_API_KEY }}
      MM_MOBILE_E2E_TEST_CYCLE_LINK_PREFIX: ${{ secrets.MM_MOBILE_E2E_TEST_CYCLE_LINK_PREFIX }}
      MM_MOBILE_E2E_WEBHOOK_URL: ${{ secrets.MM_MOBILE_E2E_WEBHOOK_URL }}
      MM_E2E_MASTER_HEALTH_WEBHOOK_URL: ${{ secrets.MM_E2E_MASTER_HEALTH_WEBHOOK_URL }}
      MM_E2E_RELEASE_WEBHOOK_URL: ${{ secrets.MM_E2E_RELEASE_WEBHOOK_URL }}
      MM_MOBILE_DETOX_AWS_ACCESS_KEY_ID: ${{ secrets.MM_MOBILE_DETOX_AWS_ACCESS_KEY_ID }}
      MM_MOBILE_DETOX_AWS_SECRET_ACCESS_KEY: ${{ secrets.MM_MOBILE_DETOX_AWS_SECRET_ACCESS_KEY }}
      MM_MOBILE_E2E_WEBHOOK_PUBLIC_BASE_URL: ${{ secrets.MM_MOBILE_E2E_WEBHOOK_PUBLIC_BASE_URL }}
      MM_MOBILE_E2E_CLOUDFLARED_TUNNEL_TOKEN: ${{ secrets.MM_MOBILE_E2E_CLOUDFLARED_TUNNEL_TOKEN }}
    with:
      tsio-config: ${{ needs.cmt-identity.outputs.tsio-base-config }}
      tsio-shard-name: detox-ios-Server_${{ matrix.server.version }}
      run-type: "RELEASE"
      MM_OTHER_PLATFORM_POOL_URL: ${{ matrix.server.android_site_1_url }}
      MM_TEST_SERVER_URL: ${{ matrix.server.ios_site_1_url }}
      MM_TEST_SERVER_URL_2: ${{ matrix.server.ios_site_2_url }}
      MM_TEST_SERVER_URL_3: ${{ matrix.server.site_3_url }}
      MOBILE_VERSION: ${{ inputs.MOBILE_VERSION }}
      search_path: ${{ matrix.server.latest && 'detox/e2e/test' || 'detox/e2e/test/products/channels/smoke_test' }}
      # Full suite matches the PR/main shard count (template default 32); smoke stays single-shard.
      parallelism: ${{ matrix.server.latest && '32' || '1' }}
      artifact_run_id: ${{ github.run_id }}

  detox-ipad-e2e:
    name: mobile-cmt-ipad-${{ matrix.server.version }}
    permissions:
      contents: read
      id-token: write
      actions: read
      statuses: write
      # Nested template finalize reads PR labels to honour E2E/Override; a
      # reusable workflow cannot escalate past the caller, so grant it here too.
      issues: read
    uses: ./.github/workflows/e2e-ios-template.yml
    needs:
      - build-ios-simulator
      - cmt-identity
      - provision-cmt-servers
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.CMT_MATRIX) }}
    secrets:
      MM_MOBILE_E2E_ADMIN_EMAIL: ${{ secrets.MM_MOBILE_E2E_ADMIN_EMAIL }}
      MM_MOBILE_E2E_ADMIN_USERNAME: ${{ secrets.MM_MOBILE_E2E_ADMIN_USERNAME }}
      MM_MOBILE_E2E_ADMIN_PASSWORD: ${{ secrets.MM_MOBILE_E2E_ADMIN_PASSWORD }}
      MM_MOBILE_E2E_ZEPHYR_API_KEY: ${{ secrets.MM_MOBILE_E2E_ZEPHYR_API_KEY }}
      MM_MOBILE_E2E_TEST_CYCLE_LINK_PREFIX: ${{ secrets.MM_MOBILE_E2E_TEST_CYCLE_LINK_PREFIX }}
      MM_MOBILE_E2E_WEBHOOK_URL: ${{ secrets.MM_MOBILE_E2E_WEBHOOK_URL }}
      MM_E2E_MASTER_HEALTH_WEBHOOK_URL: ${{ secrets.MM_E2E_MASTER_HEALTH_WEBHOOK_URL }}
      MM_E2E_RELEASE_WEBHOOK_URL: ${{ secrets.MM_E2E_RELEASE_WEBHOOK_URL }}
      MM_MOBILE_DETOX_AWS_ACCESS_KEY_ID: ${{ secrets.MM_MOBILE_DETOX_AWS_ACCESS_KEY_ID }}
      MM_MOBILE_DETOX_AWS_SECRET_ACCESS_KEY: ${{ secrets.MM_MOBILE_DETOX_AWS_SECRET_ACCESS_KEY }}
      MM_MOBILE_E2E_WEBHOOK_PUBLIC_BASE_URL: ${{ secrets.MM_MOBILE_E2E_WEBHOOK_PUBLIC_BASE_URL }}
      MM_MOBILE_E2E_CLOUDFLARED_TUNNEL_TOKEN: ${{ secrets.MM_MOBILE_E2E_CLOUDFLARED_TUNNEL_TOKEN }}
    with:
      tsio-config: ${{ needs.cmt-identity.outputs.tsio-base-config }}
      tsio-shard-name: detox-ipad-Server_${{ matrix.server.version }}
      run-type: "RELEASE"
      MM_OTHER_PLATFORM_POOL_URL: ${{ matrix.server.android_site_1_url }}
      MM_TEST_SERVER_URL: ${{ matrix.server.ios_site_1_url }}
      MM_TEST_SERVER_URL_2: ${{ matrix.server.ios_site_2_url }}
      MM_TEST_SERVER_URL_3: ${{ matrix.server.site_3_url }}
      MOBILE_VERSION: ${{ inputs.MOBILE_VERSION }}
      ios_device_name: "iPad Pro 13-inch (M5)"
      ios_device_os_name: "iOS 26.2"
      search_path: "detox/e2e/test/products/channels/ipad"
      parallelism: "1"
      detox_config: "ios.ipad.debug"
      artifact_run_id: ${{ github.run_id }}

  # Maestro runs only against the latest server version (no smoke-on-older variant).
  maestro-ios-e2e:
    name: mobile-cmt-maestro-ios-${{ matrix.server.version }}
    permissions:
      contents: read
      id-token: write
      actions: read
      statuses: write
      # Nested template finalize reads PR labels to honour E2E/Override; a
      # reusable workflow cannot escalate past the caller, so grant it here too.
      issues: read
    uses: ./.github/workflows/e2e-maestro-template.yml
    needs:
      - build-ios-simulator
      - prepare-maestro-matrix
      - cmt-identity
      - provision-cmt-servers
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-maestro-matrix.outputs.matrix) }}
    secrets:
      MM_MOBILE_E2E_ADMIN_EMAIL: ${{ secrets.MM_MOBILE_E2E_ADMIN_EMAIL }}
      MM_MOBILE_E2E_ADMIN_USERNAME: ${{ secrets.MM_MOBILE_E2E_ADMIN_USERNAME }}
      MM_MOBILE_E2E_ADMIN_PASSWORD: ${{ secrets.MM_MOBILE_E2E_ADMIN_PASSWORD }}
      MM_MOBILE_E2E_ZEPHYR_API_KEY: ${{ secrets.MM_MOBILE_E2E_ZEPHYR_API_KEY }}
      MM_MOBILE_DETOX_AWS_ACCESS_KEY_ID: ${{ secrets.MM_MOBILE_DETOX_AWS_ACCESS_KEY_ID }}
      MM_MOBILE_DETOX_AWS_SECRET_ACCESS_KEY: ${{ secrets.MM_MOBILE_DETOX_AWS_SECRET_ACCESS_KEY }}
      MM_MOBILE_E2E_WEBHOOK_URL: ${{ secrets.MM_MOBILE_E2E_WEBHOOK_URL }}
      MM_E2E_MASTER_HEALTH_WEBHOOK_URL: ${{ secrets.MM_E2E_MASTER_HEALTH_WEBHOOK_URL }}
      MM_E2E_RELEASE_WEBHOOK_URL: ${{ secrets.MM_E2E_RELEASE_WEBHOOK_URL }}
    with:
      tsio-config: ${{ needs.cmt-identity.outputs.tsio-base-config }}
      tsio-shard-name: maestro-ios-Server_${{ matrix.server.version }}
      platform: ios
      run-type: "RELEASE"
      MM_TEST_SERVER_URL: ${{ matrix.server.ios_site_1_url }}
      MOBILE_VERSION: ${{ inputs.MOBILE_VERSION }}
      record_tests_in_zephyr: true
      artifact_run_id: ${{ github.run_id }}

  detox-android-e2e:
    name: mobile-cmt-android${{ matrix.server.latest && '-full' || '-smoke' }}-${{ matrix.server.version }}
    permissions:
      contents: read
      id-token: write
      actions: read
      statuses: write
      # Nested template finalize reads PR labels to honour E2E/Override; a
      # reusable workflow cannot escalate past the caller, so grant it here too.
      issues: read
    uses: ./.github/workflows/e2e-android-template.yml
    needs:
      - build-android-apk
      - cmt-identity
      - provision-cmt-servers
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.CMT_MATRIX) }}
    secrets:
      MM_MOBILE_E2E_ADMIN_EMAIL: ${{ secrets.MM_MOBILE_E2E_ADMIN_EMAIL }}
      MM_MOBILE_E2E_ADMIN_USERNAME: ${{ secrets.MM_MOBILE_E2E_ADMIN_USERNAME }}
      MM_MOBILE_E2E_ADMIN_PASSWORD: ${{ secrets.MM_MOBILE_E2E_ADMIN_PASSWORD }}
      MM_MOBILE_E2E_ZEPHYR_API_KEY: ${{ secrets.MM_MOBILE_E2E_ZEPHYR_API_KEY }}
      MM_MOBILE_E2E_TEST_CYCLE_LINK_PREFIX: ${{ secrets.MM_MOBILE_E2E_TEST_CYCLE_LINK_PREFIX }}
      MM_MOBILE_E2E_WEBHOOK_URL: ${{ secrets.MM_MOBILE_E2E_WEBHOOK_URL }}
      MM_E2E_MASTER_HEALTH_WEBHOOK_URL: ${{ secrets.MM_E2E_MASTER_HEALTH_WEBHOOK_URL }}
      MM_E2E_RELEASE_WEBHOOK_URL: ${{ secrets.MM_E2E_RELEASE_WEBHOOK_URL }}
      MM_MOBILE_DETOX_AWS_ACCESS_KEY_ID: ${{ secrets.MM_MOBILE_DETOX_AWS_ACCESS_KEY_ID }}
      MM_MOBILE_DETOX_AWS_SECRET_ACCESS_KEY: ${{ secrets.MM_MOBILE_DETOX_AWS_SECRET_ACCESS_KEY }}
      MM_MOBILE_E2E_WEBHOOK_PUBLIC_BASE_URL: ${{ secrets.MM_MOBILE_E2E_WEBHOOK_PUBLIC_BASE_URL }}
      MM_MOBILE_E2E_CLOUDFLARED_TUNNEL_TOKEN: ${{ secrets.MM_MOBILE_E2E_CLOUDFLARED_TUNNEL_TOKEN }}
    with:
      tsio-config: ${{ needs.cmt-identity.outputs.tsio-base-config }}
      tsio-shard-name: detox-android-Server_${{ matrix.server.version }}
      run-android-tests: true
      run-type: "RELEASE"
      MM_OTHER_PLATFORM_POOL_URL: ${{ matrix.server.ios_site_1_url }}
      MM_TEST_SERVER_URL: ${{ matrix.server.android_site_1_url }}
      MM_TEST_SERVER_URL_2: ${{ matrix.server.android_site_2_url }}
      MM_TEST_SERVER_URL_3: ${{ matrix.server.site_3_url }}
      MOBILE_VERSION: ${{ inputs.MOBILE_VERSION }}
      search_path: ${{ matrix.server.latest && 'detox/e2e/test' || 'detox/e2e/test/products/channels/smoke_test' }}
      # Full suite matches the PR/main shard count (template default 32); smoke stays single-shard.
      parallelism: ${{ matrix.server.latest && '32' || '1' }}
      artifact_run_id: ${{ github.run_id }}

  # Maestro runs only against the latest server version (no smoke-on-older variant).
  maestro-android-e2e:
    name: mobile-cmt-maestro-android-${{ matrix.server.version }}
    permissions:
      contents: read
      id-token: write
      actions: read
      statuses: write
      # Nested template finalize reads PR labels to honour E2E/Override; a
      # reusable workflow cannot escalate past the caller, so grant it here too.
      issues: read
    uses: ./.github/workflows/e2e-maestro-template.yml
    needs:
      - build-android-apk-maestro
      - prepare-maestro-matrix
      - cmt-identity
      - provision-cmt-servers
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-maestro-matrix.outputs.matrix) }}
    secrets:
      MM_MOBILE_E2E_ADMIN_EMAIL: ${{ secrets.MM_MOBILE_E2E_ADMIN_EMAIL }}
      MM_MOBILE_E2E_ADMIN_USERNAME: ${{ secrets.MM_MOBILE_E2E_ADMIN_USERNAME }}
      MM_MOBILE_E2E_ADMIN_PASSWORD: ${{ secrets.MM_MOBILE_E2E_ADMIN_PASSWORD }}
      MM_MOBILE_E2E_ZEPHYR_API_KEY: ${{ secrets.MM_MOBILE_E2E_ZEPHYR_API_KEY }}
      MM_MOBILE_DETOX_AWS_ACCESS_KEY_ID: ${{ secrets.MM_MOBILE_DETOX_AWS_ACCESS_KEY_ID }}
      MM_MOBILE_DETOX_AWS_SECRET_ACCESS_KEY: ${{ secrets.MM_MOBILE_DETOX_AWS_SECRET_ACCESS_KEY }}
      MM_MOBILE_E2E_WEBHOOK_URL: ${{ secrets.MM_MOBILE_E2E_WEBHOOK_URL }}
      MM_E2E_MASTER_HEALTH_WEBHOOK_URL: ${{ secrets.MM_E2E_MASTER_HEALTH_WEBHOOK_URL }}
      MM_E2E_RELEASE_WEBHOOK_URL: ${{ secrets.MM_E2E_RELEASE_WEBHOOK_URL }}
    with:
      tsio-config: ${{ needs.cmt-identity.outputs.tsio-base-config }}
      tsio-shard-name: maestro-android-Server_${{ matrix.server.version }}
      platform: android
      run-type: "RELEASE"
      MM_TEST_SERVER_URL: ${{ matrix.server.android_site_1_url }}
      MOBILE_VERSION: ${{ inputs.MOBILE_VERSION }}
      artifact_run_id: ${{ github.run_id }}
      record_tests_in_zephyr: true

  update-final-status:
    runs-on: ubuntu-24.04
    if: always()
    permissions:
      contents: read
      statuses: write
      actions: read
    outputs:
      upstream-succeeded: ${{ steps.final.outputs.upstream-succeeded }}
    needs:
      - calculate-commit-hash
      - cmt-identity
      - plan-cmt-triage
      - prepare-maestro-matrix
      - provision-cmt-servers
      - build-ios-simulator
      - build-android-apk
      - build-android-apk-maestro
      - detox-e2e
      - detox-ipad-e2e
      - detox-android-e2e
      - maestro-ios-e2e
      - maestro-android-e2e
      - tsio-triage
      - plan-rerun-cmt
      - rerun-detox-e2e
      - rerun-detox-ipad-e2e
      - rerun-detox-android-e2e
      - rerun-maestro-ios-e2e
      - rerun-maestro-android-e2e
    steps:
      # Always check out finalizer scripts from the workflow dispatch ref (main), never old release tags.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          sparse-checkout: |
            detox/utils/cmt-final-status.js
            detox/utils/tsio-channel-notify-rollup.js
            detox/utils/tsio-report-status.js
            detox/utils/cmt-channel-notify.js
            detox/utils/build-tsio-job-config.js
            detox/utils/cli-args.js
            detox/utils/rerun-failed.js
          sparse-checkout-cone-mode: false

      - name: Download triage findings
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: e2e-triage-findings-*-a${{ github.run_attempt }}
          path: triage-findings

      - name: Download re-run results
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: e2e-rerun-results-*-a${{ github.run_attempt }}
          path: rerun-results

      # download-artifact extracts a single match straight into the path, without the artifact-named folder.
      - name: Keep a single result in its artifact folder
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          file=""
          for f in rerun-results/jest-results-merged.json rerun-results/maestro-report.xml; do
            if [ -f "$f" ]; then
              file="$f"
              break
            fi
          done
          if [ -z "$file" ]; then
            exit 0
          fi
          name=$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" --paginate \
            --jq '.artifacts[] | select(.expired | not) | .name' \
            | grep -E "^e2e-rerun-results-.+-a${RUN_ATTEMPT}$" || true)
          count=$(printf '%s\n' "$name" | grep -c . || true)
          if [ "$count" != "1" ]; then
            echo "::warning::A single result was downloaded but $count rerun artifacts are listed; leaving it unread"
            exit 0
          fi
          mkdir -p "rerun-results/$name"
          mv "$file" "rerun-results/$name/"

      - name: Evaluate final CMT outcome
        id: final
        env:
          JOB_KEYS: ${{ needs.plan-cmt-triage.outputs.failing-job-keys || '[]' }}
          TRIAGE_FINDINGS_DIR: triage-findings
          RERUN_RESULTS_DIR: rerun-results
          R_CALC_HASH: ${{ needs.calculate-commit-hash.result }}
          R_CMT_IDENTITY: ${{ needs.cmt-identity.result }}
          R_PREPARE_MAESTRO: ${{ needs.prepare-maestro-matrix.result }}
          R_PROVISION: ${{ needs.provision-cmt-servers.result }}
          R_BUILD_IOS: ${{ needs.build-ios-simulator.result }}
          R_BUILD_ANDROID_DETOX: ${{ needs.build-android-apk.result }}
          R_BUILD_ANDROID_MAESTRO: ${{ needs.build-android-apk-maestro.result }}
          R_DETOX_IOS: ${{ needs.detox-e2e.result }}
          R_DETOX_IPAD: ${{ needs.detox-ipad-e2e.result }}
          R_DETOX_ANDROID: ${{ needs.detox-android-e2e.result }}
          R_MAESTRO_IOS: ${{ needs.maestro-ios-e2e.result }}
          R_MAESTRO_ANDROID: ${{ needs.maestro-android-e2e.result }}
          R_TSIO_TRIAGE: ${{ needs.tsio-triage.result }}
          R_PLAN_RERUN: ${{ needs.plan-rerun-cmt.result }}
          R_RERUN_DETOX_IOS: ${{ needs.rerun-detox-e2e.result }}
          R_RERUN_DETOX_IPAD: ${{ needs.rerun-detox-ipad-e2e.result }}
          R_RERUN_DETOX_ANDROID: ${{ needs.rerun-detox-android-e2e.result }}
          R_RERUN_MAESTRO_IOS: ${{ needs.rerun-maestro-ios-e2e.result }}
          R_RERUN_MAESTRO_ANDROID: ${{ needs.rerun-maestro-android-e2e.result }}
        run: |
          JOB_RESULTS_JSON=$(jq -nc \
            --arg calculateCommitHash "$R_CALC_HASH" \
            --arg cmtIdentity "$R_CMT_IDENTITY" \
            --arg prepareMaestro "$R_PREPARE_MAESTRO" \
            --arg provision "$R_PROVISION" \
            --arg buildIos "$R_BUILD_IOS" \
            --arg buildAndroidDetox "$R_BUILD_ANDROID_DETOX" \
            --arg buildAndroidMaestro "$R_BUILD_ANDROID_MAESTRO" \
            --arg detoxIos "$R_DETOX_IOS" \
            --arg detoxIpad "$R_DETOX_IPAD" \
            --arg detoxAndroid "$R_DETOX_ANDROID" \
            --arg maestroIos "$R_MAESTRO_IOS" \
            --arg maestroAndroid "$R_MAESTRO_ANDROID" \
            --arg tsioTriage "$R_TSIO_TRIAGE" \
            --arg planRerun "$R_PLAN_RERUN" \
            --arg rerunDetoxIos "$R_RERUN_DETOX_IOS" \
            --arg rerunDetoxIpad "$R_RERUN_DETOX_IPAD" \
            --arg rerunDetoxAndroid "$R_RERUN_DETOX_ANDROID" \
            --arg rerunMaestroIos "$R_RERUN_MAESTRO_IOS" \
            --arg rerunMaestroAndroid "$R_RERUN_MAESTRO_ANDROID" \
            '{
              calculateCommitHash: $calculateCommitHash,
              cmtIdentity: $cmtIdentity,
              prepareMaestro: $prepareMaestro,
              provision: $provision,
              buildIos: $buildIos,
              buildAndroidDetox: $buildAndroidDetox,
              buildAndroidMaestro: $buildAndroidMaestro,
              detoxIos: $detoxIos,
              detoxIpad: $detoxIpad,
              detoxAndroid: $detoxAndroid,
              maestroIos: $maestroIos,
              maestroAndroid: $maestroAndroid,
              tsioTriage: $tsioTriage,
              planRerun: $planRerun,
              rerunDetoxIos: $rerunDetoxIos,
              rerunDetoxIpad: $rerunDetoxIpad,
              rerunDetoxAndroid: $rerunDetoxAndroid,
              rerunMaestroIos: $rerunMaestroIos,
              rerunMaestroAndroid: $rerunMaestroAndroid
            }')
          export JOB_RESULTS_JSON
          node detox/utils/cmt-final-status.js

      # Umbrella context only — each matrix leg already posted <shard> from TSIO.
      - name: Finalize umbrella CMT commit status from triage and CI job results
        if: always() && !cancelled() && needs.calculate-commit-hash.outputs.MOBILE_SHA != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ needs.calculate-commit-hash.outputs.MOBILE_SHA }}
          REPO: ${{ github.repository }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FINAL_OUTCOME: ${{ steps.final.outcome }}
          STATE: ${{ steps.final.outputs.state }}
          DESC: ${{ steps.final.outputs.description }}
        run: |
          if [ "$FINAL_OUTCOME" != "success" ] || [ -z "$STATE" ] || [ -z "$DESC" ]; then
            STATE="failure"
            DESC="Compatibility Matrix Testing failed — final status evaluation failed"
          fi
          gh api --method POST "repos/${REPO}/statuses/${COMMIT_SHA}" \
            -f state="$STATE" \
            -f context="e2e-test/compatibility-matrix-testing" \
            -f description="$DESC" \
            -f target_url="$TARGET_URL"

      - name: Finalize umbrella CMT commit status on cancellation
        if: cancelled() && needs.calculate-commit-hash.outputs.MOBILE_SHA != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ needs.calculate-commit-hash.outputs.MOBILE_SHA }}
          REPO: ${{ github.repository }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/${REPO}/statuses/${COMMIT_SHA}" \
            -f state="error" \
            -f context="e2e-test/compatibility-matrix-testing" \
            -f description="Compatibility Matrix Testing cancelled before completion" \
            -f target_url="$TARGET_URL"

      - name: Consolidate CMT triage summary
        if: always() && !cancelled() && needs.tsio-triage.result != 'skipped'
        uses: mattermost/mattermost-test-automation-toolkit/actions/e2e-test-triage/consolidate@main
        with:
          findings-dir: triage-findings
          summary-file: cmt-triage-summary.json
          write-summary: "true"

      - name: Upload consolidated CMT triage summary
        if: always() && hashFiles('cmt-triage-summary.json') != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmt-triage-summary-a${{ github.run_attempt }}
          path: cmt-triage-summary.json
          retention-days: 7


  # Per-shard TSIO groups are finalized in each matrix leg, which leaves channel
  # notify off so N legs do not spam. This job polls every shard group and posts
  # one summary — same path as PR/main. After triage, so the message carries its
  # verdict on each failed test.
  # Re-run, on fresh devices, the failed specs triage could not clear, against the same server version, so the
  # channel message can say for certain whether each is a product bug (see e2e-detox-pr.yml plan-rerun).
  plan-rerun-cmt:
    name: Plan re-run of failed specs
    runs-on: ubuntu-24.04
    if: '!cancelled() && needs.tsio-triage.result != ''skipped'''
    needs:
      - calculate-commit-hash
      - tsio-triage
    permissions:
      contents: read
    outputs:
      detox-ios-matrix: ${{ steps.plan.outputs.detox-ios-matrix }}
      detox-android-matrix: ${{ steps.plan.outputs.detox-android-matrix }}
      detox-ipad-matrix: ${{ steps.plan.outputs.detox-ipad-matrix }}
      maestro-ios-matrix: ${{ steps.plan.outputs.maestro-ios-matrix }}
      maestro-android-matrix: ${{ steps.plan.outputs.maestro-android-matrix }}
      stale: ${{ steps.plan.outputs.stale }}
    steps:
      # Always check out rerun/reporting helpers from the workflow dispatch ref (main), never old release tags.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          sparse-checkout: |
            detox/utils/rerun-failed.js
            detox/utils/tsio-channel-notify-rollup.js
            detox/utils/tsio-report-status.js
            detox/utils/cmt-channel-notify.js
            detox/utils/build-tsio-job-config.js
            detox/utils/cli-args.js
      - name: Download triage findings
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: e2e-triage-findings-*-a${{ github.run_attempt }}
          path: triage-findings
      # A spec that differs from main's is out of date on this release branch: it is not re-run on the old build.
      - name: Fetch main and target release commit to compare specs
        id: refs
        continue-on-error: true
        env:
          MOBILE_SHA: ${{ needs.calculate-commit-hash.outputs.MOBILE_SHA }}
        run: |
          [ -n "$MOBILE_SHA" ] || exit 0
          git fetch --no-tags --depth=1 origin main
          MAIN_SHA=$(git rev-parse FETCH_HEAD)
          git fetch --no-tags --depth=1 origin "$MOBILE_SHA"
          TARGET_SHA=$(git rev-parse FETCH_HEAD)
          echo "main_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
      - name: Plan the re-run
        id: plan
        env:
          CMT_MATRIX: ${{ inputs.CMT_MATRIX }}
          MAIN_SHA: ${{ steps.refs.outputs.main_sha }}
          TARGET_SHA: ${{ steps.refs.outputs.target_sha }}
        run: |
          ARGS=(--findings-dir triage-findings --cmt-matrix "$CMT_MATRIX")
          if [ -n "$MAIN_SHA" ] && [ -n "$TARGET_SHA" ]; then
            ARGS+=(--compare-ref "$MAIN_SHA" --target-ref "$TARGET_SHA")
          fi
          node detox/utils/rerun-failed.js "${ARGS[@]}"

  rerun-detox-e2e:
    name: rerun-mobile-cmt-ios${{ matrix.server.latest && '-full' || '-smoke' }}-${{ matrix.server.version }}
    # !cancelled(): a lane failed upstream (that is why there is a re-run), which would skip this job otherwise.
    if: >-
      !cancelled() &&
      needs.plan-rerun-cmt.result == 'success' &&
      needs.build-ios-simulator.result == 'success' &&
      needs.provision-cmt-servers.result == 'success' &&
      fromJson(needs.plan-rerun-cmt.outputs.detox-ios-matrix).server[0] != null
    permissions:
      contents: read
      # nested template mints an OIDC token for the TSIO upload.
      id-token: write
      actions: read
      statuses: write
      # Nested template finalize reads PR labels to honour E2E/Override; a
      # reusable workflow cannot escalate past the caller, so grant it here too.
      issues: read
    uses: ./.github/workflows/e2e-ios-template.yml
    needs:
      - plan-rerun-cmt
      - build-ios-simulator
      - cmt-identity
      - provision-cmt-servers
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-rerun-cmt.outputs.detox-ios-matrix) }}
    secrets:
      MM_MOBILE_E2E_ADMIN_EMAIL: ${{ secrets.MM_MOBILE_E2E_ADMIN_EMAIL }}
      MM_MOBILE_E2E_ADMIN_USERNAME: ${{ secrets.MM_MOBILE_E2E_ADMIN_USERNAME }}
      MM_MOBILE_E2E_ADMIN_PASSWORD: ${{ secrets.MM_MOBILE_E2E_ADMIN_PASSWORD }}
      MM_MOBILE_E2E_ZEPHYR_API_KEY: ${{ secrets.MM_MOBILE_E2E_ZEPHYR_API_KEY }}
      MM_MOBILE_E2E_TEST_CYCLE_LINK_PREFIX: ${{ secrets.MM_MOBILE_E2E_TEST_CYCLE_LINK_PREFIX }}
      MM_MOBILE_E2E_WEBHOOK_URL: ${{ secrets.MM_MOBILE_E2E_WEBHOOK_URL }}
      MM_E2E_MASTER_HEALTH_WEBHOOK_URL: ${{ secrets.MM_E2E_MASTER_HEALTH_WEBHOOK_URL }}
      MM_E2E_RELEASE_WEBHOOK_URL: ${{ secrets.MM_E2E_RELEASE_WEBHOOK_URL }}
      MM_MOBILE_DETOX_AWS_ACCESS_KEY_ID: ${{ secrets.MM_MOBILE_DETOX_AWS_ACCESS_KEY_ID }}
      MM_MOBILE_DETOX_AWS_SECRET_ACCESS_KEY: ${{ secrets.MM_MOBILE_DETOX_AWS_SECRET_ACCESS_KEY }}
      MM_MOBILE_E2E_WEBHOOK_PUBLIC_BASE_URL: ${{ secrets.MM_MOBILE_E2E_WEBHOOK_PUBLIC_BASE_URL }}
      MM_MOBILE_E2E_CLOUDFLARED_TUNNEL_TOKEN: ${{ secrets.MM_MOBILE_E2E_CLOUDFLARED_TUNNEL_TOKEN }}
    with:
      tsio-config: ''
      tsio-shard-name: ''
      run-type: "NONE"
      MM_OTHER_PLATFORM_POOL_URL: ${{ matrix.server.android_site_1_url }}
      MM_TEST_SERVER_URL: ${{ matrix.server.ios_site_1_url }}
      MM_TEST_SERVER_URL_2: ${{ matrix.server.ios_site_2_url }}
      MM_TEST_SERVER_URL_3: ${{ matrix.server.site_3_url }}
      MOBILE_VERSION: ${{ inputs.MOBILE_VERSION }}
      search_path: ${{ matrix.server.latest && 'detox/e2e/test' || 'detox/e2e/test/products/channels/smoke_test' }}
      # Full suite matches the PR/main shard count (template default 32); smoke stays single-shard.
      parallelism: '1'
      artifact_run_id: ${{ github.run_id }}
      spec_files: ${{ matrix.server.specs }}
      results-artifact: ${{ format('e2e-rerun-results-detox-ios-Server_{0}-a{1}', matrix.server.version, github.run_attempt) }}

  rerun-detox-ipad-e2e:
    name: rerun-mobile-cmt-ipad-${{ matrix.server.version }}
    # !cancelled(): a lane failed upstream (that is why there is a re-run), which would skip this job otherwise.
    if: >-
      !cancelled() &&
      needs.plan-rerun-cmt.result == 'success' &&
      needs.build-ios-simulator.result == 'success' &&
      needs.provision-cmt-servers.result == 'success' &&
      fromJson(needs.plan-rerun-cmt.outputs.detox-ipad-matrix).server[0] != null
    permissions:
      contents: read
      id-token: write
      actions: read
      statuses: write
      # Nested template finalize reads PR labels to honour E2E/Override; a
      # reusable workflow cannot escalate past the caller, so grant it here too.
      issues: read
    uses: ./.github/workflows/e2e-ios-template.yml
    needs:
      - plan-rerun-cmt
      - build-ios-simulator
      - cmt-identity
      - provision-cmt-servers
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-rerun-cmt.outputs.detox-ipad-matrix) }}
    secrets:
      MM_MOBILE_E2E_ADMIN_EMAIL: ${{ secrets.MM_MOBILE_E2E_ADMIN_EMAIL }}
      MM_MOBILE_E2E_ADMIN_USERNAME: ${{ secrets.MM_MOBILE_E2E_ADMIN_USERNAME }}
      MM_MOBILE_E2E_ADMIN_PASSWORD: ${{ secrets.MM_MOBILE_E2E_ADMIN_PASSWORD }}
      MM_MOBILE_E2E_ZEPHYR_API_KEY: ${{ secrets.MM_MOBILE_E2E_ZEPHYR_API_KEY }}
      MM_MOBILE_E2E_TEST_CYCLE_LINK_PREFIX: ${{ secrets.MM_MOBILE_E2E_TEST_CYCLE_LINK_PREFIX }}
      MM_MOBILE_E2E_WEBHOOK_URL: ${{ secrets.MM_MOBILE_E2E_WEBHOOK_URL }}
      MM_E2E_MASTER_HEALTH_WEBHOOK_URL: ${{ secrets.MM_E2E_MASTER_HEALTH_WEBHOOK_URL }}
      MM_E2E_RELEASE_WEBHOOK_URL: ${{ secrets.MM_E2E_RELEASE_WEBHOOK_URL }}
      MM_MOBILE_DETOX_AWS_ACCESS_KEY_ID: ${{ secrets.MM_MOBILE_DETOX_AWS_ACCESS_KEY_ID }}
      MM_MOBILE_DETOX_AWS_SECRET_ACCESS_KEY: ${{ secrets.MM_MOBILE_DETOX_AWS_SECRET_ACCESS_KEY }}
      MM_MOBILE_E2E_WEBHOOK_PUBLIC_BASE_URL: ${{ secrets.MM_MOBILE_E2E_WEBHOOK_PUBLIC_BASE_URL }}
      MM_MOBILE_E2E_CLOUDFLARED_TUNNEL_TOKEN: ${{ secrets.MM_MOBILE_E2E_CLOUDFLARED_TUNNEL_TOKEN }}
    with:
      tsio-config: ''
      tsio-shard-name: ''
      run-type: "NONE"
      MM_OTHER_PLATFORM_POOL_URL: ${{ matrix.server.android_site_1_url }}
      MM_TEST_SERVER_URL: ${{ matrix.server.ios_site_1_url }}
      MM_TEST_SERVER_URL_2: ${{ matrix.server.ios_site_2_url }}
      MM_TEST_SERVER_URL_3: ${{ matrix.server.site_3_url }}
      MOBILE_VERSION: ${{ inputs.MOBILE_VERSION }}
      ios_device_name: "iPad Pro 13-inch (M5)"
      ios_device_os_name: "iOS 26.2"
      search_path: "detox/e2e/test/products/channels/ipad"
      parallelism: '1'
      detox_config: "ios.ipad.debug"
      artifact_run_id: ${{ github.run_id }}
      spec_files: ${{ matrix.server.specs }}
      results-artifact: ${{ format('e2e-rerun-results-detox-ipad-Server_{0}-a{1}', matrix.server.version, github.run_attempt) }}

  # Maestro runs only against the latest server version (no smoke-on-older variant).

  rerun-detox-android-e2e:
    name: rerun-mobile-cmt-android${{ matrix.server.latest && '-full' || '-smoke' }}-${{ matrix.server.version }}
    # !cancelled(): a lane failed upstream (that is why there is a re-run), which would skip this job otherwise.
    if: >-
      !cancelled() &&
      needs.plan-rerun-cmt.result == 'success' &&
      needs.build-android-apk.result == 'success' &&
      needs.provision-cmt-servers.result == 'success' &&
      fromJson(needs.plan-rerun-cmt.outputs.detox-android-matrix).server[0] != null
    permissions:
      contents: read
      id-token: write
      actions: read
      statuses: write
      # Nested template finalize reads PR labels to honour E2E/Override; a
      # reusable workflow cannot escalate past the caller, so grant it here too.
      issues: read
    uses: ./.github/workflows/e2e-android-template.yml
    needs:
      - plan-rerun-cmt
      - build-android-apk
      - cmt-identity
      - provision-cmt-servers
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-rerun-cmt.outputs.detox-android-matrix) }}
    secrets:
      MM_MOBILE_E2E_ADMIN_EMAIL: ${{ secrets.MM_MOBILE_E2E_ADMIN_EMAIL }}
      MM_MOBILE_E2E_ADMIN_USERNAME: ${{ secrets.MM_MOBILE_E2E_ADMIN_USERNAME }}
      MM_MOBILE_E2E_ADMIN_PASSWORD: ${{ secrets.MM_MOBILE_E2E_ADMIN_PASSWORD }}
      MM_MOBILE_E2E_ZEPHYR_API_KEY: ${{ secrets.MM_MOBILE_E2E_ZEPHYR_API_KEY }}
      MM_MOBILE_E2E_TEST_CYCLE_LINK_PREFIX: ${{ secrets.MM_MOBILE_E2E_TEST_CYCLE_LINK_PREFIX }}
      MM_MOBILE_E2E_WEBHOOK_URL: ${{ secrets.MM_MOBILE_E2E_WEBHOOK_URL }}
      MM_E2E_MASTER_HEALTH_WEBHOOK_URL: ${{ secrets.MM_E2E_MASTER_HEALTH_WEBHOOK_URL }}
      MM_E2E_RELEASE_WEBHOOK_URL: ${{ secrets.MM_E2E_RELEASE_WEBHOOK_URL }}
      MM_MOBILE_DETOX_AWS_ACCESS_KEY_ID: ${{ secrets.MM_MOBILE_DETOX_AWS_ACCESS_KEY_ID }}
      MM_MOBILE_DETOX_AWS_SECRET_ACCESS_KEY: ${{ secrets.MM_MOBILE_DETOX_AWS_SECRET_ACCESS_KEY }}
      MM_MOBILE_E2E_WEBHOOK_PUBLIC_BASE_URL: ${{ secrets.MM_MOBILE_E2E_WEBHOOK_PUBLIC_BASE_URL }}
      MM_MOBILE_E2E_CLOUDFLARED_TUNNEL_TOKEN: ${{ secrets.MM_MOBILE_E2E_CLOUDFLARED_TUNNEL_TOKEN }}
    with:
      tsio-config: ''
      tsio-shard-name: ''
      run-android-tests: true
      run-type: "NONE"
      MM_OTHER_PLATFORM_POOL_URL: ${{ matrix.server.ios_site_1_url }}
      MM_TEST_SERVER_URL: ${{ matrix.server.android_site_1_url }}
      MM_TEST_SERVER_URL_2: ${{ matrix.server.android_site_2_url }}
      MM_TEST_SERVER_URL_3: ${{ matrix.server.site_3_url }}
      MOBILE_VERSION: ${{ inputs.MOBILE_VERSION }}
      search_path: ${{ matrix.server.latest && 'detox/e2e/test' || 'detox/e2e/test/products/channels/smoke_test' }}
      # Full suite matches the PR/main shard count (template default 32); smoke stays single-shard.
      parallelism: '1'
      artifact_run_id: ${{ github.run_id }}
      spec_files: ${{ matrix.server.specs }}
      results-artifact: ${{ format('e2e-rerun-results-detox-android-Server_{0}-a{1}', matrix.server.version, github.run_attempt) }}

  # Maestro runs only against the latest server version (no smoke-on-older variant).

  rerun-maestro-ios-e2e:
    name: rerun-mobile-cmt-maestro-ios-${{ matrix.server.version }}
    # !cancelled(): a lane failed upstream (that is why there is a re-run), which would skip this job otherwise.
    if: >-
      !cancelled() &&
      needs.plan-rerun-cmt.result == 'success' &&
      needs.build-ios-simulator.result == 'success' &&
      needs.provision-cmt-servers.result == 'success' &&
      fromJson(needs.plan-rerun-cmt.outputs.maestro-ios-matrix).server[0] != null
    permissions:
      contents: read
      id-token: write
      actions: read
      statuses: write
      # Nested template finalize reads PR labels to honour E2E/Override; a
      # reusable workflow cannot escalate past the caller, so grant it here too.
      issues: read
    uses: ./.github/workflows/e2e-maestro-template.yml
    needs:
      - plan-rerun-cmt
      - build-ios-simulator
      - prepare-maestro-matrix
      - cmt-identity
      - provision-cmt-servers
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-rerun-cmt.outputs.maestro-ios-matrix) }}
    secrets:
      MM_MOBILE_E2E_ADMIN_EMAIL: ${{ secrets.MM_MOBILE_E2E_ADMIN_EMAIL }}
      MM_MOBILE_E2E_ADMIN_USERNAME: ${{ secrets.MM_MOBILE_E2E_ADMIN_USERNAME }}
      MM_MOBILE_E2E_ADMIN_PASSWORD: ${{ secrets.MM_MOBILE_E2E_ADMIN_PASSWORD }}
      MM_MOBILE_E2E_ZEPHYR_API_KEY: ${{ secrets.MM_MOBILE_E2E_ZEPHYR_API_KEY }}
      MM_MOBILE_DETOX_AWS_ACCESS_KEY_ID: ${{ secrets.MM_MOBILE_DETOX_AWS_ACCESS_KEY_ID }}
      MM_MOBILE_DETOX_AWS_SECRET_ACCESS_KEY: ${{ secrets.MM_MOBILE_DETOX_AWS_SECRET_ACCESS_KEY }}
      MM_MOBILE_E2E_WEBHOOK_URL: ${{ secrets.MM_MOBILE_E2E_WEBHOOK_URL }}
      MM_E2E_MASTER_HEALTH_WEBHOOK_URL: ${{ secrets.MM_E2E_MASTER_HEALTH_WEBHOOK_URL }}
      MM_E2E_RELEASE_WEBHOOK_URL: ${{ secrets.MM_E2E_RELEASE_WEBHOOK_URL }}
    with:
      tsio-config: ''
      tsio-shard-name: ''
      platform: ios
      run-type: "NONE"
      MM_TEST_SERVER_URL: ${{ matrix.server.ios_site_1_url }}
      MOBILE_VERSION: ${{ inputs.MOBILE_VERSION }}
      record_tests_in_zephyr: false
      artifact_run_id: ${{ github.run_id }}
      flow-path: ${{ matrix.server.specs }}
      results-artifact: ${{ format('e2e-rerun-results-maestro-ios-Server_{0}-a{1}', matrix.server.version, github.run_attempt) }}

  rerun-maestro-android-e2e:
    name: rerun-mobile-cmt-maestro-android-${{ matrix.server.version }}
    # !cancelled(): a lane failed upstream (that is why there is a re-run), which would skip this job otherwise.
    if: >-
      !cancelled() &&
      needs.plan-rerun-cmt.result == 'success' &&
      needs.build-android-apk-maestro.result == 'success' &&
      needs.provision-cmt-servers.result == 'success' &&
      fromJson(needs.plan-rerun-cmt.outputs.maestro-android-matrix).server[0] != null
    permissions:
      contents: read
      id-token: write
      actions: read
      statuses: write
      # Nested template finalize reads PR labels to honour E2E/Override; a
      # reusable workflow cannot escalate past the caller, so grant it here too.
      issues: read
    uses: ./.github/workflows/e2e-maestro-template.yml
    needs:
      - plan-rerun-cmt
      - build-android-apk-maestro
      - prepare-maestro-matrix
      - cmt-identity
      - provision-cmt-servers
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-rerun-cmt.outputs.maestro-android-matrix) }}
    secrets:
      MM_MOBILE_E2E_ADMIN_EMAIL: ${{ secrets.MM_MOBILE_E2E_ADMIN_EMAIL }}
      MM_MOBILE_E2E_ADMIN_USERNAME: ${{ secrets.MM_MOBILE_E2E_ADMIN_USERNAME }}
      MM_MOBILE_E2E_ADMIN_PASSWORD: ${{ secrets.MM_MOBILE_E2E_ADMIN_PASSWORD }}
      MM_MOBILE_E2E_ZEPHYR_API_KEY: ${{ secrets.MM_MOBILE_E2E_ZEPHYR_API_KEY }}
      MM_MOBILE_DETOX_AWS_ACCESS_KEY_ID: ${{ secrets.MM_MOBILE_DETOX_AWS_ACCESS_KEY_ID }}
      MM_MOBILE_DETOX_AWS_SECRET_ACCESS_KEY: ${{ secrets.MM_MOBILE_DETOX_AWS_SECRET_ACCESS_KEY }}
      MM_MOBILE_E2E_WEBHOOK_URL: ${{ secrets.MM_MOBILE_E2E_WEBHOOK_URL }}
      MM_E2E_MASTER_HEALTH_WEBHOOK_URL: ${{ secrets.MM_E2E_MASTER_HEALTH_WEBHOOK_URL }}
      MM_E2E_RELEASE_WEBHOOK_URL: ${{ secrets.MM_E2E_RELEASE_WEBHOOK_URL }}
    with:
      tsio-config: ''
      tsio-shard-name: ''
      platform: android
      run-type: "NONE"
      MM_TEST_SERVER_URL: ${{ matrix.server.android_site_1_url }}
      MOBILE_VERSION: ${{ inputs.MOBILE_VERSION }}
      artifact_run_id: ${{ github.run_id }}
      flow-path: ${{ matrix.server.specs }}
      results-artifact: ${{ format('e2e-rerun-results-maestro-android-Server_{0}-a{1}', matrix.server.version, github.run_attempt) }}
      record_tests_in_zephyr: false

  tsio-channel-notify:
    name: Post Mattermost CMT channel rollup
    runs-on: ubuntu-24.04
    if: always() && needs.cmt-identity.result == 'success'
    needs:
      - cmt-identity
      - update-final-status
      - tsio-triage
      - rerun-detox-e2e
      - rerun-detox-ipad-e2e
      - rerun-detox-android-e2e
      - rerun-maestro-ios-e2e
      - rerun-maestro-android-e2e
      - plan-rerun-cmt
    permissions:
      contents: read
      actions: read
      # the channel rollup mints an OIDC token to read each shard's TSIO group.
      id-token: write
    steps:
      # Always check out reporting scripts from the workflow dispatch ref (main), never old release tags.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          sparse-checkout: |
            detox/utils/tsio-channel-notify-rollup.js
            detox/utils/tsio-report-status.js
            detox/utils/cmt-channel-notify.js
            detox/utils/build-tsio-job-config.js
            detox/utils/cli-args.js
            detox/utils/rerun-failed.js
          sparse-checkout-cone-mode: false
      # This attempt's triage verdicts (none when no shard failed, or triage did not finish).
      - name: Download triage findings
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: e2e-triage-findings-*-a${{ github.run_attempt }}
          path: triage-findings
      # The re-run's result per test (none when nothing was re-run).
      - name: Download re-run results
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: e2e-rerun-results-*-a${{ github.run_attempt }}
          path: rerun-results
      # download-artifact extracts a single match straight into the path, without the artifact-named folder.
      - name: Keep a single result in its artifact folder
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          file=""
          for f in rerun-results/jest-results-merged.json rerun-results/maestro-report.xml; do
            if [ -f "$f" ]; then
              file="$f"
              break
            fi
          done
          if [ -z "$file" ]; then
            exit 0
          fi
          name=$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" --paginate \
            --jq '.artifacts[] | select(.expired | not) | .name' \
            | grep -E "^e2e-rerun-results-.+-a${RUN_ATTEMPT}$" || true)
          count=$(printf '%s\n' "$name" | grep -c . || true)
          if [ "$count" != "1" ]; then
            echo "::warning::A single result was downloaded but $count rerun artifacts are listed; leaving it unread"
            exit 0
          fi
          mkdir -p "rerun-results/$name"
          mv "$file" "rerun-results/$name/"
      - name: Post Mattermost CMT channel rollup
        env:
          JOB_CONFIGS: ${{ needs.cmt-identity.outputs.tsio-job-configs }}
          TRIAGE_FINDINGS_DIR: triage-findings
          RERUN_RESULTS_DIR: rerun-results
          RERUN_STALE: ${{ needs.plan-rerun-cmt.outputs.stale || '{}' }}
          HANDOFF_FILE: cmt-agent-handoff.json
          MATTERMOST_CMT_WEBHOOK_URL: ${{ secrets.MM_E2E_RELEASE_WEBHOOK_URL }}
          UPSTREAM_SUCCEEDED: ${{ needs.update-final-status.outputs.upstream-succeeded || 'false' }}
        run: |
          node detox/utils/tsio-channel-notify-rollup.js \
            --job-configs="$JOB_CONFIGS" \
            --upstream-succeeded="$UPSTREAM_SUCCEEDED" \
            --poll-attempts=6 || true

      - name: Upload CMT agent handoff
        if: always() && hashFiles('cmt-agent-handoff.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmt-agent-handoff
          path: cmt-agent-handoff.json
          retention-days: 7

      - name: Dispatch CMT agent fix
        if: always() && hashFiles('cmt-agent-handoff.json') != ''
        env:
          WEBHOOK_URL: ${{ secrets.CURSOR_MOBILE_CMT_AUTOFIX_WEBHOOK_URL }}
          WEBHOOK_KEY: ${{ secrets.CURSOR_MOBILE_CMT_AUTOFIX_WEBHOOK_KEY }}
        run: |
          if [ -z "$WEBHOOK_URL" ] || [ -z "$WEBHOOK_KEY" ]; then
            echo "No webhook configured: fix brief is in the job summary and cmt-agent-handoff.json artifact."
            exit 0
          fi
          while IFS= read -r item; do
            title=$(jq -r '.test.title' <<<"$item")
            mode=$(jq -r '.mode' <<<"$item")
            status=$(printf '%s' "$item" | curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
              -X POST "$WEBHOOK_URL" -H "Authorization: Bearer $WEBHOOK_KEY" -H 'Content-Type: application/json' \
              --data-binary @-) || true
            echo "[$mode] $title: HTTP ${status:-000}"
          done < <(jq -c '.items[] | select(.mode == "fix_pr" or .mode == "draft_investigation")' cmt-agent-handoff.json)

      # Instance cleanup is handled by matterwick on workflow_run completed.

  # Filter to ONLY failing CMT suites before spinning triage runners: all-pass runs skip triage
  # completely, and shards of passing suites are never triaged (a failing suite's matrix result is
  # job-level, so all its shards are). Uses this run's own matrix job results (not shared SHA
  # statuses, which another run could overwrite). Fail-closed.
  plan-cmt-triage:
    name: Plan CMT triage lanes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: >-
      !cancelled() &&
      (needs.detox-e2e.result == 'failure' ||
       needs.detox-android-e2e.result == 'failure' ||
       needs.detox-ipad-e2e.result == 'failure' ||
       needs.maestro-ios-e2e.result == 'failure' ||
       needs.maestro-android-e2e.result == 'failure')
    needs:
      - cmt-identity
      - detox-e2e
      - detox-android-e2e
      - detox-ipad-e2e
      - maestro-ios-e2e
      - maestro-android-e2e
    permissions:
      contents: read
    outputs:
      failing-job-keys: ${{ steps.plan.outputs.failing-job-keys }}
      has-failing: ${{ steps.plan.outputs.has-failing }}
    steps:
      - name: Select failing CMT suites from this run
        id: plan
        env:
          JOB_KEYS: ${{ needs.cmt-identity.outputs.tsio-job-keys }}
          R_DETOX_IOS: ${{ needs.detox-e2e.result }}
          R_DETOX_IPAD: ${{ needs.detox-ipad-e2e.result }}
          R_DETOX_ANDROID: ${{ needs.detox-android-e2e.result }}
          R_MAESTRO_IOS: ${{ needs.maestro-ios-e2e.result }}
          R_MAESTRO_ANDROID: ${{ needs.maestro-android-e2e.result }}
        run: |
          FAILING="$JOB_KEYS"
          if FILTERED=$(jq -cn \
            --argjson keys "$JOB_KEYS" \
            --arg r_detox_ios "$R_DETOX_IOS" \
            --arg r_detox_ipad "$R_DETOX_IPAD" \
            --arg r_detox_android "$R_DETOX_ANDROID" \
            --arg r_maestro_ios "$R_MAESTRO_IOS" \
            --arg r_maestro_android "$R_MAESTRO_ANDROID" '
            [
              $keys[] | select(
                if startswith("detox-ios-") then $r_detox_ios != "success"
                elif startswith("detox-ipad-") then $r_detox_ipad != "success"
                elif startswith("detox-android-") then $r_detox_android != "success"
                elif startswith("maestro-ios-") then $r_maestro_ios != "success"
                elif startswith("maestro-android-") then $r_maestro_android != "success"
                else true
                end
              )
            ]
          ' 2>/dev/null); then
            if [ "$(jq 'length' <<<"$FILTERED")" -gt 0 ]; then
              FAILING="$FILTERED"
            fi
          fi
          HAS_FAILING=$(jq -r 'length > 0' <<<"$FAILING")
          {
            echo "failing-job-keys=${FAILING}"
            echo "has-failing=${HAS_FAILING}"
          } >> "$GITHUB_OUTPUT"

  # Same per-test judging the PR/main lanes get in e2e-detox-pr.yml: without it
  # every CMT shard is raw any-failure-red (FAILURES > 0 in the template summary
  # jobs), so a handful of known-flaky failures out of ~650 tests per leg turned
  # every CMT run red. Report-only (the default) only posts the verdict;
  # E2E_TRIAGE_MODE=enforce makes the verdict the shard's commit status, exactly
  # as on PR/main. The workflow run itself stays red on real failures either way.
  tsio-triage:
    name: Triage CMT failures (${{ matrix.job-key }})
    runs-on: ubuntu-24.04
    # The channel message waits for this job: a hang must not hold it for hours (recent runs take under a minute).
    timeout-minutes: 15
    if: >-
      !cancelled() &&
      needs.plan-cmt-triage.outputs.has-failing == 'true'
    needs:
      - calculate-commit-hash
      - cmt-identity
      - plan-cmt-triage
    permissions:
      contents: read
      statuses: write
      pull-requests: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        job-key: ${{ fromJSON(needs.plan-cmt-triage.outputs.failing-job-keys) }}
    steps:
      # Checked out from the workflow ref (the build-release-* branch under
      # test runs no code with the API key beyond this composite's own steps,
      # which are pinned actions; same pattern as e2e-detox-pr.yml).
      - name: Checkout triage action
        continue-on-error: true
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/e2e-triage/
          sparse-checkout-cone-mode: false

      - name: Resolve CMT triage lanes
        id: lanes
        env:
          JOB_CONFIGS: ${{ needs.cmt-identity.outputs.tsio-job-configs }}
          JOB_KEY: ${{ matrix.job-key }}
        run: |
          {
            echo "contexts=$(echo "$JOB_CONFIGS" | jq -r '[.[].status_context] | join(",")')"
            VER="${JOB_KEY#*-Server_}"
            case "$JOB_KEY" in
              detox-ios-Server_*)
                FILTER="mobile-cmt-ios-full-${VER},mobile-cmt-ios-smoke-${VER},build-ios-simulator,provision"
                HIST_LANE="mobile-main-detox-ios"
                HIST_REPORT="detox-ios"
                ;;
              detox-ipad-Server_*)
                FILTER="mobile-cmt-ipad-${VER},build-ios-simulator,provision"
                HIST_LANE="mobile-main-detox-ipad"
                HIST_REPORT="detox-ipad"
                ;;
              maestro-ios-Server_*)
                FILTER="mobile-cmt-maestro-ios-${VER},build-ios-simulator,provision"
                HIST_LANE="mobile-main-maestro-ios-e2e"
                HIST_REPORT="maestro-ios-e2e"
                ;;
              detox-android-Server_*)
                FILTER="mobile-cmt-android-full-${VER},mobile-cmt-android-smoke-${VER},build-android-apk,provision,!maestro"
                HIST_LANE="mobile-main-detox-android"
                HIST_REPORT="detox-android"
                ;;
              maestro-android-Server_*)
                FILTER="mobile-cmt-maestro-android-${VER},build-android-apk-maestro,provision"
                HIST_LANE="mobile-main-maestro-android-e2e"
                HIST_REPORT="maestro-android-e2e"
                ;;
              *)
                FILTER="${JOB_KEY}"
                HIST_LANE=""
                HIST_REPORT=""
                ;;
            esac
            echo "lane-job-filter=${FILTER}"
            echo "history-lane=${HIST_LANE}"
            echo "history-report=${HIST_REPORT}"
          } >> "$GITHUB_OUTPUT"

      - name: e2e/triage
        continue-on-error: true
        uses: ./.github/actions/e2e-triage
        with:
          job-key: ${{ matrix.job-key }}
          lane-job-filter: ${{ steps.lanes.outputs.lane-job-filter }}
          history-lane: ${{ steps.lanes.outputs.history-lane }}
          history-report: ${{ steps.lanes.outputs.history-report }}
          composite-identity: ${{ toJSON(fromJSON(needs.cmt-identity.outputs.tsio-job-configs)[matrix.job-key].composite_identity) }}
          status-context: ${{ fromJSON(needs.cmt-identity.outputs.tsio-job-configs)[matrix.job-key].status_context }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          triage-lanes: ${{ steps.lanes.outputs.contexts }}
          # A triage failure must never change the outcome of the CMT run itself.
          mode: ${{ vars.E2E_TRIAGE_MODE || 'report-only' }}
