    needs:
      - cmt-identity
      - calculate-commit-hash
      - provision-cmt-servers
      - detox-e2e
      - detox-android-e2e
      - detox-ipad-e2e
      - maestro-ios-e2e
      - maestro-android-e2e
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.MOBILE_VERSION }}
          persist-credentials: false

      - name: Resolve upstream matrix outcome
        id: upstream
        run: |
          UPSTREAM="true"
          for r in "${{ needs.provision-cmt-servers.result }}" "${{ needs.detox-e2e.result }}" "${{ needs.detox-android-e2e.result }}" "${{ needs.detox-ipad-e2e.result }}" "${{ needs.maestro-ios-e2e.result }}" "${{ needs.maestro-android-e2e.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) UPSTREAM="false" ;;
            esac
          done
          echo "succeeded=$UPSTREAM" >> "$GITHUB_OUTPUT"

      # Umbrella context only — each matrix leg already posted <shard> from TSIO.
      - name: Finalize umbrella CMT commit status from CI job results
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ needs.calculate-commit-hash.outputs.MOBILE_SHA }}
          REPO: ${{ github.repository }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          UPSTREAM: ${{ steps.upstream.outputs.succeeded }}
        run: |
          if [ "$UPSTREAM" = "true" ]; then
            STATE=success
            DESC="Compatibility Matrix Testing completed — see per-job e2e-test/* checks"
          else
            STATE=failure
            DESC="Compatibility Matrix Testing failed — see per-job e2e-test/* checks"
          fi
          gh api --method POST "repos/${REPO}/statuses/${COMMIT_SHA}" \
            -f state="$STATE" \
            -f context="e2e-test/compatibility-matrix-testing" \
            -f description="$DESC" \
            -f target_url="$TARGET_URL"


  # Per-shard TSIO groups are finalized in each matrix leg, which leaves channel
  # notify off so N legs do not spam. This job polls every shard group and posts
  # one summary — same path as PR/main. After triage, so the message carries its
  # verdict on each failed test.
  # Re-run, on fresh devices, the failed specs triage could not clear, against the same server version, so the
  # channel message can say for certain whether each is a product bug (see e2e-detox-pr.yml plan-rerun).
  plan-rerun-cmt:
    name: Plan re-run of failed specs
    runs-on: ubuntu-24.04
    if: '!cancelled() && needs.tsio-triage.result != ''skipped'''
    needs:
      - tsio-triage
    permissions:
      contents: read
    outputs:
      detox-ios-matrix: ${{ steps.plan.outputs.detox-ios-matrix }}
      detox-android-matrix: ${{ steps.plan.outputs.detox-android-matrix }}
      detox-ipad-matrix: ${{ steps.plan.outputs.detox-ipad-matrix }}
      maestro-ios-matrix: ${{ steps.plan.outputs.maestro-ios-matrix }}
      maestro-android-matrix: ${{ steps.plan.outputs.maestro-android-matrix }}
      stale: ${{ steps.plan.outputs.stale }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.MOBILE_VERSION }}
          persist-credentials: false
          sparse-checkout: |
            detox/utils/rerun-failed.js
            detox/utils/tsio-channel-notify-rollup.js
            detox/utils/tsio-report-status.js
            detox/utils/cmt-channel-notify.js
            detox/utils/build-tsio-job-config.js
            detox/utils/cli-args.js
      - name: Download triage findings
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: e2e-triage-findings-*-a${{ github.run_attempt }}
          path: triage-findings
      # A spec that differs from main's is out of date on this release branch: it is not re-run on the old build.
      - name: Fetch main to compare specs
        continue-on-error: true
        run: git fetch --no-tags --depth=1 origin main
      - name: Plan the re-run
        id: plan
        env:
          CMT_MATRIX: ${{ inputs.CMT_MATRIX }}
        run: node detox/utils/rerun-failed.js --findings-dir triage-findings --cmt-matrix "$CMT_MATRIX" --compare-ref FETCH_HEAD

