      MM_MOBILE_E2E_WEBHOOK_URL: ${{ secrets.MM_MOBILE_E2E_WEBHOOK_URL }}
      MM_E2E_MASTER_HEALTH_WEBHOOK_URL: ${{ secrets.MM_E2E_MASTER_HEALTH_WEBHOOK_URL }}
      MM_E2E_RELEASE_WEBHOOK_URL: ${{ secrets.MM_E2E_RELEASE_WEBHOOK_URL }}
    with:
      tsio-config: ''
      tsio-shard-name: ''
      platform: ios
      run-type: "NONE"
      MM_TEST_SERVER_URL: ${{ matrix.server.ios_site_1_url }}
      MOBILE_VERSION: ${{ inputs.MOBILE_VERSION }}
      record_tests_in_zephyr: false
      artifact_run_id: ${{ github.run_id }}
      flow-path: ${{ matrix.server.specs }}
      results-artifact: ${{ format('e2e-rerun-results-maestro-ios-Server_{0}-a{1}', matrix.server.version, github.run_attempt) }}

  rerun-maestro-android-e2e:
    name: rerun-mobile-cmt-maestro-android-${{ matrix.server.version }}
    # !cancelled(): a lane failed upstream (that is why there is a re-run), which would skip this job otherwise.
    if: >-
      !cancelled() &&
      needs.plan-rerun-cmt.result == 'success' &&
      needs.build-android-apk-maestro.result == 'success' &&
      needs.provision-cmt-servers.result == 'success' &&
      fromJson(needs.plan-rerun-cmt.outputs.maestro-android-matrix).server[0] != null
    permissions:
      contents: read
      id-token: write
      actions: read
      statuses: write
      # Nested template finalize reads PR labels to honour E2E/Override; a
      # reusable workflow cannot escalate past the caller, so grant it here too.
      issues: read
    uses: ./.github/workflows/e2e-maestro-template.yml
    needs:
      - plan-rerun-cmt
      - build-android-apk-maestro
      - prepare-maestro-matrix
      - cmt-identity
      - provision-cmt-servers
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan-rerun-cmt.outputs.maestro-android-matrix) }}
    secrets:
      MM_MOBILE_E2E_ADMIN_EMAIL: ${{ secrets.MM_MOBILE_E2E_ADMIN_EMAIL }}
      MM_MOBILE_E2E_ADMIN_USERNAME: ${{ secrets.MM_MOBILE_E2E_ADMIN_USERNAME }}
      MM_MOBILE_E2E_ADMIN_PASSWORD: ${{ secrets.MM_MOBILE_E2E_ADMIN_PASSWORD }}
      MM_MOBILE_E2E_ZEPHYR_API_KEY: ${{ secrets.MM_MOBILE_E2E_ZEPHYR_API_KEY }}
      MM_MOBILE_DETOX_AWS_ACCESS_KEY_ID: ${{ secrets.MM_MOBILE_DETOX_AWS_ACCESS_KEY_ID }}
      MM_MOBILE_DETOX_AWS_SECRET_ACCESS_KEY: ${{ secrets.MM_MOBILE_DETOX_AWS_SECRET_ACCESS_KEY }}
      MM_MOBILE_E2E_WEBHOOK_URL: ${{ secrets.MM_MOBILE_E2E_WEBHOOK_URL }}
      MM_E2E_MASTER_HEALTH_WEBHOOK_URL: ${{ secrets.MM_E2E_MASTER_HEALTH_WEBHOOK_URL }}
      MM_E2E_RELEASE_WEBHOOK_URL: ${{ secrets.MM_E2E_RELEASE_WEBHOOK_URL }}
    with:
      tsio-config: ''
      tsio-shard-name: ''
      platform: android
      run-type: "NONE"
      MM_TEST_SERVER_URL: ${{ matrix.server.android_site_1_url }}
      MOBILE_VERSION: ${{ inputs.MOBILE_VERSION }}
      artifact_run_id: ${{ github.run_id }}
      flow-path: ${{ matrix.server.specs }}
      results-artifact: ${{ format('e2e-rerun-results-maestro-android-Server_{0}-a{1}', matrix.server.version, github.run_attempt) }}
      record_tests_in_zephyr: false

  tsio-channel-notify:
    name: Post Mattermost CMT channel rollup
    runs-on: ubuntu-24.04
    if: always() && needs.cmt-identity.result == 'success'
    needs:
      - cmt-identity
      - update-final-status
      - tsio-triage
      - rerun-detox-e2e
      - rerun-detox-ipad-e2e
      - rerun-detox-android-e2e
      - rerun-maestro-ios-e2e
      - rerun-maestro-android-e2e
      - plan-rerun-cmt
    permissions:
      contents: read
      # the channel rollup mints an OIDC token to read each shard's TSIO group.
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.MOBILE_VERSION }}
          persist-credentials: false
      # This attempt's triage verdicts (none when no shard failed, or triage did not finish).
      - name: Download triage findings
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: e2e-triage-findings-*-a${{ github.run_attempt }}
          path: triage-findings
      # The re-run's result per test (none when nothing was re-run).
      - name: Download re-run results
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: e2e-rerun-results-*-a${{ github.run_attempt }}
          path: rerun-results
      - name: Post Mattermost CMT channel rollup
        env:
          JOB_CONFIGS: ${{ needs.cmt-identity.outputs.tsio-job-configs }}
          TRIAGE_FINDINGS_DIR: triage-findings
          RERUN_RESULTS_DIR: rerun-results
          RERUN_STALE: ${{ needs.plan-rerun-cmt.outputs.stale || '{}' }}
          MATTERMOST_CMT_WEBHOOK_URL: ${{ secrets.MM_E2E_RELEASE_WEBHOOK_URL }}
          UPSTREAM_SUCCEEDED: ${{ needs.update-final-status.outputs.upstream-succeeded || 'false' }}
        run: |
          node detox/utils/tsio-channel-notify-rollup.js \
            --job-configs="$JOB_CONFIGS" \
            --upstream-succeeded="$UPSTREAM_SUCCEEDED" \
            --poll-attempts=6 || true

      # Instance cleanup is handled by matterwick on workflow_run completed.

  # Same per-test judging the PR/main lanes get in e2e-detox-pr.yml: without it
  # every CMT shard is raw any-failure-red (FAILURES > 0 in the template summary
  # jobs), so a handful of known-flaky failures out of ~650 tests per leg turned
  # every CMT run red. Report-only (the default) only posts the verdict;
  # E2E_TRIAGE_MODE=enforce makes the verdict the shard's commit status, exactly
  # as on PR/main. The workflow run itself stays red on real failures either way.
  tsio-triage:
    name: Triage CMT failures (${{ matrix.job-key }})
    runs-on: ubuntu-24.04
    # The channel message waits for this job: a hang must not hold it for hours (recent runs take under a minute).
    timeout-minutes: 15
    if: >-
      !cancelled() &&
      (needs.detox-e2e.result == 'failure' ||
       needs.detox-android-e2e.result == 'failure' ||
       needs.detox-ipad-e2e.result == 'failure' ||
       needs.maestro-ios-e2e.result == 'failure' ||
       needs.maestro-android-e2e.result == 'failure')
    needs:
      - calculate-commit-hash
      - cmt-identity
      - detox-e2e
      - detox-android-e2e
      - detox-ipad-e2e
      - maestro-ios-e2e
      - maestro-android-e2e
    permissions:
      contents: read
      statuses: write
      pull-requests: read
    # Every lane writes the shared e2e-test/triage context, and the toolkit's
    # status publisher has no compare-and-swap: its status.ts requires every
    # caller to hold the same non-cancelling, SHA-scoped job concurrency lock
    # across its reads and writes. max-parallel serializes the matrix entries
    # within this run without discarding queued entries; the concurrency group
    # serializes against triage writers from any other run of the same commit.
    # The workflow-level cancel-in-progress group above does neither.
    concurrency:
      group: e2e-test-triage-${{ needs.calculate-commit-hash.outputs.MOBILE_SHA }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        job-key: ${{ fromJSON(needs.cmt-identity.outputs.tsio-job-keys) }}
    steps:
      # Checked out from the workflow ref (the build-release-* branch under
      # test runs no code with the API key beyond this composite's own steps,
      # which are pinned actions; same pattern as e2e-detox-pr.yml).
      - name: Checkout triage action
        continue-on-error: true
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/e2e-triage/
          sparse-checkout-cone-mode: false

      - name: Resolve CMT triage lanes
        id: lanes
        env:
          JOB_CONFIGS: ${{ needs.cmt-identity.outputs.tsio-job-configs }}
        run: |
          echo "contexts=$(echo "$JOB_CONFIGS" | jq -r '[.[].status_context] | join(",")')" >> "$GITHUB_OUTPUT"

      - name: e2e/triage
        continue-on-error: true
        uses: ./.github/actions/e2e-triage
        with:
          job-key: ${{ matrix.job-key }}
          composite-identity: ${{ toJSON(fromJSON(needs.cmt-identity.outputs.tsio-job-configs)[matrix.job-key].composite_identity) }}
          status-context: ${{ fromJSON(needs.cmt-identity.outputs.tsio-job-configs)[matrix.job-key].status_context }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          triage-lanes: ${{ steps.lanes.outputs.contexts }}
          # A triage failure must never change the outcome of the CMT run itself.
          mode: ${{ vars.E2E_TRIAGE_MODE || 'report-only' }}
