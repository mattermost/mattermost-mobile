name: ci
on:
  push:
    branches:
      - main
      - 'release*'
  pull_request:

permissions:
  pull-requests: write

env:
  NODE_VERSION: 24.15.0
  TERM: xterm

jobs:
  lint-typecheck:
    runs-on: ubuntu-22.04
    steps:
      - name: ci/checkout-repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: ci/prepare-node-deps
        uses: ./.github/actions/prepare-node-deps
      - name: ci/check-styles
        shell: bash
        run: |
          echo "::group::check-styles"
          npm run check
          echo "::endgroup::"
      - name: ci/check-i18n
        shell: bash
        run: |
          echo "::group::check-i18n"
          ./scripts/precommit/i18n.sh
          echo "::endgroup::"

  # A reusable workflow's `uses:` cannot take an expression, so testing a
  # mobile PR against an unmerged toolkit branch means editing the ref by hand.
  # That is fine — but it must never merge, because main would then depend on a
  # branch that can be force-pushed or deleted underneath it.
  toolkit-ref-pinned-to-main:
    name: Toolkit refs point at main
    runs-on: ubuntu-22.04
    steps:
      - name: ci/checkout-repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: ci/check-toolkit-refs
        shell: bash
        run: |
          set -euo pipefail
          # Anchored on `uses:` so the check does not match its own pattern
          # string in this file.
          BAD=$(grep -rnE "^[[:space:]]*uses:[[:space:]]*mattermost/mattermost-test-automation-toolkit/" \
            .github/workflows/ | grep -v "@main" || true)
          if [ -n "$BAD" ]; then
            echo "::error::Toolkit workflow refs must be @main before merging. Found:"
            echo "$BAD"
            echo ""
            echo "Pinning to a toolkit branch is expected while testing an unmerged"
            echo "toolkit change — revert the ref before this PR merges."
            exit 1
          fi
          echo "All toolkit refs point at @main."

  detox-lint-typecheck:
    # The detox/ package has its own tsconfig and is not covered by the root
    # check above. A TypeScript error in a detox test file makes its whole suite
    # fail to run, so the E2E shard exits non-zero and drops its JUnit, silently
    # reducing the reported test count. Type-check detox on every PR so the error
    # surfaces here instead.
    runs-on: ubuntu-22.04
    steps:
      - name: ci/checkout-repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: ci/prepare-node-deps
        uses: ./.github/actions/prepare-node-deps
      - name: ci/detox-install
        shell: bash
        # prepare-node-deps only installs the top-level node_modules; the detox
        # package has its own, needed for its type-check.
        run: cd detox && npm ci
      - name: ci/detox-typecheck
        shell: bash
        run: |
          echo "::group::detox-typecheck"
          cd detox && npm run tsc
          echo "::endgroup::"

  test:
    runs-on: ubuntu-22.04
    steps:
      - name: ci/checkout-repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: ci/prepare-node-deps
        uses: ./.github/actions/prepare-node-deps
      - name: ci/run-tests
        # main and PRs run test:coverage via the test-coverage action below;
        # release branches just need a plain test pass.
        if: startsWith(github.ref_name, 'release')
        shell: bash
        run: npm run test:ci
      - name: ci/test-coverage
        if: github.event_name == 'pull_request' || github.ref_name == 'main'
        uses: ./.github/actions/test-coverage
        with:
          run_id: ${{ github.run_id }}
