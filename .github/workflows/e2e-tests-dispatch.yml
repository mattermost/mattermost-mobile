---
# Starts E2E Tests after ci, on e2e-test-stack, from main or a release-<major>.<minor> branch.
#
#   workflow_run   ci completed. A same-repo run starts only when vars.E2E_TEST_STACK_ENABLED is
#                  true. Unset, Matterwick's pipeline is unchanged. A fork pull request whose ci
#                  succeeded starts E2E Tests. The fork's own ci file is only the trigger.
#   workflow_dispatch  the same gates, by hand, whether or not the variable is set. A hand run
#                  dispatches E2E Tests, which posts e2e-test-stack/<lane>. It writes the required
#                  e2e-test/* contexts only when the variable is true and the gates skip the run.
#
# Gate 1: ci succeeded for this commit. A run whose pull request has since moved on is skipped.
# Gate 2: a same-repo pull request into main or release-<major>.<minor> whose files are app-impacting
# and which has no E2E/Override label. paths.json is read from that base ref. A push to those branches
# is always run. A fork pull request into those branches is run after its ci succeeds.
#
# The job checks nothing out and runs no pull-request code. It does not assume the CI role.
name: E2E Tests Dispatch

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "The commit to test, a full 40-character SHA"
        required: true
        type: string
      pr_number:
        description: "The pull request the commit belongs to, if any. Empty tests the commit on this ref."
        required: false
        type: string
        default: ""
      lanes:
        description: "Comma-separated lanes: detox-ios, detox-ipad, detox-android, maestro-ios, maestro-android"
        required: false
        type: string
        default: "detox-ios,detox-ipad,detox-android,maestro-ios,maestro-android"
      e2e_test_stack_account:
        description: "The AWS account of the e2e-test-stack control plane"
        required: false
        type: choice
        options: ["prod", "dev"]
        default: "prod"
      e2e_test_stack_channel:
        description: "The control plane channel"
        required: false
        type: choice
        options: ["v1", "edge"]
        default: "v1"
      e2e_test_stack_server:
        description: "The server under test: master, latest or esr"
        required: false
        type: choice
        options: ["master", "latest", "esr"]
        default: "master"
      e2e_test_stack_server_image:
        description: "A server image tag that replaces e2e_test_stack_server, from mattermost/ or mattermostdevelopment/ mattermost-enterprise-edition or mattermost-enterprise-fips-edition"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Evaluate the gates and do not dispatch or post statuses"
        required: false
        type: boolean
        default: false

permissions: {}

# One decision at a time per commit. The E2E Tests run cancels an older run for the same pull request.
concurrency:
  group: e2e-tests-dispatch-${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  gate:
    name: Gate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
        (vars.E2E_TEST_STACK_ENABLED == 'true' ||
          github.event.workflow_run.head_repository.full_name != github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      decision: ${{ steps.decide.outputs.decision }}
      reason: ${{ steps.decide.outputs.reason }}
      ref: ${{ steps.decide.outputs.ref }}
      sha: ${{ steps.decide.outputs.sha }}
      pr: ${{ steps.decide.outputs.pr }}
      lanes: ${{ steps.decide.outputs.lanes }}
      account: ${{ steps.decide.outputs.account }}
      channel: ${{ steps.decide.outputs.channel }}
      server: ${{ steps.decide.outputs.server }}
      server-image: ${{ steps.decide.outputs.server-image }}
    steps:
      - name: e2e-dispatch/decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ENABLED: ${{ vars.E2E_TEST_STACK_ENABLED == 'true' && 'true' || 'false' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          DISPATCH_REF: ${{ github.ref_name }}
          INPUT_SHA: ${{ inputs.commit_sha }}
          INPUT_PR: ${{ inputs.pr_number }}
          INPUT_LANES: ${{ inputs.lanes }}
          INPUT_ACCOUNT: ${{ inputs.e2e_test_stack_account }}
          INPUT_CHANNEL: ${{ inputs.e2e_test_stack_channel }}
          INPUT_SERVER: ${{ inputs.e2e_test_stack_server }}
          INPUT_IMAGE: ${{ inputs.e2e_test_stack_server_image }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_PRS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          trusted_ref() {
            [[ "$1" == main || "$1" =~ ^release-[0-9]+\.[0-9]+$ ]]
          }

          # decision, reason, and whether a hand run should fail the job.
          finish() {
            local decision="$1" reason="$2" fail="${3:-false}"
            echo "decision=${decision}" >> "$GITHUB_OUTPUT"
            echo "reason=${reason}" >> "$GITHUB_OUTPUT"
            echo "${decision}: ${reason}"
            echo "### E2E Tests Dispatch" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "- Decision: \`${decision}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- ${reason}" >> "$GITHUB_STEP_SUMMARY"
            if [ "$DRY_RUN" = true ]; then
              echo "- Dry run: nothing dispatched" >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ "$fail" = true ] && [ "$EVENT" = workflow_dispatch ]; then
              echo "::error::${reason}"
              exit 1
            fi
            if [ "$decision" = refuse ]; then
              echo "::notice::${reason}"
            fi
            exit 0
          }

          out() {
            local name="$1" value="$2"
            echo "${name}=${value}" >> "$GITHUB_OUTPUT"
          }

          if [ "$EVENT" = workflow_dispatch ]; then
            sha=$(printf '%s' "$INPUT_SHA" | tr '[:upper:]' '[:lower:]')
            pr=$(printf '%s' "$INPUT_PR" | tr -d '[:space:]')
            lanes=$(printf '%s' "$INPUT_LANES" | tr -d '[:space:]')
            account=$INPUT_ACCOUNT
            channel=$INPUT_CHANNEL
            server=$INPUT_SERVER
            image=$INPUT_IMAGE
            [ -n "$account" ] || account=prod
            [ -n "$channel" ] || channel=v1
            [ -n "$server" ] || server=master
          else
            sha=$(printf '%s' "$RUN_SHA" | tr '[:upper:]' '[:lower:]')
            pr=""
            lanes="detox-ios,detox-ipad,detox-android,maestro-ios,maestro-android"
            account=prod
            channel=v1
            server=master
            image=""
          fi

          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            finish refuse "commit_sha must be a full 40-character SHA" true
          fi
          if [ -n "$pr" ] && ! [[ "$pr" =~ ^[1-9][0-9]{0,6}$ ]]; then
            finish refuse "pr_number must be a pull request number, or empty" true
          fi
          IFS=, read -ra lane_names <<< "$lanes"
          seen=""
          clean_lanes=""
          for name in "${lane_names[@]}"; do
            [ -n "$name" ] || continue
            case "$name" in
              detox-ios | detox-ipad | detox-android | maestro-ios | maestro-android) ;;
              *) finish refuse "unknown lane ${name}" true ;;
            esac
            case ",${seen}," in
              *",${name},"*) ;;
              *)
                seen="${seen},${name}"
                if [ -n "$clean_lanes" ]; then clean_lanes="${clean_lanes},${name}"; else clean_lanes=$name; fi
                ;;
            esac
          done
          if [ -z "$clean_lanes" ]; then
            finish refuse "lanes names no lane" true
          fi
          lanes=$clean_lanes
          case "$account" in
            prod | dev) ;;
            *) finish refuse "e2e_test_stack_account must be prod or dev" true ;;
          esac
          case "$channel" in
            v1 | edge) ;;
            *) finish refuse "e2e_test_stack_channel must be v1 or edge" true ;;
          esac
          case "$server" in
            master | latest | esr) ;;
            *) finish refuse "e2e_test_stack_server must be master, latest or esr" true ;;
          esac
          if [ -n "$image" ]; then
            repos='(mattermost|mattermostdevelopment)/mattermost-enterprise(-fips)?-edition'
            if ! [[ "$image" =~ ^((docker\.io|index\.docker\.io)/)?${repos}:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              finish refuse "the server image must be a tag of mattermost/ or mattermostdevelopment/ mattermost-enterprise-edition or mattermost-enterprise-fips-edition" true
            fi
          fi

          ref=""
          fork=false
          if [ "$EVENT" = workflow_dispatch ] && [ -z "$pr" ]; then
            ref=$DISPATCH_REF
            if ! trusted_ref "$ref"; then
              finish refuse "a hand run without pr_number must be started from main or a release-<major>.<minor> branch" true
            fi
          elif [ "$EVENT" != workflow_dispatch ] && [ "$RUN_REPO" != "$REPO" ]; then
            # The fork's ci workflow is not this repository's file. Success only means it finished.
            if [ "$RUN_EVENT" != pull_request ]; then
              finish refuse "ci in ${RUN_REPO} was not a pull request"
            fi
            if ! associated=$(gh api -H "Accept: application/vnd.github+json" "repos/${REPO}/commits/${sha}/pulls"); then
              finish refuse "could not list pull requests for ${sha}"
            fi
            pr=$(jq -r --arg repo "$RUN_REPO" --arg sha "$sha" --arg branch "$RUN_BRANCH" '
              [ .[]
                | select(.state == "open"
                    and .head.sha == $sha
                    and .head.ref == $branch
                    and ((.head.repo.full_name // "") == $repo)
                    and (.base.ref == "main" or (.base.ref | test("^release-[0-9]+\\.[0-9]+$"))))
              ]
              | sort_by(.number)
              | .[0].number // empty
            ' <<< "$associated")
            if [ -z "$pr" ]; then
              finish refuse "no open fork pull request into main or a release branch has head ${sha}"
            fi
            fork=true
          elif [ "$EVENT" != workflow_dispatch ]; then
            if [ "$RUN_EVENT" = pull_request ]; then
              # The workflow_run payload's pull_requests list is empty on some re-runs.
              # The commit's pull requests are the fallback, and only an open same-repo
              # pull request whose head is still this commit is kept.
              pr=$(jq -r --arg sha "$sha" --arg branch "$RUN_BRANCH" '
                first(.[]? | select(.head.sha == $sha and .head.ref == $branch) | .number) // empty
              ' <<< "${RUN_PRS:-null}")
              if [ -z "$pr" ]; then
                if ! associated=$(gh api -H "Accept: application/vnd.github+json" "repos/${REPO}/commits/${sha}/pulls"); then
                  finish refuse "could not list pull requests for ${sha}"
                fi
                pr=$(jq -r --arg repo "$REPO" --arg sha "$sha" --arg branch "$RUN_BRANCH" '
                  [ .[]
                    | select(.state == "open"
                        and .head.sha == $sha
                        and .head.ref == $branch
                        and ((.head.repo.full_name // "") == $repo)
                        and (.base.ref == "main" or (.base.ref | test("^release-[0-9]+\\.[0-9]+$"))))
                  ]
                  | sort_by(.number)
                  | .[0].number // empty
                ' <<< "$associated")
              fi
              if [ -z "$pr" ]; then
                finish refuse "no open pull request into main or a release branch has head ${sha}"
              fi
            else
              ref=$RUN_BRANCH
              if ! trusted_ref "$ref"; then
                finish refuse "ci completed on ${ref}, which is not main or a release-<major>.<minor> branch"
              fi
            fi
          fi

          if [ -n "$pr" ]; then
            if ! pull=$(gh api "repos/${REPO}/pulls/${pr}"); then
              finish refuse "could not read pull request ${pr}" "$([ "$EVENT" = workflow_dispatch ] && echo true || echo false)"
            fi
            head_repo=$(jq -r '.head.repo.full_name // empty' <<< "$pull")
            head_sha=$(jq -r '.head.sha' <<< "$pull")
            base=$(jq -r '.base.ref' <<< "$pull")
            state=$(jq -r '.state' <<< "$pull")
            changed_files=$(jq -r '.changed_files // empty' <<< "$pull")
            if [ "$head_repo" != "$REPO" ]; then
              fork=true
            fi
            if ! trusted_ref "$base"; then
              finish refuse "pull request ${pr} targets ${base}, not main or a release-<major>.<minor> branch" "$([ "$EVENT" = workflow_dispatch ] && echo true || echo false)"
            fi
            if [ "$state" != open ]; then
              finish refuse "pull request ${pr} is ${state}" "$([ "$EVENT" = workflow_dispatch ] && echo true || echo false)"
            fi
            if [ "$head_sha" != "$sha" ]; then
              finish refuse "pull request ${pr} head is ${head_sha}, not ${sha}" "$([ "$EVENT" = workflow_dispatch ] && echo true || echo false)"
            fi
            ref=$base
          fi

          if [ "$EVENT" = workflow_dispatch ]; then
            ci=$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${sha}&per_page=1" --jq '.workflow_runs[0] // empty')
            if [ -z "$ci" ]; then
              finish refuse "commit ${sha} has no ci run" true
            fi
            ci_status=$(jq -r '.status' <<< "$ci")
            ci_conclusion=$(jq -r '.conclusion // empty' <<< "$ci")
            if [ "$ci_status" != completed ] || [ "$ci_conclusion" != success ]; then
              finish refuse "ci for ${sha} is ${ci_status}/${ci_conclusion}, not success" true
            fi
          fi

          decision=dispatch
          reason="ci passed"
          if [ "$fork" = true ]; then
            decision=dispatch
            reason="pull request ${pr} is from a fork"
          elif [ -n "$pr" ]; then
            if ! labels=$(gh api --paginate "repos/${REPO}/issues/${pr}/labels?per_page=100" --jq '.[].name'); then
              decision=dispatch
              reason="labels of pull request ${pr} could not be read; running E2E"
            elif printf '%s\n' "$labels" | grep -qx 'E2E/Override'; then
              decision=skip
              reason="E2E/Override is set on pull request ${pr}"
            else
              paths_file="${RUNNER_TEMP}/e2e-paths.json"
              files_file="${RUNNER_TEMP}/e2e-files.tsv"
              if ! gh api -H "Accept: application/vnd.github.raw" \
                "repos/${REPO}/contents/.github/actions/compute-e2e-build-fingerprint/paths.json?ref=${ref}" \
                > "$paths_file"; then
                decision=dispatch
                reason="paths.json on ${ref} could not be read; running E2E"
              elif ! gh api --paginate "repos/${REPO}/pulls/${pr}/files?per_page=100" \
                --jq '.[] | [.filename, (.previous_filename // "")] | @tsv' > "$files_file"; then
                decision=dispatch
                reason="the file list of pull request ${pr} could not be read; running E2E"
              else
                # The pulls files API stops at 3000 files. A short or capped list must not skip E2E.
                listed=$(wc -l < "$files_file" | tr -d '[:space:]')
                if ! [[ "$changed_files" =~ ^[0-9]+$ ]] || [ "$listed" -ge 3000 ] || [ "$listed" -ne "$changed_files" ]; then
                  decision=dispatch
                  if [ "$listed" -ge 3000 ]; then
                    reason="the file list of pull request ${pr} reached the 3000-file API limit; running E2E"
                  elif [[ "$changed_files" =~ ^[0-9]+$ ]]; then
                    reason="the file list of pull request ${pr} lists ${listed} of ${changed_files} changed files; running E2E"
                  else
                    reason="the file list of pull request ${pr} could not be checked against its changed files; running E2E"
                  fi
                else
                impact=$(python3 - "$paths_file" "$files_file" << 'PY'
          import json, re, sys

          def globs(doc):
              pats = [".github/actions/compute-e2e-build-fingerprint/**"]
              def to_glob(entry):
                  entry = str(entry)
                  return entry + "**" if entry.endswith("/") else entry
              for entry in doc.get("fingerprintShared") or []:
                  pats.append(to_glob(entry))
              for entries in (doc.get("fingerprintByPlatform") or {}).values():
                  for entry in entries:
                      pats.append(to_glob(entry))
              for entry in doc.get("triggerExtra") or []:
                  pats.append(str(entry))
              seen = set()
              out = []
              for pat in pats:
                  if pat not in seen:
                      seen.add(pat)
                      out.append(pat)
              return out

          def compile_pat(pattern):
              parts = []
              i = 0
              while i < len(pattern):
                  if pattern.startswith("**", i):
                      parts.append(".*")
                      i += 2
                  elif pattern[i] == "*":
                      parts.append("[^/]*")
                      i += 1
                  else:
                      parts.append(re.escape(pattern[i]))
                      i += 1
              return re.compile("^" + "".join(parts) + "$")

          try:
              with open(sys.argv[1], encoding="utf-8") as fh:
                  matchers = [compile_pat(pat) for pat in globs(json.load(fh))]
              hit = ""
              with open(sys.argv[2], encoding="utf-8") as fh:
                  for line in fh:
                      for name in line.rstrip("\n").split("\t"):
                          if name and any(matcher.match(name) for matcher in matchers):
                              hit = name
                              break
                      if hit:
                          break
              print("hit" if hit else "miss")
          except Exception:
              print("error")
          PY
          )
                case "$impact" in
                  miss)
                    decision=skip
                    reason="pull request ${pr} has no app-impacting files"
                    ;;
                  hit)
                    decision=dispatch
                    reason="pull request ${pr} changes app-impacting files"
                    ;;
                  *)
                    decision=dispatch
                    reason="the impact filter failed; running E2E"
                    ;;
                esac
                fi
              fi
            fi
          else
            reason="ci passed on ${ref}"
          fi

          start=false
          post=false
          if [ "$decision" = dispatch ] && [ "$DRY_RUN" != true ]; then
            start=true
          fi
          if [ "$decision" = skip ] && [ "$ENABLED" = true ] && [ "$DRY_RUN" != true ] && [ -n "$pr" ]; then
            post=true
          fi

          out decision "$decision"
          out reason "$reason"
          out start "$start"
          out post "$post"
          out ref "$ref"
          out sha "$sha"
          out pr "$pr"
          out lanes "$lanes"
          out account "$account"
          out channel "$channel"
          out server "$server"
          out server-image "$image"
          echo "${decision}: ${reason}"
          {
            echo "### E2E Tests Dispatch"
            echo
            echo "- Decision: \`${decision}\`"
            echo "- ${reason}"
            if [ -n "$pr" ]; then echo "- Pull request: ${pr}"; fi
            echo "- Ref: \`${ref}\`"
            echo "- Commit: \`${sha}\`"
            if [ "$DRY_RUN" = true ]; then echo "- Dry run: nothing dispatched"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: e2e-dispatch/start
        if: steps.decide.outputs.start == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ steps.decide.outputs.ref }}
          SHA: ${{ steps.decide.outputs.sha }}
          PR: ${{ steps.decide.outputs.pr }}
          LANES: ${{ steps.decide.outputs.lanes }}
          ACCOUNT: ${{ steps.decide.outputs.account }}
          CHANNEL: ${{ steps.decide.outputs.channel }}
          SERVER: ${{ steps.decide.outputs.server }}
          IMAGE: ${{ steps.decide.outputs.server-image }}
        run: |
          set -euo pipefail
          if ! [[ "$REF" == main || "$REF" =~ ^release-[0-9]+\.[0-9]+$ ]]; then
            echo "::error::refusing to dispatch onto ${REF}"
            exit 1
          fi
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::refusing to dispatch commit ${SHA}"
            exit 1
          fi
          if ! [[ "$GH_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::refusing to dispatch without a repository"
            exit 1
          fi
          if [ -n "$PR" ] && ! [[ "$PR" =~ ^[1-9][0-9]{0,6}$ ]]; then
            echo "::error::refusing to dispatch pull request ${PR}"
            exit 1
          fi
          case "$ACCOUNT" in
            prod | dev) ;;
            *) echo "::error::refusing account ${ACCOUNT}"; exit 1 ;;
          esac
          case "$CHANNEL" in
            v1 | edge) ;;
            *) echo "::error::refusing channel ${CHANNEL}"; exit 1 ;;
          esac
          case "$SERVER" in
            master | latest | esr) ;;
            *) echo "::error::refusing server ${SERVER}"; exit 1 ;;
          esac
          IFS=, read -ra lane_names <<< "$LANES"
          for name in "${lane_names[@]}"; do
            case "$name" in
              detox-ios | detox-ipad | detox-android | maestro-ios | maestro-android) ;;
              *) echo "::error::refusing lane ${name}"; exit 1 ;;
            esac
          done
          if [ -n "$IMAGE" ]; then
            repos='(mattermost|mattermostdevelopment)/mattermost-enterprise(-fips)?-edition'
            if ! [[ "$IMAGE" =~ ^((docker\.io|index\.docker\.io)/)?${repos}:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "::error::refusing server image"
              exit 1
            fi
          fi
          args=(
            gh workflow run e2e-tests-ci.yml --repo "$GH_REPO" --ref "$REF"
            -f "commit_sha=${SHA}"
            -f "lanes=${LANES}"
            -f "e2e_test_stack_account=${ACCOUNT}"
            -f "e2e_test_stack_channel=${CHANNEL}"
            -f "e2e_test_stack_server=${SERVER}"
          )
          if [ -n "$PR" ]; then
            args+=(-f "pr_number=${PR}")
          fi
          if [ -n "$IMAGE" ]; then
            args+=(-f "e2e_test_stack_server_image=${IMAGE}")
          fi
          "${args[@]}"
          echo "Dispatched E2E Tests on ${REF} for ${SHA}"

      # Required contexts, and only when the variable is on and this run is a skip.
      # A hand run with the variable unset leaves e2e-test/* to Matterwick.
      - name: e2e-dispatch/skip-statuses
        if: steps.decide.outputs.post == 'true' && vars.E2E_TEST_STACK_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.decide.outputs.sha }}
          PR: ${{ steps.decide.outputs.pr }}
          REASON: ${{ steps.decide.outputs.reason }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$PR" ]; then
            echo "no pull request, so no required status to settle"
            exit 0
          fi
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::refusing to post a status for ${SHA}"
            exit 1
          fi
          case "$REASON" in
            *"E2E/Override"*) description="E2E skipped — E2E/Override" ;;
            *) description="E2E skipped — no app-impacting changes" ;;
          esac
          for context in e2e-test/detox-ios e2e-test/detox-android e2e-test/detox-ipad e2e-test/maestro-ios e2e-test/maestro-android; do
            gh api --method POST "repos/${REPO}/statuses/${SHA}" \
              -f state=success \
              -f context="$context" \
              -f description="$description" \
              -f target_url="$URL" > /dev/null
            echo "${context}: success (${description})"
          done
