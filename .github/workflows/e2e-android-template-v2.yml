name: Detox Android E2E Tests Template v2

# Detox on e2e-test-stack, dispatched by Test System IO: one run per lane and one
# worker matrix. Each worker owns its SITE_1 and shares SITE_2 and SITE_3. The
# Detox configuration decides the specs (begin runs `detox --listTests`); specs
# tagged @server_mutation dispatch last. Maestro and the Matterwick template are
# unchanged.
#
# create and provision are the existing workflows. begin runs after provision,
# because the orchestrator idles a run out while it waits for the first lease.
# Each worker boots one emulator, then dispatch-run leases specs onto it.

on:
  workflow_call:
    inputs:
      lane:
        description: "Pool run name: detox-android"
        type: string
        required: true
      commit_sha:
        description: "The commit under test, a full 40-character SHA"
        type: string
        required: true
      pr_number:
        description: "The pull request the commit belongs to; empty for none"
        type: string
        default: ""
      artifact_run_id:
        description: "Run ID of the workflow that uploaded android-build-files-*"
        type: string
        default: ""
      fork:
        description: "The commit under test is from a fork. Provisioning uses this workflow's commit."
        type: boolean
        default: false
      e2e_test_stack_account:
        description: "AWS account of the control plane, prod or dev"
        type: string
        default: "prod"
      e2e_test_stack_channel:
        description: "Control plane channel, v1 or edge"
        type: string
        default: "v1"
      e2e_test_stack_server_image:
        description: "Mattermost server image: master, latest, esr, or an image by tag"
        type: string
        default: "master"
      e2e_test_stack_batch:
        description: "This lane's batch name"
        type: string
        required: true
      parallelism:
        description: "Workers, each with its own server"
        type: string
        default: "32"
      detox_config:
        description: "Detox configuration, android.emu.debug"
        type: string
        default: "android.emu.debug"
      android_avd_name:
        description: "Android emulator name"
        type: string
        default: "detox_pixel_8"
      android_api_level:
        description: "Android API level"
        type: string
        default: "35"
    outputs:
      report-url:
        description: "Test System IO report for this lane"
        value: ${{ jobs.summary.outputs.report-url || jobs.begin.outputs.report-url }}
    secrets:
      E2E_TEST_STACK_CREDENTIALS_KEY:
        required: true

permissions: {}

defaults:
  run:
    shell: bash

env:
  PLATFORM: android
  IOS: "false"
  HEADLESS: "true"
  RUNNING_E2E: "true"
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  AVD_NAME: ${{ inputs.android_avd_name }}
  SDK_VERSION: ${{ inputs.android_api_level }}
  ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id || github.run_id }}

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      branch: ${{ steps.plan.outputs.branch }}
      identity: ${{ steps.plan.outputs.identity }}
      workers: ${{ steps.plan.outputs.workers }}
      stack-count: ${{ steps.plan.outputs.stack-count }}
      slices: ${{ steps.plan.outputs.slices }}
      webhook: ${{ steps.plan.outputs.webhook }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
          fetch-depth: 1

      # A server per worker, then the shared SITE_2 and SITE_3. Provisioning runs in up to 8 jobs.
      - name: ci/plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          LANE: ${{ inputs.lane }}
          PARALLELISM: ${{ inputs.parallelism }}
          PR_NUMBER: ${{ inputs.pr_number }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit_sha must be a full 40-character SHA, got '${COMMIT_SHA}'"
            exit 1
          fi
          if ! [[ "$LANE" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::lane must be lowercase letters, digits, and hyphens"
            exit 1
          fi
          if ! [[ "$PARALLELISM" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::parallelism must be a positive integer, got '${PARALLELISM}'"
            exit 1
          fi
          if [ -n "$PR_NUMBER" ] && ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::pr_number must be a pull request number, or empty"
            exit 1
          fi
          if ! grep -rqE '^export function isE2eTestStack\(' detox/provision; then
            echo "::error::the code under test predates e2e-test-stack provisioning; merge main into it"
            exit 1
          fi

          branch="${GITHUB_REF_NAME}"
          if [ -n "$PR_NUMBER" ]; then
            head=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.ref || true)
            if [ -n "$head" ]; then
              branch="$head"
            else
              echo "::warning::could not read the pull request head ref; using ${branch}"
            fi
          fi

          identity=$(jq -nc \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg sha "$COMMIT_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg name "$LANE" \
            --arg branch "$branch" \
            --arg pr "$PR_NUMBER" \
            '{repository:$repo, commit_sha:$sha, gh_run_id:$run_id, gh_run_attempt:$attempt, name:$name, branch:$branch}
              + (if $pr == "" then {} else {gh_pr_number:$pr} end)')
          count=$((PARALLELISM + 2))
          webhook=false
          if find detox/e2e/test -name 'mm_blocks_*.e2e.ts' | grep -q .; then
            webhook=true
          fi
          {
            echo "branch=${branch}"
            echo "identity=${identity}"
            echo "workers=$(jq -nc --argjson n "$PARALLELISM" '[range(1; $n + 1)]')"
            echo "stack-count=${count}"
            echo "slices=$(jq -nc --argjson n "$count" '[range(0; $n)] | group_by(. % 8) | map(map(tostring) | join(","))')"
            echo "webhook=${webhook}"
          } >> "$GITHUB_OUTPUT"
          echo "${PARALLELISM} workers, ${count} servers, webhook=${webhook}"

  e2e-test-stack-create:
    name: e2e-test-stack-create
    needs: prepare
    if: needs.prepare.result == 'success'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/e2e-test-stack-create.yml
    with:
      batch: ${{ inputs.e2e_test_stack_batch }}
      account: ${{ inputs.e2e_test_stack_account }}
      channel: ${{ inputs.e2e_test_stack_channel }}
      server_image: ${{ inputs.e2e_test_stack_server_image }}
      count: ${{ needs.prepare.outputs.stack-count }}
      services: ${{ needs.prepare.outputs.webhook == 'true' && 'webhook' || '' }}
      license: enterprise-advanced
      shared_admin_password: true
      # 4h from create: the runner queue, the job timeout, and a re-run have to finish inside it.
      ttl: 4h
    secrets:
      E2E_TEST_STACK_CREDENTIALS_KEY: ${{ secrets.E2E_TEST_STACK_CREDENTIALS_KEY }}

  e2e-test-stack-provision:
    name: e2e-test-stack-provision
    needs: [prepare, e2e-test-stack-create]
    if: needs.e2e-test-stack-create.result == 'success'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/e2e-test-stack-provision.yml
    with:
      batch: ${{ inputs.e2e_test_stack_batch }}
      slices: ${{ needs.prepare.outputs.slices }}
      # A fork's provisioning code does not run with the credentials key.
      commit_sha: ${{ inputs.fork && github.sha || inputs.commit_sha }}
    secrets:
      E2E_TEST_STACK_CREDENTIALS_KEY: ${{ secrets.E2E_TEST_STACK_CREDENTIALS_KEY }}

  begin:
    name: dispatch-begin
    needs: [prepare, e2e-test-stack-provision]
    if: needs.e2e-test-stack-provision.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      report-url: ${{ steps.begin.outputs.report-url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: ci/setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # detox --listTests only reads the Detox and Jest configuration, so install scripts are skipped.
      - name: ci/install-detox-deps
        run: cd detox && npm ci --ignore-scripts

      - name: ci/dispatch-begin
        id: begin
        uses: mattermost/mattermost-test-system-io/.github/actions/test-system-io-dispatch-begin@a136951bc3f779834010aa219e1d38a0d70a340b # detox-spec-list: detox-list-tests, detox-sort-last
        with:
          framework: detox
          use-staging: ${{ vars.E2E_USE_STAGING_TEST_IO_URL == 'true' }}
          repo-dir: ${{ github.workspace }}
          composite-identity: ${{ needs.prepare.outputs.identity }}
          total-reports-expected: ${{ inputs.parallelism }}
          retest-on-fail: "true"
          post-pending-commit-status: "false"
          duration-base-branch: ""
          idle-timeout-ms: "2700000"
          lease-timeout-ms: "1800000"
          detox-dir: detox
          detox-list-tests: "true"
          detox-config: ${{ inputs.detox_config }}
          detox-sort-last: "@server_mutation"

  dispatch-run:
    name: dispatch-run-${{ inputs.lane }}-${{ matrix.worker }}
    needs: [prepare, e2e-test-stack-provision, begin]
    if: >-
      !cancelled() &&
      needs.e2e-test-stack-provision.result == 'success' &&
      needs.begin.result == 'success'
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(needs.prepare.outputs.workers) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
          fetch-depth: 1

      # This run's commit, not the commit under test. A fork run loads every local action, nested ones too, from it.
      - name: ci/e2e-test-stack-actions
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: .e2e-test-stack-actions
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: ci/use-trusted-actions
        if: inputs.fork == true
        run: |
          set -euo pipefail
          if [ -L .github ]; then rm .github; fi
          rm -rf .github/actions
          mkdir -p .github
          cp -R .e2e-test-stack-actions/.github/actions .github/actions

      - name: ci/e2e-test-stack-sites
        uses: ./.e2e-test-stack-actions/.github/actions/e2e-test-stack-sites
        with:
          batch: ${{ inputs.e2e_test_stack_batch }}
          shard: ${{ matrix.worker }}
          credentials-key: ${{ secrets.E2E_TEST_STACK_CREDENTIALS_KEY }}

      - name: ci/prepare-node-deps
        uses: ./.github/actions/prepare-node-deps
        with:
          save-cache: ${{ inputs.fork != true }}

      - name: Install Dependencies
        timeout-minutes: 6
        run: |
          APT_OPTS=(-o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o DPkg::Lock::Timeout=120)
          PACKAGES=(libpulse0 xvfb)
          sudo apt-get "${APT_OPTS[@]}" install -y "${PACKAGES[@]}" || {
            sudo apt-get "${APT_OPTS[@]}" update
            sudo apt-get "${APT_OPTS[@]}" install -y "${PACKAGES[@]}"
          }

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # A fork run restores caches and never saves them, so its files never reach the branch's shared cache.
      - name: Cache detox node_modules
        if: inputs.fork != true
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: detox/node_modules
          key: ${{ runner.os }}-detox-deps-${{ hashFiles('detox/package-lock.json') }}
          restore-keys: ${{ runner.os }}-detox-deps-

      - name: Restore detox node_modules
        if: inputs.fork == true
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: detox/node_modules
          key: ${{ runner.os }}-detox-deps-${{ hashFiles('detox/package-lock.json') }}
          restore-keys: ${{ runner.os }}-detox-deps-

      - name: Install Detox Dependencies
        run: cd detox && npm i

      - name: Set .env with RUNNING_E2E=true
        run: echo "RUNNING_E2E=true" > .env

      - name: Download Detox Android build from parent workflow
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-build-files-${{ env.ARTIFACT_RUN_ID }}
          repository: ${{ github.repository }}
          run-id: ${{ env.ARTIFACT_RUN_ID }}
          github-token: ${{ github.token }}
          path: android/app/build

      - name: Verify Detox Android app from parent build
        env:
          ARTIFACT_RUN_ID: ${{ env.ARTIFACT_RUN_ID }}
        run: |
          APP_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          TEST_APK="android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          if [ ! -f "$APP_APK" ] || [ ! -f "$TEST_APK" ]; then
            echo "❌ Missing a Detox APK from android-build-files-${ARTIFACT_RUN_ID}"
            find android/app/build -name '*.apk' 2>/dev/null || true
            exit 1
          fi
          ls -lh "$APP_APK" "$TEST_APK"

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools:$PATH
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "PATH=$PATH" >> "$GITHUB_ENV"

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Accept Android licenses
        run: |
          mkdir -p ~/.android
          { yes || true; } | sdkmanager --licenses > sdk_licenses_output.txt || true
          if grep -q "All SDK package licenses accepted" sdk_licenses_output.txt; then
            echo "✅ All licenses accepted successfully."
          else
            echo "❌ Licenses not fully accepted."
            cat sdk_licenses_output.txt
            exit 1
          fi

      - name: Cache Android SDK components
        id: android-sdk-cache
        if: inputs.fork != true
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .android-sdk-cache
          key: android-sdk-${{ inputs.android_api_level }}-google-apis-x86_64-v2

      - name: Restore Android SDK components
        id: android-sdk-restore
        if: inputs.fork == true
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .android-sdk-cache
          key: android-sdk-${{ inputs.android_api_level }}-google-apis-x86_64-v2

      - name: Apply cached Android SDK components
        if: steps.android-sdk-cache.outputs.cache-hit == 'true' || steps.android-sdk-restore.outputs.cache-hit == 'true'
        env:
          API_LEVEL: ${{ inputs.android_api_level }}
        run: |
          for component in platform-tools emulator; do
            if [ -d ".android-sdk-cache/${component}" ]; then
              rm -rf "${ANDROID_HOME:?}/${component}"
              cp -a ".android-sdk-cache/${component}" "${ANDROID_HOME}/"
            fi
          done
          if [ -d ".android-sdk-cache/platforms/android-${API_LEVEL}" ]; then
            rm -rf "${ANDROID_HOME}/platforms/android-${API_LEVEL}"
            mkdir -p "${ANDROID_HOME}/platforms"
            cp -a ".android-sdk-cache/platforms/android-${API_LEVEL}" "${ANDROID_HOME}/platforms/"
          fi
          if [ -d ".android-sdk-cache/system-images/android-${API_LEVEL}" ]; then
            rm -rf "${ANDROID_HOME}/system-images/android-${API_LEVEL}"
            mkdir -p "${ANDROID_HOME}/system-images"
            cp -a ".android-sdk-cache/system-images/android-${API_LEVEL}" "${ANDROID_HOME}/system-images/"
          fi

      - name: Install Android SDK components
        if: steps.android-sdk-cache.outputs.cache-hit != 'true' && steps.android-sdk-restore.outputs.cache-hit != 'true'
        env:
          API_LEVEL: ${{ inputs.android_api_level }}
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          if ! [[ "$API_LEVEL" =~ ^[0-9]+$ ]]; then
            echo "Invalid android_api_level: $API_LEVEL"
            exit 1
          fi
          # Under pipefail, `yes` exits 141 (SIGPIPE) once sdkmanager closes stdin.
          for attempt in 1 2 3; do
            echo "SDK install attempt $attempt..."
            if { yes || true; } | sdkmanager --install "platform-tools" "emulator" "platforms;android-${API_LEVEL}" "system-images;android-${API_LEVEL};google_apis;x86_64"; then
              echo "SDK install succeeded on attempt $attempt"
              break
            fi
            echo "Attempt $attempt failed, retrying..."
            if [ "$attempt" = "3" ]; then
              echo "SDK install failed after 3 attempts"
              exit 1
            fi
            sleep 10
          done
          mkdir -p .android-sdk-cache/platforms .android-sdk-cache/system-images
          cp -a "${ANDROID_HOME}/platform-tools" .android-sdk-cache/
          cp -a "${ANDROID_HOME}/emulator" .android-sdk-cache/
          cp -a "${ANDROID_HOME}/platforms/android-${API_LEVEL}" .android-sdk-cache/platforms/
          cp -a "${ANDROID_HOME}/system-images/android-${API_LEVEL}" .android-sdk-cache/system-images/

      - name: Cache Android Emulator & AVD
        if: inputs.fork != true
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            detox/.android
            detox/${{ env.AVD_NAME }}_api_${{ inputs.android_api_level }}
          key: android-emulator-${{ runner.os }}-${{ runner.arch }}-${{ env.AVD_NAME }}-api-${{ inputs.android_api_level }}-v3
          restore-keys: |
            android-emulator-${{ runner.os }}-${{ runner.arch }}-${{ env.AVD_NAME }}-api-${{ inputs.android_api_level }}-
            android-emulator-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore Android Emulator & AVD
        if: inputs.fork == true
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            detox/.android
            detox/${{ env.AVD_NAME }}_api_${{ inputs.android_api_level }}
          key: android-emulator-${{ runner.os }}-${{ runner.arch }}-${{ env.AVD_NAME }}-api-${{ inputs.android_api_level }}-v3
          restore-keys: |
            android-emulator-${{ runner.os }}-${{ runner.arch }}-${{ env.AVD_NAME }}-api-${{ inputs.android_api_level }}-
            android-emulator-${{ runner.os }}-${{ runner.arch }}-

      - name: ci/e2e-test-stack-webhook
        if: needs.prepare.outputs.webhook == 'true'
        run: |
          {
            echo "WEBHOOK_BASE_URL=http://webhook:3000"
            echo "WEBHOOK_SIDECAR=e2e-test-stack"
          } >> "$GITHUB_ENV"

      - name: Boot Android emulator
        env:
          CI: "true"
          BOOTSTRAP_ONLY: "true"
          DETACH_SERVICES: "true"
        run: |
          chmod +x detox/create_android_emulator.sh
          detox/create_android_emulator.sh "$SDK_VERSION" "$AVD_NAME"

      - name: ci/dispatch-run
        timeout-minutes: 150
        uses: mattermost/mattermost-test-system-io/.github/actions/test-system-io-dispatch-run@a136951bc3f779834010aa219e1d38a0d70a340b # detox-spec-list: detox-list-tests, detox-sort-last
        with:
          framework: detox
          use-staging: ${{ vars.E2E_USE_STAGING_TEST_IO_URL == 'true' }}
          composite-identity: ${{ needs.prepare.outputs.identity }}
          repo-dir: ${{ github.workspace }}
          artifacts-root: ${{ github.workspace }}/worker-artifacts
          github-token: ${{ github.token }}
          gh-job-name: dispatch-run-${{ inputs.lane }}-${{ matrix.worker }}
          detox-config: ${{ inputs.detox_config }}
          batch-size: "1"
          detox-max-workers: "1"

  summary:
    name: summary
    needs: [prepare, begin, dispatch-run]
    if: always() && !cancelled() && needs.begin.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      report-url: ${{ steps.summary.outputs.report_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: ci/run-summary
        id: summary
        uses: mattermost/mattermost-test-system-io/.github/actions/test-system-io-summary@a136951bc3f779834010aa219e1d38a0d70a340b # detox-spec-list: detox-list-tests, detox-sort-last
        with:
          framework: detox
          use-staging: ${{ vars.E2E_USE_STAGING_TEST_IO_URL == 'true' }}
          composite-identity: ${{ needs.prepare.outputs.identity }}
          commit-status-context: e2e-test-stack/${{ inputs.lane }}
          update-commit-status: "false"
          fail-on-test-failures: "true"
          pr-number: ${{ inputs.pr_number }}
          ref-branch: ${{ needs.prepare.outputs.branch }}
          image-tag: ${{ inputs.e2e_test_stack_server_image }}
