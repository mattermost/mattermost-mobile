---
name: build-pr
# Applying a build label authorizes execution of the reviewed PR SHA with
# signing/S3 secrets. The guard requires code write access: triage users can
# also apply labels, but cannot authorize privileged code execution. Workflow
# code comes from the default branch; build scripts come from the approved SHA.
on:
  pull_request_target:
    types:
      - labeled

permissions:
  contents: read
  pull-requests: read

env:
  NODE_VERSION: 24.15.0
  TERM: xterm
  INTUNE_ENABLED: 'true'
  BRANCH_TO_BUILD: ${{ github.event.pull_request.head.repo.full_name != github.repository && format('pr-{0}', github.event.pull_request.number) || github.event.pull_request.head.ref }}

jobs:
  authorize-build:
    runs-on: ubuntu-24.04
    if: ${{ github.event.label.name == 'Build Apps for PR' || github.event.label.name == 'Build App for iOS' || github.event.label.name == 'Build App for Android' }}
    permissions:
      pull-requests: read
    steps:
      # No checkout or PR-authored code may run before this authorization check.
      - name: Authorize the labeling actor and reviewed head
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const {owner, repo} = context.repo;
            const event = context.payload;
            const sender = event.sender?.login;
            if (!sender) {
              core.setFailed('Cannot authorize a build without a labeling actor.');
              return;
            }

            const {data: access} = await github.rest.repos.getCollaboratorPermissionLevel({
              owner, repo, username: sender,
            });
            const canPush = access.user?.permissions?.push === true ||
              ['push', 'write', 'maintain', 'admin'].includes(access.permission);
            if (!canPush) {
              core.setFailed('Build labels require a reviewer with repository write access.');
              return;
            }

            const {data: pr} = await github.rest.pulls.get({
              owner, repo, pull_number: event.pull_request.number,
            });
            if (pr.state !== 'open') {
              core.setFailed('The pull request is no longer open.');
              return;
            }
            if (pr.head.sha !== event.pull_request.head.sha) {
              core.setFailed('The PR head has changed. Review the new SHA and reapply the build label.');
              return;
            }
            if (!pr.labels.some((label) => label.name === event.label.name)) {
              core.setFailed('The build label has been removed.');
              return;
            }
            core.info(`Authorized ${sender} to build PR #${event.pull_request.number} at ${pr.head.sha}.`);

  test:
    runs-on: ubuntu-22.04
    if: ${{ github.event.label.name == 'Build Apps for PR' || github.event.label.name == 'Build App for iOS' || github.event.label.name == 'Build App for Android' }}
    needs:
      - authorize-build
    steps:
      - name: ci/checkout-repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: ci/test
        uses: ./.github/actions/test

  build-ios-pr:
    runs-on: macos-15-large
    if: ${{ github.event.label.name == 'Build Apps for PR' || github.event.label.name == 'Build App for iOS' }}
    needs:
      - authorize-build
      - test
    steps:
      - name: ci/checkout-repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: ci/setup-ssh-key
        uses: ./.github/actions/setup-ssh-key
        with:
          ssh-private-key: ${{ secrets.MM_MOBILE_PRIVATE_DEPLOY_KEY }}

      - name: ci/prepare-ios-build
        uses: ./.github/actions/prepare-ios-build
        with:
          intune-enabled: ${{ env.INTUNE_ENABLED }}
          intune-ssh-private-key: ${{ secrets.MM_MOBILE_INTUNE_DEPLOY_KEY }}

      - name: ci/build-ios-pr
        env:
          BRANCH_TO_BUILD: "${{ env.BRANCH_TO_BUILD }}"
          AWS_ACCESS_KEY_ID: "${{ secrets.MM_MOBILE_PR_AWS_ACCESS_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY: "${{ secrets.MM_MOBILE_PR_AWS_SECRET_ACCESS_KEY }}"
          FASTLANE_TEAM_ID: "${{ secrets.MM_MOBILE_FASTLANE_TEAM_ID }}"
          IOS_API_ISSUER_ID: "${{ secrets.MM_MOBILE_IOS_API_ISSUER_ID }}"
          IOS_API_KEY: "${{ secrets.MM_MOBILE_IOS_API_KEY }}"
          IOS_API_KEY_ID: "${{ secrets.MM_MOBILE_IOS_API_KEY_ID }}"
          MATCH_GIT_URL: "${{ secrets.MM_MOBILE_MATCH_GIT_URL }}"
          MATCH_PASSWORD: "${{ secrets.MM_MOBILE_MATCH_PASSWORD }}"
          MATTERMOST_WEBHOOK_URL: "${{ secrets.MM_MOBILE_PR_MATTERMOST_WEBHOOK_URL }}"
        run: bundle exec fastlane ios build --env ios.pr
        working-directory: ./fastlane

      - name: ci/upload-ios-pr-s3-bucket
        env:
          BRANCH_TO_BUILD: "${{ env.BRANCH_TO_BUILD }}"
          # Uses static credentials; s3_client_oidc not set so Fastlane uses legacy path.
          AWS_ACCESS_KEY_ID: "${{ secrets.MM_MOBILE_PR_AWS_ACCESS_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY: "${{ secrets.MM_MOBILE_PR_AWS_SECRET_ACCESS_KEY }}"
          MATTERMOST_WEBHOOK_URL: "${{ secrets.MM_MOBILE_PR_MATTERMOST_WEBHOOK_URL }}"
        run: |
          echo "::group::Upload to S3 bucket"
          bundle exec fastlane ios upload_artifacts_to_s3 --env ios.pr
          echo "::endgroup::"
        working-directory: ./fastlane

      - name: ci/upload-ios-pr-build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-build-pr-${{ github.run_id }}
          path: "*.ipa"

  build-android-pr:
    runs-on: ubuntu-22.04
    if: ${{ github.event.label.name == 'Build Apps for PR' || github.event.label.name == 'Build App for Android' }}
    needs:
      - authorize-build
      - test
    steps:
      - name: ci/checkout-repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: ci/prepare-android-build
        uses: ./.github/actions/prepare-android-build
        env:
          STORE_FILE: "${{ secrets.MM_MOBILE_STORE_FILE }}"
          STORE_ALIAS: "${{ secrets.MM_MOBILE_STORE_ALIAS }}"
          STORE_PASSWORD: "${{ secrets.MM_MOBILE_STORE_PASSWORD }}"
          MATTERMOST_BUILD_GH_TOKEN: "${{ secrets.MATTERMOST_BUILD_GH_TOKEN }}"

      - name: ci/build-android-pr
        env:
          BRANCH_TO_BUILD: "${{ env.BRANCH_TO_BUILD }}"
          AWS_ACCESS_KEY_ID: "${{ secrets.MM_MOBILE_PR_AWS_ACCESS_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY: "${{ secrets.MM_MOBILE_PR_AWS_SECRET_ACCESS_KEY }}"
          MATTERMOST_WEBHOOK_URL: "${{ secrets.MM_MOBILE_PR_MATTERMOST_WEBHOOK_URL }}"
        run: bundle exec fastlane android build --env android.pr
        working-directory: ./fastlane

      - name: ci/upload-android-pr-s3-bucket
        env:
          BRANCH_TO_BUILD: "${{ env.BRANCH_TO_BUILD }}"
          # Uses static credentials; s3_client_oidc not set so Fastlane uses legacy path.
          AWS_ACCESS_KEY_ID: "${{ secrets.MM_MOBILE_PR_AWS_ACCESS_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY: "${{ secrets.MM_MOBILE_PR_AWS_SECRET_ACCESS_KEY }}"
          MATTERMOST_WEBHOOK_URL: "${{ secrets.MM_MOBILE_PR_MATTERMOST_WEBHOOK_URL }}"
        run: |
          echo "::group::Upload to S3 bucket"
          bundle exec fastlane android upload_artifacts_to_s3 --env android.pr
          echo "::endgroup::"
        working-directory: ./fastlane

      - name: ci/upload-android-pr-build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-build-pr-${{ github.run_id }}
          path: "*.apk"
