name: Publish out-of-office source branch
on:
  push:
    branches: [feat/recurring-out-of-office]
    paths: [.github/workflows/out-of-office-apk.yml]
permissions:
  contents: write
jobs:
  publish-source:
    if: github.repository == 'nematsymphony-spec/mattermost-mobile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/recurring-out-of-office
      - name: Apply reviewed source and remove temporary build helpers
        run: |
          git apply --check out-of-office.patch
          git apply out-of-office.patch
          git rm out-of-office.patch
          git add android app assets ios libraries test types
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add recurring out-of-office quiet hours and days off"
          git push origin HEAD:feat/recurring-out-of-office
