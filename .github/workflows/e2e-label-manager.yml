# Matterwick triggers E2E only on pull_request:labeled (see matterwick/server/pull_request.go).
# synchronize alone does nothing — on push we must remove and re-add E2E/Run so
# Matterwick receives a fresh labeled webhook.
#
#   1. refresh-e2e-run-label (synchronize):
#      Remove + re-add E2E/Run via PAT. The in-flight run for the previous commit
#      is superseded by the `concurrency` group in e2e-detox-pr.yml when the new
#      dispatch lands, so nothing needs cancelling here.
#
#   2. add-e2e-run-label (opened):
#      Add E2E/Run unless already present. Skips when E2E/Override is set.
#
#   3. Honor E2E/Override (labeled E2E/Override):
#      Removes all E2E/Run* labels so no new run is dispatched, then posts success
#      on every required e2e-test/* context. In-flight runs are NEVER cancelled —
#      they finish and their finalize step re-checks the label before posting
#      (see .github/actions/e2e-override-label), so a late result cannot re-red
#      a check the maintainer deliberately bypassed.
#
# Fork PR guard (github.event.pull_request.head.repo.full_name == github.repository)
# is applied per-step. Fork PR contexts only get a read-only GITHUB_TOKEN, so
# addLabels / removeLabel would all 403. Mandatory E2E for fork PRs is enforced
# separately.
#
# Base-branch guard: auto E2E/Run refresh only runs for PRs targeting main.
# Stacked PRs (base != main) are skipped so Matterwick is not triggered on every
# intermediate-branch push.
#
name: E2E label manager

on:
  pull_request:
    types:
      - opened
      - synchronize
      - labeled
      - unlabeled

concurrency:
  group: e2e-label-manager-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh-e2e-run-label:
    if: >-
      github.event.action == 'synchronize'
      && github.event.pull_request.base.ref == 'main'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Remove and re-add E2E/Run for Matterwick
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.MATTERMOST_BUILD_GH_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;
            const runLabels = ['E2E/Run', 'E2E/Run-iOS', 'E2E/Run-Android'];

            const {data: labels} = await github.rest.issues.listLabelsOnIssue({
              owner, repo, issue_number: prNumber,
            });
            const labelNames = labels.map((label) => label.name);

            if (labelNames.includes('E2E/Override')) {
              core.info(`PR #${prNumber} has E2E/Override — stripping run labels only.`);
              for (const label of runLabels) {
                if (!labelNames.includes(label)) {
                  continue;
                }
                try {
                  await github.rest.issues.removeLabel({
                    owner, repo, issue_number: prNumber, name: label,
                  });
                } catch (err) {
                  if (err.status !== 404) {
                    throw err;
                  }
                }
              }
              return;
            }

            // Remove first so re-adding always emits pull_request:labeled for Matterwick.
            for (const label of runLabels) {
              try {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: prNumber, name: label,
                });
                core.info(`Removed ${label} from PR #${prNumber} before refresh.`);
              } catch (err) {
                if (err.status !== 404) {
                  throw err;
                }
              }
            }

            core.info(`PR #${prNumber} synchronize — re-adding E2E/Run (Matterwick labeled hook).`);
            await github.rest.issues.addLabels({
              owner, repo, issue_number: prNumber,
              labels: ['E2E/Run'],
            });

  add-e2e-run-label:
    if: >-
      github.event.action == 'opened'
      && github.event.pull_request.base.ref == 'main'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Add E2E/Run (PAT — emits labeled webhook for Matterwick)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.MATTERMOST_BUILD_GH_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;
            const runLabels = ['E2E/Run', 'E2E/Run-iOS', 'E2E/Run-Android'];

            const {data: labels} = await github.rest.issues.listLabelsOnIssue({
              owner, repo, issue_number: prNumber,
            });
            const labelNames = labels.map((label) => label.name);

            if (labelNames.includes('E2E/Override')) {
              core.info(`PR #${prNumber} has E2E/Override label — skipping E2E/Run.`);
              for (const label of runLabels) {
                if (!labelNames.includes(label)) {
                  continue;
                }
                try {
                  await github.rest.issues.removeLabel({
                    owner, repo, issue_number: prNumber, name: label,
                  });
                  core.info(`Removed stale ${label} from PR #${prNumber} (E2E/Override active).`);
                } catch (err) {
                  if (err.status !== 404) {
                    throw err;
                  }
                }
              }
              return;
            }

            if (labelNames.includes('E2E/Run')) {
              core.info(`PR #${prNumber} already has E2E/Run on open — skipping add.`);
              return;
            }

            core.info(`PR #${prNumber} opened — adding E2E/Run via PAT (Matterwick labeled hook).`);
            await github.rest.issues.addLabels({
              owner, repo, issue_number: prNumber,
              labels: ['E2E/Run'],
            });

  e2e-label-manager:
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      pull-requests: write
      # Read-only: this job no longer cancels runs, it only lists them to comment.
      actions: read
      statuses: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # ── Honor E2E/Override: strip run labels, never cancel in-flight E2E ────
      - name: Honor E2E/Override
        if: >-
          github.event.action == 'labeled'
          && github.event.label.name == 'E2E/Override'
          && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;
            const runLabels = ['E2E/Run', 'E2E/Run-iOS', 'E2E/Run-Android'];

            for (const label of runLabels) {
              try {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: prNumber, name: label,
                });
                core.info(`Removed ${label} from PR #${prNumber} (E2E/Override applied).`);
              } catch (err) {
                if (err.status === 404) {
                  core.info(`${label} was not set on PR #${prNumber}; nothing to remove.`);
                  continue;
                }
                throw err;
              }
            }

      # Override means "merge without E2E results", so every required context has to
      # go green on the PR head SHA — whether E2E never ran, already failed, or is
      # still running. Statuses are keyed by SHA, so this also clears earlier failures.
      - name: Publish success on required E2E contexts
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository
          && github.event.action == 'labeled'
          && github.event.label.name == 'E2E/Override'
        uses: ./.github/actions/e2e-override-status
        with:
          commit_sha: ${{ github.event.pull_request.head.sha }}
          target_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Note in-flight E2E runs left running
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository
          && github.event.action == 'labeled'
          && github.event.label.name == 'E2E/Override'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;

            const {data: workflows} = await github.rest.actions.listRepoWorkflows({owner, repo});
            const e2eWorkflow = workflows.workflows.find((workflow) => workflow.name === 'E2E');
            if (!e2eWorkflow) {
              return;
            }

            const activeRuns = [];
            for (const status of ['in_progress', 'queued', 'waiting']) {
              const {data} = await github.rest.actions.listWorkflowRuns({
                owner, repo,
                workflow_id: e2eWorkflow.id,
                status,
                branch: process.env.HEAD_BRANCH,
              });
              for (const run of data.workflow_runs) {
                const matches = !run.pull_requests?.length ||
                  run.pull_requests.some((pr) => pr.number === prNumber);
                if (matches) {
                  activeRuns.push(run);
                }
              }
            }

            if (activeRuns.length === 0) {
              core.info(`No in-flight E2E runs for PR #${prNumber}.`);
              return;
            }

            const links = activeRuns.map((run) => `- [run ${run.id}](${run.html_url}) (${run.status})`).join('\n');
            await github.rest.issues.createComment({
              owner, repo, issue_number: prNumber,
              body: [
                '**E2E/Override applied** — required `e2e-test/*` checks were set to success.',
                '',
                'The following E2E run(s) were left running rather than cancelled; their results will be reported to TSIO but will not re-block this PR while the label is set:',
                links,
              ].join('\n'),
            });

      # Taking the escape hatch away must re-block the PR: without this the
      # success posted above would linger on the head SHA forever.
      - name: Reset required E2E contexts when E2E/Override is removed
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository
          && github.event.action == 'unlabeled'
          && github.event.label.name == 'E2E/Override'
        uses: ./.github/actions/e2e-override-status
        with:
          commit_sha: ${{ github.event.pull_request.head.sha }}
          state: pending
          description: E2E/Override removed — re-run E2E for a real result
          target_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
