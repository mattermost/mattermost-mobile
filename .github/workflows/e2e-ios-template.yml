# Detox iOS E2E — test-system-io orchestration (dispatch-begin / dispatch-run / summary).
# Called from e2e-detox.yml after shared builds and server provisioning complete.
name: Detox iOS E2E Tests Template

on:
  workflow_call:
    secrets:
      MM_MOBILE_E2E_ADMIN_EMAIL:
        required: false
      MM_MOBILE_E2E_ADMIN_USERNAME:
        required: false
      MM_MOBILE_E2E_ADMIN_PASSWORD:
        required: false
      MM_MOBILE_E2E_ZEPHYR_API_KEY:
        required: false
      MM_MOBILE_E2E_TEST_CYCLE_LINK_PREFIX:
        required: false
      MM_MOBILE_E2E_WEBHOOK_URL:
        required: false
      MM_E2E_MASTER_HEALTH_WEBHOOK_URL:
        required: false
      MM_E2E_RELEASE_WEBHOOK_URL:
        required: false
      MM_MOBILE_DETOX_AWS_ACCESS_KEY_ID:
        required: false
      MM_MOBILE_DETOX_AWS_SECRET_ACCESS_KEY:
        required: false
      MM_MOBILE_E2E_WEBHOOK_PUBLIC_BASE_URL:
        required: false
      MM_MOBILE_E2E_CLOUDFLARED_TUNNEL_TOKEN:
        required: false
    inputs:
      MM_TEST_SERVER_URL:
        description: "The test server URL (SITE_1)"
        required: false
        type: string
      MM_TEST_SERVER_URL_2:
        description: "The second test server URL (SITE_2); optional, no automatic fallback"
        required: false
        type: string
      MM_TEST_SERVER_URL_3:
        description: "The third test server URL (SITE_3); optional, no automatic fallback"
        required: false
        type: string
      MM_TEST_USER_NAME:
        description: "The admin username of the test instance"
        required: false
        type: string
      MM_TEST_PASSWORD:
        description: "The admin password of the test instance"
        required: false
        type: string
      MOBILE_VERSION:
        description: "The mobile version to test"
        required: false
        default: ""
        type: string
      run-type:
        type: string
        required: false
        default: "PR"
      record_tests_in_zephyr:
        description: "Record test results in Zephyr"
        required: false
        type: boolean
        default: false
      ios_device_name:
        description: "iPhone simulator name"
        required: false
        type: string
        default: "iPhone 17 Pro"
      ios_device_os_name:
        description: "iPhone simulator OS version"
        required: false
        type: string
        default: "iOS 26.2"
      low_bandwidth_mode:
        description: "Enable low bandwidth mode"
        required: false
        type: boolean
        default: false
      search_path:
        description: "Path to search for test specs (repo- or detox-relative)"
        required: false
        type: string
        default: "detox/e2e/test"
      detox-include-tags:
        description: >
          Comma-separated // Tags: include filter for Test System IO discovery
          (e.g. @ios_pr, @ipad_only). Empty = no include filter.
        required: false
        type: string
        default: ""
      detox-exclude-tags:
        description: >
          Comma-separated // Tags: exclude filter for Test System IO discovery
          (e.g. @ipad_only). Empty = no exclude filter; callers set explicitly.
        required: false
        type: string
        default: ""
      parallelism:
        description: "Number of parallel orchestration workers"
        required: false
        type: string
        default: "20"
      detox_config:
        description: "Detox configuration name (e.g. ios.sim.debug, ios.ipad.debug)"
        required: false
        type: string
        default: "ios.sim.debug"
      artifact_run_id:
        description: "Run ID of the workflow that uploaded ios-build-simulator-*"
        required: false
        type: string
        default: ""
      context_name:
        description: >
          GitHub commit-status context (e.g. e2e-test/detox-ios, e2e-test/detox-ios/main,
          e2e-test/detox-ios/cmt-server-11.9.0). Empty disables orchestration.
        required: false
        type: string
        default: ""
      branch:
        description: "Branch segment for Test System IO composite identity (e.g. pr-123, main, release-2.40)"
        required: false
        type: string
        default: ""
      pr_number:
        description: "PR number for composite identity (digits only used); empty for non-PR runs"
        required: false
        type: string
        default: ""
      commit_sha:
        description: "Commit SHA for composite identity and commit statuses (defaults to MOBILE_VERSION)"
        required: false
        type: string
        default: ""

# Pin: mattermost-test-system-io @ bd85927 (Detox preamble parse + summary unit-fail).
env:
  AWS_REGION: "us-east-1"
  ADMIN_EMAIL: ${{ secrets.MM_MOBILE_E2E_ADMIN_EMAIL }}
  ADMIN_USERNAME: ${{ inputs.MM_TEST_USER_NAME || secrets.MM_MOBILE_E2E_ADMIN_USERNAME }}
  ADMIN_PASSWORD: ${{ inputs.MM_TEST_PASSWORD || secrets.MM_MOBILE_E2E_ADMIN_PASSWORD }}
  DEVICE_NAME: ${{ inputs.ios_device_name }}
  DEVICE_OS_VERSION: ${{ inputs.ios_device_os_name }}
  HEADLESS: "true"
  TYPE: ${{ inputs.run-type }}
  IOS: "true"
  CI: "true"
  RUNNING_E2E: "true"
  ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id || github.run_id }}

permissions:
  contents: read
  id-token: write
  actions: read
  statuses: write
  issues: read

jobs:
  begin:
    name: orch-begin
    if: inputs.context_name != ''
    runs-on: ubuntu-24.04
    outputs:
      identity-json: ${{ steps.cfg.outputs.identity-json }}
      status-context: ${{ steps.cfg.outputs.status-context }}
      identity-branch: ${{ steps.cfg.outputs.identity-branch }}
      report-url: ${{ steps.begin.outputs.report-url }}
      total-units: ${{ steps.begin.outputs.total-units }}
      worker-shards: ${{ steps.matrix.outputs.shards }}
      detox-search-path: ${{ steps.paths.outputs.detox-search-path }}
      detox-include-tags: ${{ steps.paths.outputs.detox-include-tags }}
      detox-exclude-tags: ${{ steps.paths.outputs.detox-exclude-tags }}
      pr-number: ${{ steps.cfg.outputs.pr-number }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.MOBILE_VERSION }}
          persist-credentials: false

      - name: Build Test System IO composite identity
        id: cfg
        env:
          CONTEXT_NAME: ${{ inputs.context_name }}
          BRANCH: ${{ inputs.branch }}
          PR_NUMBER: ${{ inputs.pr_number }}
          COMMIT_SHA: ${{ inputs.commit_sha || inputs.MOBILE_VERSION }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Report name: strip e2e-test/ prefix, replace / with -.
          NAME="${CONTEXT_NAME#e2e-test/}"
          NAME="${NAME//\//-}"
          if [ -z "$COMMIT_SHA" ]; then
            echo "::error::commit_sha is empty"
            exit 1
          fi
          PR_DIGITS=$(echo "${PR_NUMBER}" | tr -cd '0-9')
          if [ -n "$PR_DIGITS" ]; then
            IDENTITY_BRANCH="pr-${PR_DIGITS}"
            IDENTITY=$(jq -nc \
              --arg repo "${GITHUB_REPOSITORY}" \
              --arg sha "${COMMIT_SHA}" \
              --arg run_id "${GITHUB_RUN_ID}" \
              --arg name "${NAME}" \
              --arg attempt "${GITHUB_RUN_ATTEMPT}" \
              --arg branch "${IDENTITY_BRANCH}" \
              --arg pr "${PR_DIGITS}" \
              '{repository:$repo, commit_sha:$sha, gh_run_id:$run_id, name:$name, gh_run_attempt:$attempt, branch:$branch, gh_pr_number:$pr}')
          else
            IDENTITY_BRANCH="${BRANCH}"
            if [ -z "$IDENTITY_BRANCH" ]; then
              echo "::error::branch is empty when pr_number is unset"
              exit 1
            fi
            IDENTITY=$(jq -nc \
              --arg repo "${GITHUB_REPOSITORY}" \
              --arg sha "${COMMIT_SHA}" \
              --arg run_id "${GITHUB_RUN_ID}" \
              --arg name "${NAME}" \
              --arg attempt "${GITHUB_RUN_ATTEMPT}" \
              --arg branch "${IDENTITY_BRANCH}" \
              '{repository:$repo, commit_sha:$sha, gh_run_id:$run_id, name:$name, gh_run_attempt:$attempt, branch:$branch}')
            PR_DIGITS=""
          fi
          {
            echo "identity-json=${IDENTITY}"
            echo "status-context=${CONTEXT_NAME}"
            echo "identity-branch=${IDENTITY_BRANCH}"
            echo "pr-number=${PR_DIGITS}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve detox-search-path
        id: paths
        env:
          SEARCH_PATH: ${{ inputs.search_path }}
          INCLUDE_TAGS: ${{ inputs.detox-include-tags }}
          EXCLUDE_TAGS: ${{ inputs.detox-exclude-tags }}
        run: |
          set -euo pipefail
          SP="${SEARCH_PATH#./}"
          case "$SP" in
            detox/*) SP="${SP#detox/}" ;;
          esac
          {
            echo "detox-search-path=${SP}"
            echo "detox-include-tags=${INCLUDE_TAGS}"
            echo "detox-exclude-tags=${EXCLUDE_TAGS}"
          } >> "$GITHUB_OUTPUT"
          echo "detox-search-path=${SP} include='${INCLUDE_TAGS}' exclude='${EXCLUDE_TAGS}'"

      - name: Worker matrix JSON
        id: matrix
        env:
          N: ${{ inputs.parallelism }}
        run: |
          SHARDS=$(jq -nc --argjson n "${N}" '[range(1; $n+1)]')
          echo "shards=${SHARDS}" >> "$GITHUB_OUTPUT"
          echo "Workers: ${SHARDS}"

      - name: test-system-io dispatch begin
        id: begin
        uses: mattermost/mattermost-test-system-io/.github/actions/test-system-io-dispatch-begin@aa0d692f255d98be1621b500e59387ca0debfb3d
        with:
          use-staging: ${{ vars.E2E_USE_STAGING_TEST_IO_URL == 'true' }}
          framework: detox
          composite-identity: ${{ steps.cfg.outputs.identity-json }}
          repo-dir: ${{ github.workspace }}
          total-reports-expected: ${{ inputs.parallelism }}
          detox-dir: detox
          detox-search-path: ${{ steps.paths.outputs.detox-search-path }}
          detox-include-tags: ${{ steps.paths.outputs.detox-include-tags }}
          detox-exclude-tags: ${{ steps.paths.outputs.detox-exclude-tags }}
          post-pending-commit-status: "true"
          commit-status-context: ${{ inputs.context_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          retest-on-fail: "false"
          retest-budget: "0"
          lease-timeout-ms: "2700000" # 45m
          idle-timeout-ms: "3300000" # 55m

      - name: Begin summary
        env:
          REPORT_URL: ${{ steps.begin.outputs.report-url }}
          TOTAL_UNITS: ${{ steps.begin.outputs.total-units }}
          WORKERS: ${{ inputs.parallelism }}
          SEARCH_PATH: ${{ steps.paths.outputs.detox-search-path }}
          INCLUDE_TAGS: ${{ steps.paths.outputs.detox-include-tags }}
          EXCLUDE_TAGS: ${{ steps.paths.outputs.detox-exclude-tags }}
        run: |
          {
            echo "## Detox iOS orchestration begin"
            echo ""
            echo "- report: ${REPORT_URL}"
            echo "- total units: ${TOTAL_UNITS}"
            echo "- workers: ${WORKERS}"
            echo "- search path: \`${SEARCH_PATH}\`"
            echo "- include tags: \`${INCLUDE_TAGS:-*}\`"
            echo "- exclude tags: \`${EXCLUDE_TAGS:-none}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  workers:
    name: detox-ios-worker-${{ matrix.shard }}
    needs: [begin]
    if: needs.begin.result == 'success'
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.begin.outputs.worker-shards) }}
    env:
      IOS: "true"
      CI_NODE_INDEX: ${{ matrix.shard }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.MOBILE_VERSION }}
          persist-credentials: false

      - name: Rotate logical test sites by shard
        env:
          SERVER_A: ${{ inputs.MM_TEST_SERVER_URL }}
          SERVER_B: ${{ inputs.MM_TEST_SERVER_URL_2 }}
          SERVER_SHARED: ${{ inputs.MM_TEST_SERVER_URL_3 }}
          SHARD_ID: ${{ matrix.shard }}
        run: |
          SERVER_B="${SERVER_B:-$SERVER_A}"
          if (( 10#$SHARD_ID % 2 == 1 )); then
            SITE_1_URL="$SERVER_A"
            SITE_2_URL="$SERVER_B"
          else
            SITE_1_URL="$SERVER_B"
            SITE_2_URL="$SERVER_A"
          fi
          {
            echo "SITE_1_URL=$SITE_1_URL"
            echo "SITE_2_URL=$SITE_2_URL"
            echo "SITE_3_URL=$SERVER_SHARED"
          } >> "$GITHUB_ENV"

      - name: ci/prepare-node-deps
        uses: ./.github/actions/prepare-node-deps

      - name: Cache Homebrew applesimutils
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar/applesimutils
          key: ${{ runner.os }}-${{ runner.arch }}-brew-applesimutils-v1
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-brew-applesimutils-

      - name: Install applesimutils
        run: |
          brew tap wix/brew
          brew trust wix/brew
          if brew list --formula wix/brew/applesimutils &>/dev/null || brew list --formula applesimutils &>/dev/null; then
            brew link --overwrite --force wix/brew/applesimutils 2>/dev/null \
              || brew link --overwrite --force applesimutils
          else
            brew install applesimutils
            brew link --overwrite --force wix/brew/applesimutils 2>/dev/null \
              || brew link --overwrite --force applesimutils
          fi
          command -v applesimutils

      - name: Download iOS simulator build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ios-build-simulator-${{ env.ARTIFACT_RUN_ID }}
          run-id: ${{ env.ARTIFACT_RUN_ID }}
          github-token: ${{ github.token }}
          path: mobile-artifacts

      - name: Unzip iOS simulator build
        run: |
          unzip -o mobile-artifacts/*.zip -d mobile-artifacts/
          rm -f mobile-artifacts/*.zip
          ls -la mobile-artifacts/

      - name: Prepare Low Bandwidth Environment
        id: prepare-low-bandwidth
        uses: ./.github/actions/prepare-low-bandwidth
        if: ${{ inputs.low_bandwidth_mode }}
        with:
          test_server_url: ${{ env.SITE_1_URL }}
          device_name: ${{ env.DEVICE_NAME }}
          download_speed: "3300"
          upload_speed: "3300"
          latency: "500"

      - name: Cache detox node_modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: detox/node_modules
          key: ${{ runner.os }}-detox-deps-${{ hashFiles('detox/package-lock.json') }}
          restore-keys: ${{ runner.os }}-detox-deps-

      - name: Install Detox dependencies
        run: cd detox && npm ci

      - name: Get Xcode version
        id: xcode-version
        run: echo "version=$(xcodebuild -version | head -1 | sed 's/Xcode //')" >> "$GITHUB_OUTPUT"

      - name: Cache Detox framework
        id: detox-framework-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/Library/Detox/ios
          key: ${{ runner.os }}-${{ runner.arch }}-detox-framework-${{ hashFiles('detox/package-lock.json') }}-xcode-${{ steps.xcode-version.outputs.version }}

      - name: Build Detox framework cache
        if: steps.detox-framework-cache.outputs.cache-hit != 'true'
        run: cd detox && npx detox build-framework-cache

      - name: Pre-boot iOS simulator
        env:
          DEVICE_NAME: ${{ env.DEVICE_NAME }}
          DEVICE_OS_VERSION: ${{ env.DEVICE_OS_VERSION }}
        run: bash detox/scripts/preboot_ios_simulator.sh

      - name: Set RUNNING_E2E
        run: |
          echo "RUNNING_E2E=true" > .env
          echo "RUNNING_E2E=true" > detox/.env

      - name: Start Metro bundler
        run: |
          npm run start > metro.log 2>&1 &
          METRO_PID=$!
          echo "METRO_PID=$METRO_PID" >> "$GITHUB_ENV"
          timeout=120
          elapsed=0
          while [ $elapsed -lt $timeout ]; do
            if curl -s http://localhost:8081/status 2>/dev/null | grep -q "packager-status:running"; then
              echo "Metro ready after ${elapsed}s"
              sleep 20
              exit 0
            fi
            sleep 2
            elapsed=$((elapsed + 2))
          done
          echo "::error::Metro bundler did not report packager-status:running within ${timeout}s"
          tail -30 metro.log || true
          exit 1

      - name: Generate Detox CI config
        env:
          DETOX_MAX_WORKERS: "1"
        run: cd detox && npm run detox:config-gen

      - name: test-system-io dispatch run
        uses: mattermost/mattermost-test-system-io/.github/actions/test-system-io-dispatch-run@aa0d692f255d98be1621b500e59387ca0debfb3d
        with:
          use-staging: ${{ vars.E2E_USE_STAGING_TEST_IO_URL == 'true' }}
          framework: detox
          composite-identity: ${{ needs.begin.outputs.identity-json }}
          repo-dir: ${{ github.workspace }}
          artifacts-root: ${{ runner.temp }}/test-system-io
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-job-name: detox-ios-worker-${{ matrix.shard }}
          detox-dir: detox
          detox-config: ${{ inputs.detox_config }}
          batch-size: "1"
          detox-max-workers: "1"
          max-idle-polls: "8"

      - name: Upload Detox debug artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: detox-ios-worker-${{ matrix.shard }}-debug
          path: |
            ${{ runner.temp }}/test-system-io/
            metro.log
          retention-days: 5
          if-no-files-found: ignore

      - name: Cleanup Metro / simulator
        if: always()
        timeout-minutes: 2
        run: |
          if [ -n "${METRO_PID:-}" ]; then
            kill -9 -"$METRO_PID" 2>/dev/null || true
            pkill -9 -f "react-native.*start" 2>/dev/null || true
            pkill -9 -f "metro" 2>/dev/null || true
          fi
          IDS="${SIMULATOR_IDS:-${SIMULATOR_ID:-}}"
          IFS=',' read -ra SIMS <<< "$IDS"
          for sid in "${SIMS[@]}"; do
            [ -z "$sid" ] && continue
            timeout 10 xcrun simctl terminate "$sid" com.mattermost.rnbeta 2>/dev/null || true
          done

  summary:
    name: orch-summary
    needs: [begin, workers]
    if: always() && needs.begin.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      statuses: write
      issues: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.MOBILE_VERSION }}
          persist-credentials: false
          sparse-checkout: |
            .github/actions/e2e-override-label

      - name: Resolve E2E/Override
        id: e2e-override
        uses: ./.github/actions/e2e-override-label
        with:
          pr_number: ${{ needs.begin.outputs.pr-number }}

      - name: test-system-io summary
        id: summary
        continue-on-error: true
        uses: mattermost/mattermost-test-system-io/.github/actions/test-system-io-summary@aa0d692f255d98be1621b500e59387ca0debfb3d
        with:
          use-staging: ${{ vars.E2E_USE_STAGING_TEST_IO_URL == 'true' }}
          framework: detox
          composite-identity: ${{ needs.begin.outputs.identity-json }}
          commit-status-context: ${{ inputs.context_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          update-commit-status: ${{ steps.e2e-override.outputs.override != 'true' && 'true' || 'false' }}
          fail-on-test-failures: ${{ steps.e2e-override.outputs.override != 'true' && 'true' || 'false' }}
          report-type: ${{ inputs.run-type }}
          pr-number: ${{ needs.begin.outputs.pr-number }}
          ref-branch: ${{ needs.begin.outputs.identity-branch }}

      # POST webhook_payload from summary.
      - name: Publish Mattermost webhook
        if: steps.e2e-override.outputs.override != 'true'
        env:
          RUN_TYPE: ${{ inputs.run-type }}
          PAYLOAD: ${{ steps.summary.outputs.webhook_payload }}
          MM_MOBILE_E2E_WEBHOOK_URL: ${{ secrets.MM_MOBILE_E2E_WEBHOOK_URL }}
          MM_E2E_MASTER_HEALTH_WEBHOOK_URL: ${{ secrets.MM_E2E_MASTER_HEALTH_WEBHOOK_URL }}
          MM_E2E_RELEASE_WEBHOOK_URL: ${{ secrets.MM_E2E_RELEASE_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          case "${RUN_TYPE}" in
            MAIN|MASTER) WEBHOOK_URL="${MM_E2E_MASTER_HEALTH_WEBHOOK_URL}" ;;
            RELEASE|RELEASE_CUT) WEBHOOK_URL="${MM_E2E_RELEASE_WEBHOOK_URL}" ;;
            *) WEBHOOK_URL="${MM_MOBILE_E2E_WEBHOOK_URL}" ;;
          esac
          if [ -z "${WEBHOOK_URL}" ] || [ -z "${PAYLOAD}" ]; then
            echo "Skipping webhook (url or payload empty)"
            exit 0
          fi
          curl -fsS -X POST -H "Content-Type: application/json" -d "${PAYLOAD}" "${WEBHOOK_URL}"

      - name: Assert summary
        if: steps.e2e-override.outputs.override != 'true'
        env:
          SUMMARY_OUTCOME: ${{ steps.summary.outcome }}
        run: |
          [ "$SUMMARY_OUTCOME" = "success" ]

  # When context_name is empty the parent never posted a pending status for this
  # platform. If begin is skipped for any other reason, clear the pending row.
  finalize-skipped:
    name: finalize-skipped
    needs: [begin]
    if: always() && needs.begin.result == 'skipped' && inputs.context_name != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout helpers
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.MOBILE_VERSION }}
          persist-credentials: false
          sparse-checkout: |
            .github/actions/update-commit-status

      - name: Mark commit status skipped
        uses: ./.github/actions/update-commit-status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          repository_full_name: ${{ github.repository }}
          commit_sha: ${{ inputs.commit_sha || inputs.MOBILE_VERSION }}
          context: ${{ inputs.context_name }}
          description: "E2E orchestration skipped"
          status: error
