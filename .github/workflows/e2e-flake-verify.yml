# E2E flake verify: runs named Detox specs REPEATS times on a PR commit (candidate) and on a main commit
# (baseline), each run on a fresh device with no retry, and posts one verdict comment and the
# e2e-test/flake-verify commit status on the candidate. See detox/utils/flake-verify.js for how the verdict
# is reached: a pass counts as fixed only if main reproduced the failure and the PR fails significantly less.
#
# It reuses the PR's own E2E run (SOURCE_RUN_ID): its app build and its five test servers (the
# e2e-topology-<run id> artifact, kept 7 days). So:
#   - dispatch it from main (gh workflow run e2e-flake-verify.yml --ref main ...): the file must exist there;
#   - only after the PR's full E2E run has finished: both runs would mutate the same servers;
#   - the PR must be ready for review: a draft PR gets no E2E run, so it has no servers or build.
# Detox Android only for now (the iOS template retries failed specs and tests in place, with no switch to
# turn that off); Maestro is not covered. Both arms use the PR's app build, so a fix in app code cannot be
# verified here: only the test code differs between baseline and candidate.
name: E2E flake verify

on:
  workflow_dispatch:
    inputs:
      PR_NUMBER:
        description: "Pull request to verify"
        required: true
        type: string
      SOURCE_RUN_ID:
        description: "The PR's finished E2E run whose app build and servers are reused"
        required: true
        type: string
      CANDIDATE_SHA:
        description: "PR head commit (full SHA)"
        required: true
        type: string
      BASELINE_SHA:
        description: "Main commit to compare against (full SHA); empty runs the candidate only"
        required: false
        type: string
        default: ""
      PLATFORM:
        description: "Detox platform"
        required: true
        type: choice
        options:
          - android
        default: android
      SPECS:
        description: "Space-separated spec files, e.g. detox/e2e/test/products/channels/channels/archive_channel_from_settings.e2e.ts"
        required: true
        type: string
      TARGETS:
        description: "Space-separated test ids the PR claims to fix (e.g. MM-T4932_3); empty: every test in SPECS"
        required: false
        type: string
        default: ""
      REPEATS:
        description: "Runs per arm (1-60)"
        required: false
        type: string
        default: "10"
      PARALLEL:
        description: "Runs at once (1-4); 1 for specs that change server-wide settings"
        required: false
        type: string
        default: "2"

permissions:
  contents: read

concurrency:
  group: e2e-flake-verify-${{ inputs.PR_NUMBER }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      rerun-specs: ${{ steps.matrix.outputs.rerun-specs }}
      android-site-1-url: ${{ steps.servers.outputs.android-site-1-url }}
      android-site-2-url: ${{ steps.servers.outputs.android-site-2-url }}
      ios-site-1-url: ${{ steps.servers.outputs.ios-site-1-url }}
      ios-site-2-url: ${{ steps.servers.outputs.ios-site-2-url }}
      site-3-url: ${{ steps.servers.outputs.site-3-url }}
    steps:
      # Inputs reach the script only through env, never spliced into its text.
      - name: Validate inputs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ inputs.PR_NUMBER }}
          SOURCE_RUN_ID: ${{ inputs.SOURCE_RUN_ID }}
          CANDIDATE_SHA: ${{ inputs.CANDIDATE_SHA }}
          BASELINE_SHA: ${{ inputs.BASELINE_SHA }}
          SPECS: ${{ inputs.SPECS }}
          TARGETS: ${{ inputs.TARGETS }}
          REPEATS: ${{ inputs.REPEATS }}
          PARALLEL: ${{ inputs.PARALLEL }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const env = process.env;
            const fail = (message) => {
              throw new Error(message);
            };
            const intIn = (value, min, max) => (/^\d+$/).test(value) && Number(value) >= min && Number(value) <= max;
            const SHA = /^[0-9a-f]{40}$/;

            if (!(/^\d+$/).test(env.PR_NUMBER)) fail('PR_NUMBER must be a number');
            if (!(/^\d+$/).test(env.SOURCE_RUN_ID)) fail('SOURCE_RUN_ID must be a number');
            if (!SHA.test(env.CANDIDATE_SHA)) fail('CANDIDATE_SHA must be a full 40-character SHA');
            if (env.BASELINE_SHA && !SHA.test(env.BASELINE_SHA)) fail('BASELINE_SHA must be empty or a full 40-character SHA');
            if (!intIn(env.REPEATS, 1, 60)) fail('REPEATS must be an integer from 1 to 60');
            if (!intIn(env.PARALLEL, 1, 4)) fail('PARALLEL must be an integer from 1 to 4');

            const specs = env.SPECS.split(/\s+/).filter(Boolean);
            if (specs.length < 1 || specs.length > 10) fail('SPECS must name 1 to 10 spec files');
            for (const spec of specs) {
              if (!(/^detox\/e2e\/test\/[A-Za-z0-9_./-]+\.e2e\.ts$/).test(spec) || spec.includes('..')) {
                fail(`Not a Detox spec path: ${spec}`);
              }
            }
            for (const target of env.TARGETS.split(/\s+/).filter(Boolean)) {
              if (!(/^[A-Za-z0-9_.-]+$/).test(target)) fail(`Not a test id: ${target}`);
            }

            const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: Number(env.PR_NUMBER)});
            if (pr.state !== 'open') fail(`PR #${pr.number} is not open`);
            if (pr.head.repo?.full_name !== `${owner}/${repo}`) fail('Fork PRs are not verified');
            if (pr.base.ref !== 'main') fail(`PR #${pr.number} does not target main`);
            if (pr.draft) fail(`PR #${pr.number} is a draft: it has no E2E run or servers; mark it ready for review`);
            if (pr.head.sha !== env.CANDIDATE_SHA) fail(`CANDIDATE_SHA is not the PR head (${pr.head.sha})`);

            // The app build and servers come from this run, so it must be the PR's E2E run of the candidate.
            const {data: source} = await github.rest.actions.getWorkflowRun({owner, repo, run_id: Number(env.SOURCE_RUN_ID)});
            if (source.name !== 'E2E') fail(`Run ${source.id} is "${source.name}", not an E2E run`);
            if (source.head_branch !== pr.head.ref) fail(`Run ${source.id} is not on the PR branch`);
            if (source.head_sha !== env.CANDIDATE_SHA) fail(`Run ${source.id} tested ${source.head_sha}, not CANDIDATE_SHA`);
            if (source.status !== 'completed') fail(`Run ${source.id} has not finished`);

            if (env.BASELINE_SHA) {
              const {data: cmp} = await github.rest.repos.compareCommitsWithBasehead({owner, repo, basehead: `${env.BASELINE_SHA}...main`});
              if (cmp.status !== 'ahead' && cmp.status !== 'identical') fail('BASELINE_SHA is not a commit on main');
            }

            // The servers are shared with the PR's E2E runs: never run on them at the same time.
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'e2e-detox-pr.yml', branch: pr.head.ref, per_page: 100,
            });
            const busy = runs.filter((run) => run.name === 'E2E' && run.status !== 'completed');
            if (busy.length) fail(`An E2E run is still going on the PR branch (${busy.map((run) => run.id).join(', ')}); it shares the servers`);

      - name: Download server topology
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-topology-${{ inputs.SOURCE_RUN_ID }}
          path: topology
          run-id: ${{ inputs.SOURCE_RUN_ID }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Check the servers are still up
        id: servers
        run: |
          for key in android-site-1-url android-site-2-url ios-site-1-url ios-site-2-url site-3-url; do
            url=$(jq -r --arg key "$key" '.[$key] // ""' topology/e2e-topology.json)
            if [[ ! "$url" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?/?$ ]]; then
              echo "::error::$key in the topology is not an https server URL"
              exit 1
            fi
            url=${url%/}
            if ! curl -fsS --max-time 20 -o /dev/null "$url/api/v4/system/ping"; then
              echo "::error::$key does not answer: servers are gone, re-add E2E/Run for a fresh run"
              exit 1
            fi
            echo "$key=$url" >> "$GITHUB_OUTPUT"
          done

      - name: Build run matrix
        id: matrix
        env:
          PLATFORM: ${{ inputs.PLATFORM }}
          SPECS: ${{ inputs.SPECS }}
          REPEATS: ${{ inputs.REPEATS }}
          CANDIDATE_SHA: ${{ inputs.CANDIDATE_SHA }}
          BASELINE_SHA: ${{ inputs.BASELINE_SHA }}
        run: |
          # Arms alternate, so a server slowdown part way through hits both alike.
          matrix=$(jq -nc --argjson repeats "$REPEATS" --arg base "$BASELINE_SHA" --arg cand "$CANDIDATE_SHA" '
            {include: [range(1; $repeats + 1) as $i
              | (if $base != "" then {arm: "baseline", sha: $base} else empty end), {arm: "candidate", sha: $cand}
              | . + {i: $i, suffix: "-fv-\(.arm)-i\($i)"}]}')
          specs=$(xargs <<<"$SPECS")
          rerun=$(jq -nc --arg lane "detox-$PLATFORM" --arg specs "$specs" '{($lane): $specs}')
          {
            echo "matrix=$matrix"
            echo "rerun-specs=$rerun"
          } >> "$GITHUB_OUTPUT"
          echo "$matrix" | jq -r '.include[] | "\(.arm) \(.i) \(.sha)"'

  run:
    name: ${{ matrix.arm }} ${{ matrix.i }}
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.PARALLEL) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      contents: read
      statuses: write
      actions: read
      id-token: write
      issues: read
    # rerun-specs puts e2e-detox.yml on its re-run path: run-type NONE, no TSIO, Zephyr, commit status
    # or channel post; the results go to e2e-rerun-results-detox-android-fv-<arm>-i<i>-a<attempt>.
    uses: ./.github/workflows/e2e-detox.yml
    with:
      MOBILE_VERSION: ${{ matrix.sha }}
      PLATFORM: ${{ inputs.PLATFORM }}
      ANDROID_SITE_1_URL: ${{ needs.plan.outputs.android-site-1-url }}
      ANDROID_SITE_2_URL: ${{ needs.plan.outputs.android-site-2-url }}
      IOS_SITE_1_URL: ${{ needs.plan.outputs.ios-site-1-url }}
      IOS_SITE_2_URL: ${{ needs.plan.outputs.ios-site-2-url }}
      SITE_3_URL: ${{ needs.plan.outputs.site-3-url }}
      run_type: PR
      artifact_run_id: ${{ inputs.SOURCE_RUN_ID }}
      tsio-job-configs: "{}"
      rerun-specs: ${{ needs.plan.outputs.rerun-specs }}
      results-suffix: ${{ matrix.suffix }}
      max-attempts: "1"
    secrets: inherit

  verdict:
    needs: [plan, run]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
      actions: read
    steps:
      # The dispatch ref (main), never the PR: only the verdict script runs here.
      - name: Checkout verdict script
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          sparse-checkout: |
            detox/utils/flake-verify.js
            detox/utils/cli-args.js
          sparse-checkout-cone-mode: false

      # One folder per artifact, named as the artifact: the verdict script reads arm and iteration from it.
      - name: Download run results
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: e2e-rerun-results-*-fv-*
          path: fv-results
          merge-multiple: false

      - name: Compute verdict
        id: verdict
        env:
          REPEATS: ${{ inputs.REPEATS }}
          SPECS: ${{ inputs.SPECS }}
          TARGETS: ${{ inputs.TARGETS }}
        run: |
          set +e
          node detox/utils/flake-verify.js --dir fv-results --repeats "$REPEATS" --specs "$SPECS" \
            --targets "$TARGETS" --markdown verdict.md --out verdict.json
          echo "flake-verify exit=$?"
          cat verdict.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post verdict comment
        if: always() && steps.verdict.outputs.state != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ inputs.PR_NUMBER }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const {owner, repo} = context.repo;
            const MARKER = '<!-- e2e-flake-verify -->';
            const issue_number = Number(process.env.PR_NUMBER);
            const body = `${fs.readFileSync('verdict.md', 'utf8')}\n[Verify run](${process.env.RUN_URL})\n`;
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number, per_page: 100});
            const existing = comments.find((c) => c.user?.login === 'github-actions[bot]' && c.body?.startsWith(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }

      # Informational: not one of the required e2e-test/* contexts (E2E_STATUS_CONTEXTS), so
      # E2E/Override, E2E/Verified and the label manager never touch it.
      - name: Post commit status
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CANDIDATE_SHA: ${{ inputs.CANDIDATE_SHA }}
          STATE: ${{ steps.verdict.outputs.state || 'NO_DATA' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const state = process.env.STATE;
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: process.env.CANDIDATE_SHA,
              context: 'e2e-test/flake-verify',
              state: state === 'PASS' || state === 'UNPROVEN' ? 'success' : 'failure',
              description: `Flake verify: ${state}`,
              target_url: process.env.RUN_URL,
            });

      - name: Fail on FAIL or NO_DATA
        if: always()
        env:
          STATE: ${{ steps.verdict.outputs.state }}
        run: |
          echo "Verdict: ${STATE:-none}"
          if [ "$STATE" != "PASS" ] && [ "$STATE" != "UNPROVEN" ]; then
            exit 1
          fi
