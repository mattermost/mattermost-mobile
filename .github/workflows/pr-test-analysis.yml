---
name: PR Test Analysis

# pull_request_target loads trusted default-branch workflow code. Automatic
# fork analysis remains blocked until the reusable workflow isolates its AI
# workspace from credentials: the reviewed version persists GH_TOKEN in
# .git/config, which its Read tool can access. A diff-only checkout is not
# sufficient protection against prompt injection in PR descriptions/diffs.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - 'release-*'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to analyze'
        required: true
        type: number
      claude_model:
        description: 'Claude model to use (default: claude-sonnet-4-6)'
        required: false
        type: string

concurrency:
  group: test-analyzer-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  statuses: write
  id-token: write

jobs:
  analyze:
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      id-token: write
    # Dispatch is a writer-authorized diagnostic, not proof of fork safety.
    # Re-enable automatic forks only after the toolkit boundary is hardened.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository)
    uses: mattermost/mattermost-test-automation-toolkit/.github/workflows/pr-test-analysis.yml@b51a481e3fe6332053be09800d59da1a8c3e3e2e
    with:
      pr_number: ${{ github.event.pull_request.number || inputs.pr_number }}
      target_repo: mattermost/mattermost-mobile
      claude_model: ${{ inputs.claude_model || vars.CLAUDE_MODEL || 'claude-sonnet-4-6' }}
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL_TEST_PR_ANALYSIS_HUB }}
