---
name: PR Test Analysis

# pull_request_target: the workflow file and secrets come from the base
# branch, so fork PRs can be analyzed. The reusable toolkit workflow only
# takes a PR number, fetches pull/<n>/head as a git diff, and does not
# npm-install or execute PR code. pull_request cannot do this: GitHub
# withholds this repo's secrets from fork pull_request runs even after
# "Approve and run workflows".
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - 'release-*'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to analyze'
        required: true
        type: number
      claude_model:
        description: 'Claude model to use (default: claude-sonnet-4-6)'
        required: false
        type: string

concurrency:
  group: test-analyzer-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  statuses: write
  id-token: write

jobs:
  analyze:
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      id-token: write
    # Drafts are not ready. workflow_dispatch is always allowed (secrets
    # come from this repo, so a fork PR number can be passed manually).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.draft == false
    # Pin to a commit SHA once the reusable workflow is stable. Using @main during initial rollout.
    uses: mattermost/mattermost-test-automation-toolkit/.github/workflows/pr-test-analysis.yml@main
    with:
      pr_number: ${{ github.event.pull_request.number || inputs.pr_number }}
      target_repo: mattermost/mattermost-mobile
      claude_model: ${{ inputs.claude_model || vars.CLAUDE_MODEL || 'claude-sonnet-4-6' }}
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL_TEST_PR_ANALYSIS_HUB }}
