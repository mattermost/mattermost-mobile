# actionlint 1.7.12 does not know two newer keys the autofix workflow needs: the job key cache-mode
# (rhysd/actionlint#745, #762), to save its ledger of sent requests from a workflow_run job, and concurrency.queue
# (GitHub docs, "Control the concurrency of workflows and jobs"), to queue its runs instead of replacing them.
paths:
  .github/workflows/e2e-tests-autofix-on-merge.yml:
    ignore:
      - 'unexpected key "cache-mode" for "job" section'
      - 'unexpected key "queue" for "concurrency" section'
