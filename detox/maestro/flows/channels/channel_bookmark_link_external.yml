# MM-T5611: Tapping a link bookmark opens the URL in an external browser.
#
# PRE-CONDITIONS:
#   - Channel bookmarks enabled on server
#   - Logged-in user in test channel
#
# REQUIRED ENV VARS:
#   - MAESTRO_APP_ID, SITE_1_URL, TEST_USER_EMAIL, TEST_USER_PASSWORD, TEST_CHANNEL_NAME
#
# ASSERTIONS:
#   - Link bookmark can be created from channel info
#   - Bookmark appears in channel header bar after closing channel info
#   - Tapping bookmark opens external browser; dismissing returns to channel
#     (iOS: Safari's "◀ Mattermost" breadcrumb pill proves the hand-off)
#
# testIDs:
#   - channel_header.channel_quick_actions.button
#   - channel.quick_actions.channel_info.action
#   - channel_info.screen
#   - channel_info.add_bookmark.button
#   - channel_bookmark.type.link
#   - channel_bookmark.screen
#   - channel_bookmark_add.link.input (CI APK may only expose accessibility label "Link")
#   - channel_bookmark.add.title.input
#   - channel_bookmark.edit.save_button
#   - close.channel_info.button
#   - channel_header.bookmarks.list
#   - breadcrumb (iOS: Safari's back-to-app pill, not an app testID)
tags:
  - MM-T5611
appId: ${MAESTRO_APP_ID}
---
# # Log in and navigate to the test channel
- runFlow: ../../subflows/auth/login.yml
- runFlow: ../../subflows/navigation/navigate_to_channel.yml

# # Open channel info via the header quick-actions button.
# navigation.header.title has opacity:0 on iOS 26 when the channel is not scrolled.
# The intro_options "Info" action only renders when the channel has no posts; the
# header three-dots → quick_actions bottom sheet always exposes channel_info.
- tapOn:
    id: "channel_header.channel_quick_actions.button"
- extendedWaitUntil:
    visible:
      id: "channel.quick_actions.channel_info.action"
    timeout: 10000
- tapOn:
    id: "channel.quick_actions.channel_info.action"
- extendedWaitUntil:
    visible:
      id: "channel_info.screen"
    timeout: 10000

# # Open the bookmark type picker bottom sheet
- extendedWaitUntil:
    visible:
      id: "channel_info.add_bookmark.button"
    timeout: 30000
- tapOn:
    id: "channel_info.add_bookmark.button"
- extendedWaitUntil:
    visible:
      id: "channel_bookmark.type.link"
    timeout: 10000

# # Select "Add a link"
- tapOn:
    id: "channel_bookmark.type.link"
- extendedWaitUntil:
    visible:
      id: "channel_bookmark.screen"
    timeout: 10000

# # Enter the bookmark URL.
# CI APK: FloatingTextInput testID may not be in the accessibility tree; label "Link" is.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Link"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: "channel_bookmark_add.link.input"
- inputText: "https://mattermost.com"

# # Wait for link metadata fetch to complete.
# The loading indicator (channel_bookmark_add.link.loading) disappears once the server
# has fetched the Open Graph / page-title metadata and autofilled the title input.
# Waiting here ensures the autofill is finished before we overwrite the title field.
- extendedWaitUntil:
    notVisible:
      id: "channel_bookmark_add.link.loading"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: "channel_bookmark.add.title.input"
    timeout: 10000

# # Use OG-autofilled title on CI; overwriting the title field can race metadata fetch.
- waitForAnimationToEnd:
    timeout: 2000

# # Save the bookmark.
# iOS: header NavigationButton testID tap may not fire onPress on CI builds; use label text.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Save"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: "SAVE"

# * Verify the bookmark screen closed
- extendedWaitUntil:
    notVisible:
      id: "channel_bookmark.screen"
    timeout: 30000

# * Verify the bookmark is visible in the channel info bookmark list.
# iOS: the FlatList container exposes its testID; individual item testIDs are not in the tree.
# Android: the FlatList container testID is not exposed; individual item testIDs are.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            id: "channel_info.bookmarks.list"
          timeout: 20000
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            id: "channel_bookmark\\..+\\.title"
          timeout: 20000

# # Close channel info and return to the channel screen
- tapOn:
    id: "close.channel_info.button"
- extendedWaitUntil:
    notVisible:
      id: "channel_info.screen"
    timeout: 10000

# * Verify the bookmark bar is visible in the channel header
- extendedWaitUntil:
    visible:
      id: "channel_header.bookmarks.list"
    timeout: 10000

# # Tap the bookmark to open it in the browser.
# OG metadata sets the title (e.g. "Mattermost"); tap the bookmark bar item by URL text.
- runFlow:
    when:
      platform: iOS
    commands:
      # # Match the bookmark by its OG-autofilled title as a REGEX. Maestro's `text`
      # matcher is a full-string match, so the previous exact "Mattermost" could never
      # match the rendered "Mattermost | Collaboration Platform..." — and because both
      # taps were `optional`, they no-opped silently and the flow passed on iOS without
      # ever opening the browser. Non-optional so a miss fails loudly instead.
      - tapOn:
          text: ".*[Mm]attermost.*"
      # * Verify the browser actually took over, by anchoring on Safari's
      # "◀ Mattermost" back-to-app pill (id: breadcrumb) — the same anchor
      # help_url.yml uses. Do NOT assert the channel's draft input disappeared:
      # openLink -> tryOpenURL -> Linking.openURL hands off to the *external*
      # Safari app rather than presenting an in-app SFSafariViewController, so
      # Mattermost is only suspended, and Maestro's iOS hierarchy still reports
      # the suspended app's elements alongside Safari's. Evidence: CI run
      # 31715496229 failed `notVisible: channel.post_draft.post.input` even
      # though the app logged 'appEntersBackground' / 'Application suspended'
      # 4s after this tap. This is also why help_url.yml only asserts
      # notVisible on Android.
      - extendedWaitUntil:
          visible:
            id: "breadcrumb"
          timeout: 20000
      - takeScreenshot: bookmark-browser-opened
      # # Return to the app from Safari via the breadcrumb pill.
      - tapOn:
          id: "breadcrumb"
      # # Foreground Mattermost if the breadcrumb only dismisses Safari on CI.
      - launchApp:
          clearState: false
          stopApp: false
      - waitForAnimationToEnd:
          timeout: 3000
- runFlow:
    when:
      platform: Android
    commands:
      - waitForAnimationToEnd:
          timeout: 3000
      # # Long-press the bookmark to open the options bottom sheet (handleLongPress).
      # The tap handler (openLink) requires external browser support that may not be
      # available on all emulators, so exercise the long-press path instead.
      - longPressOn:
          id: "channel_bookmark\\..+\\.title"
      # * Verify the bookmark is interactive: the options sheet is shown
      - extendedWaitUntil:
          visible:
            text: "Edit"
          timeout: 15000
      - takeScreenshot: bookmark-options-visible
      # # Dismiss the options bottom sheet
      - pressKey: Back

# * Verify back on the channel screen (browser dismissed on iOS, options sheet on Android).
# 30s, not 10s: on iOS this assertion now runs straight after returning from Safari, so the
# app is resuming from suspension rather than finishing an in-app transition. CI run
# 31732059826 got past the breadcrumb tap and then failed here on the 10s budget.
# help_url.yml allows 30s for the same post-hand-off return.
- extendedWaitUntil:
    visible:
      id: "channel_header.bookmarks.list"
    timeout: 30000
- takeScreenshot: bookmark-options-dismissed
