# MM-T3261_2: In mail mode, tapping Report a Problem hands off to the OS email app.
#
# ANDROID ONLY. The iOS simulator has no Mail app, so the app alerts "mail services are
# not available" and the report screen never dismisses; the dedicated CI step that runs
# this flow exists only in the Android job.
#
# PRE-CONDITIONS:
#   - Logged-in test user (subflows/auth/login.yml)
#   - Non-default server config: SupportSettings.ReportAProblemType=email plus
#     ReportAProblemMail. A dedicated CI step patches it around this flow and restores
#     the default; the flow is exclude-tagged out of the main batch run.
#   - Gmail freshly cleared (adb shell pm clear com.google.android.gm). Once onboarded
#     without an account its compose activity finishes immediately, the share rejects,
#     and the report screen never dismisses.
#
# REQUIRED ENV VARS:
#   - MAESTRO_APP_ID, TEST_USER_EMAIL, TEST_USER_PASSWORD
#
# ASSERTIONS:
#   - The app leaves the report screen in favour of the OS email handler
#   - Settings is reachable again afterwards with Report a Problem listed
#   - Composer contents are not asserted: the CI emulator's Gmail has no account
#
# testIDs:
#   - tab_bar.account.tab
#   - account.screen
#   - account.settings.option
#   - settings.report_problem.option
#   - report_problem.screen
#   - report_problem.report.button
tags:
  - MM-T3261_2
appId: ${MAESTRO_APP_ID}
---
# # Log in as the test user
- runFlow: ../../subflows/auth/login.yml

# # Open the Account tab and Settings, then reveal Report a Problem.
# Report a Problem can sit below the fold; also wait for config sync on first login.
- runFlow: ../../subflows/navigation/open_account.yml
- runFlow: ../../subflows/navigation/open_settings_report_problem.yml
- tapOn:
    id: "settings.report_problem.option"

# * Verify the report screen opened
- extendedWaitUntil:
    visible:
      id: "report_problem.screen"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "report_problem.report.button"
    timeout: 10000

# # Tap Report a problem — the OS email handler takes over.
- tapOn:
    id: "report_problem.report.button"

# * Verify the app left the report screen for the email handler.
- extendedWaitUntil:
    notVisible:
      id: "report_problem.screen"
    timeout: 10000

# # Return to the app from the email handler and leave the report screen.
# Gmail onboarding has no app testID. Resume the host app rather than tapping
# OS-owned Gmail copy, then Back out to Settings from the report screen.
- launchApp:
    stopApp: false
    clearState: false
- waitForAnimationToEnd:
    timeout: 10000

# * Verify the app is back on the report screen it handed off from
- extendedWaitUntil:
    visible:
      id: "report_problem.report.button"
    timeout: 15000

# # Leave the report screen back to Settings
- pressKey: Back

# * Verify Settings is visible again with Report a Problem listed.
- extendedWaitUntil:
    visible:
      id: "settings.report_problem.option"
    timeout: 30000
- takeScreenshot: report-mail-settings-reachable