# MM-T3261: Tapping Report a problem opens the native mail composer or browser.
#
# PRE-CONDITIONS:
#   - Logged-in test user (via subflows/auth/login.yml)
#   - Any license tier; the report action opens a mail composer (paid) or the
#     report link in the browser (free edition)
#
# REQUIRED ENV VARS:
#   - MAESTRO_APP_ID, TEST_USER_EMAIL, TEST_USER_PASSWORD
#
# ASSERTIONS:
#   - Tapping Report a problem leaves the in-app report screen
#   - The native mail composer or external browser is presented
#
# testIDs:
#   - tab_bar.account.tab
#   - account.settings.option
#   - settings.report_problem.option
#   - report_problem.screen
#   - report_problem.report.button
tags:
  - MM-T3261
appId: ${MAESTRO_APP_ID}
---
# # Log in as the test user
- runFlow: ../../subflows/auth/login.yml

# # Open the Account tab and Settings, then reveal Report a Problem.
- runFlow: ../../subflows/navigation/open_account.yml
- extendedWaitUntil:
    visible:
      id: "account.settings.option"
    timeout: 15000
- tapOn:
    id: "account.settings.option"
- scrollUntilVisible:
    element:
      id: "settings.report_problem.option"
    direction: DOWN
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "settings.report_problem.option"
    timeout: 30000
- tapOn:
    id: "settings.report_problem.option"

# * Verify the report screen opened.
- extendedWaitUntil:
    visible:
      id: "report_problem.screen"
    timeout: 30000

# # Tap the Report a problem button (always visible at the bottom of the screen).
- extendedWaitUntil:
    visible:
      id: "report_problem.report.button"
    timeout: 10000
- tapOn:
    id: "report_problem.report.button"

# * Verify the in-app report screen is dismissed in favor of the native
# mail composer or external browser. The exact surface depends on the server
# license tier, so assert the app screen is gone rather than a specific
# native element.
- extendedWaitUntil:
    notVisible:
      id: "report_problem.screen"
    timeout: 30000
- takeScreenshot: report-problem-action-opened
