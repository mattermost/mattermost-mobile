# MM-T4832: User can mute and unmute the microphone during an active call.
#
# PRE-CONDITIONS:
#   - Calls plugin enabled on test channel (seeded by the Calls provisioner)
#   - Active call started during the flow
#
# REQUIRED ENV VARS:
#   - MAESTRO_APP_ID, SITE_1_URL, TEST_USER_EMAIL, TEST_USER_PASSWORD, TEST_CHANNEL_NAME
#
# ASSERTIONS:
#   - Mute button toggles microphone state during the call
#   - Unmute restores the prior mute-button label/state
#
# testIDs:
#   - channel_header.channel_quick_actions.button
#   - channel_info.channel_actions.join_start_call.action
#   - calls.current_call_bar
#   - mute-unmute
#   - leave
tags:
  - MM-T4832
appId: ${MAESTRO_APP_ID}
---
# # Log in and open the test channel
- runFlow: ../../subflows/auth/login.yml
- runFlow: ../../subflows/navigation/navigate_to_channel.yml

# # Start the call from channel quick actions
- runFlow: ../../subflows/calls/join_channel_call.yml

- waitForAnimationToEnd:
    timeout: 3000

# # Expand the call bar into the full call screen (retries the tap; see subflow header).
- runFlow: ../../subflows/calls/open_call_screen.yml

# # Establish a known unmuted state before the test.
# The user may join the call already muted (emulator: no physical mic). If the
# button shows "Unmute" (muted), tap once to unmute, then wait for "Mute".
- runFlow:
    when:
      visible:
        text: "Unmute"
    commands:
      - tapOn:
          id: "mute-unmute"
      - extendedWaitUntil:
          visible:
            text: "Mute"
          timeout: 10000

# * Verify the unmuted baseline (button shows "Mute")
- extendedWaitUntil:
    visible:
      text: "Mute"
    timeout: 5000
- takeScreenshot: calls-mute-initial-state

# # Mute: button shows "Mute" (unmuted) → tap → should show "Unmute" (muted)
- tapOn:
    id: "mute-unmute"

# * Verify the button now shows "Unmute" (confirms muted state)
- extendedWaitUntil:
    visible:
      text: "Unmute"
    timeout: 10000
- takeScreenshot: calls-muted-state

# # Unmute: tap again to restore audio
- tapOn:
    id: "mute-unmute"

# * Verify the button now shows "Mute" (confirms unmuted state)
- extendedWaitUntil:
    visible:
      text: "Mute"
    timeout: 10000
- takeScreenshot: calls-unmuted-state

# # Clean up: leave the call.
# Tapping Leave shows a confirmation dialog; confirm with "Leave call".
- tapOn:
    id: "leave"
- tapOn:
    text: "Leave call"
    optional: true

# * Verify the call screen is gone after leaving
- extendedWaitUntil:
    notVisible:
      id: "mute-unmute"
    timeout: 10000
- takeScreenshot: calls-mute-test-ended
