# Dismiss the first-visit scheduled-post send-button tooltip (blocks channel UI on iOS).
appId: ${MAESTRO_APP_ID}
---
# # Close the tooltip by testID when the tooltip container is in the tree
- runFlow:
    when:
      visible:
        id: "scheduled_post_tutorial_tooltip"
    commands:
      - tapOn:
          id: "scheduled_post.tooltip.close.button"
      - extendedWaitUntil:
          notVisible:
            id: "scheduled_post_tutorial_tooltip"
          timeout: 5000
# # Fall back: dismiss by pressing the close button if it's still visible
# (the tooltip text visibility detection above should catch most cases)
- tapOn:
    id: "scheduled_post.tooltip.close.button"
    optional: true
- tapOn:
    id: "scheduled_post_tutorial_tooltip.close"
    optional: true
