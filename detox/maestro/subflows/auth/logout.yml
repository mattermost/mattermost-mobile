# Sub-flow: Logout from Mattermost (called by login.yml when app is already logged in).
# Usage: - runFlow: ../../subflows/auth/logout.yml
# Requires: MAESTRO_APP_ID env var
appId: ${MAESTRO_APP_ID}
---
# # Dismiss the scheduled-post tooltip if it's blocking the account tab
- tapOn:
    id: "scheduled_post.tooltip.close.button"
    optional: true
- tapOn:
    id: "scheduled_post_tutorial_tooltip.close"
    optional: true

# # Navigate to Account screen
- tapOn:
    id: "tab_bar.account.tab"
- extendedWaitUntil:
    visible:
      id: "account.screen"
    timeout: 10000

# # Tap logout
- tapOn:
    id: "account.logout.option"

# * Verify the confirmation dialog rendered — "Are you sure you want to log out of
# Server 1?" with a "Log out" button.
#
# WHY point: instead of text/id — Maestro YAML uses fuzzy (substring) text matching by
# default, so text: "Log out" matches many background elements in the account screen
# (containers with accessibilityText containing "Log out"). With so many matches,
# index: 1 does NOT reliably target the UIAlertController button.
#
# UIAlertController is a system-level overlay (no app testID). Using point: is
# acceptable for system overlays per project conventions (GUIDELINES.md).
#
# Wait for "Cancel" first — it ONLY exists in the alert dialog (not the account screen),
# which confirms the dialog is fully rendered and the button bounds are stable.
# Log out button is consistently at ~67%,57% on this device (center of [201,480][336,524]
# on a 402x874 pt screen). Cancel is at ~33%,57%.
- extendedWaitUntil:
    visible:
      text: "Cancel"
    timeout: 10000

# # Tap the "Log out" button in the UIAlertController.
# iOS 26 lays the buttons out horizontally on this device (Cancel left, Log out right),
# which is the single position tapped below. If a vertical layout is ever observed, add
# a second tap for it — do not guess coordinates for a layout nobody has seen.
- runFlow:
    when:
      platform: iOS
    commands:
      # # Tap the "Log out" button in UIAlertController.
      # Bounds: [201,480][336,524] → center at 67%,57%.
      # Coordinate tap bypasses account-screen "Log out" text matches.
      - tapOn:
          point: "70%,57%"

# # Android: AlertDialog IS in the app hierarchy. Tap positive button by resource-id.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: "android:id/button1"

# * Verify logout completed — login form or server list.
# Logout may navigate to the server list (multiple servers) or directly to the login
# form (single server). Accept either, but anchor the login form per platform:
# login_form.username.input is a FloatingTextInput, whose testID is not queryable by
# id: on iOS (GUIDELINES §3), so checking it there is vacuously true and would send a
# successful iOS logout into the server-list wait. iOS uses the RNEButton
# login_form.forgot_password.button instead, matching login.yml's login-form anchor.
- runFlow:
    when:
      platform: iOS
      notVisible:
        id: "login_form.forgot_password.button"
    commands:
      - extendedWaitUntil:
          visible:
            id: "server_list.screen"
          timeout: 60000
- runFlow:
    when:
      platform: Android
      notVisible:
        id: "login_form.username.input"
    commands:
      - extendedWaitUntil:
          visible:
            id: "server_list.screen"
          timeout: 60000
