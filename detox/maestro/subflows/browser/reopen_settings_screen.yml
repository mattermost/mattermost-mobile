# Sub-flow: return to Settings list from an unknown screen (browser hand-off recovery).
# Usage: - runFlow: ../../subflows/browser/reopen_settings_screen.yml
appId: ${MAESTRO_APP_ID}
---
# # Relaunch the app, keeping the session (iOS may stopApp; Android must not)
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          stopApp: true
          clearState: false
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          stopApp: false
          clearState: false
- waitForAnimationToEnd:
    timeout: 30000

# # Re-anchor on the Home tab, then navigate Account > Settings
# 60s, not 30s: this runs right after `launchApp stopApp: true`, so the app is
# cold-starting (database open, session rehydrate, first render) on a CI simulator
# that is also still tearing down Safari — not finishing an in-app transition.
- extendedWaitUntil:
    visible:
      id: "tab_bar.home.tab"
    timeout: 60000
- tapOn:
    id: "tab_bar.account.tab"
- extendedWaitUntil:
    visible:
      id: "account.settings.option"
    timeout: 10000
- tapOn:
    id: "account.settings.option"
