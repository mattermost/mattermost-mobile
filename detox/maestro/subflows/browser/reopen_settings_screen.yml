# Sub-flow: return to Settings list from an unknown screen (browser hand-off recovery).
# Usage: - runFlow: ../../subflows/browser/reopen_settings_screen.yml
appId: ${MAESTRO_APP_ID}
---
# # Relaunch the app, keeping the session (iOS may stopApp; Android must not)
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          stopApp: true
          clearState: false
          arguments:
            disableTutorials: true
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          stopApp: false
          clearState: false
          arguments:
            disableTutorials: true
- waitForAnimationToEnd:
    timeout: 30000

# # Re-anchor on the Home tab, then navigate Account > Settings
- extendedWaitUntil:
    visible:
      id: "tab_bar.home.tab"
    timeout: 30000
- tapOn:
    id: "tab_bar.account.tab"
- extendedWaitUntil:
    visible:
      id: "account.settings.option"
    timeout: 10000
- tapOn:
    id: "account.settings.option"
